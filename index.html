bit 1d8 dégâts de foudre et ne peut pas effectuer d’attaque d’Opportunité jusqu’au début de son tour suivant.\n\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"poussiere-d-etoile","name":"Poussière d’étoile","level":0,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez une particule de lumière vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d8 dégâts radiants et, jusqu’à la fin de votre tour suivant, elle émet une Lumière faible dans un rayon de 3 m et ne peut bénéficier de l’état Invisible.\n\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["bard","druid"],"source":"SRD 5.2.1"},{"canonicalId":"prestidigitation","name":"Prestidigitation","level":0,"school":"transmutation","castingTime":"action","range":"3 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"jusqu’à 1 heure","concentration":false,"ritual":false,"description":"Vous produisez un effet magique à portée. Choisissez l’effet parmi les options ci-après. Si vous lancez ce sort plusieurs fois, vous pouvez faire coexister jusqu’à trois de ces effets non instantanés.\n\nEffet sensoriel. Vous produisez un effet sensoriel instantané et inoffensif.\n\nJeu avec le feu. Vous allumez ou éteignez une bougie, une torche ou un petit feu de camp.\n\nNettoyage ou maculage. Vous nettoyez ou souillez en un instant un objet (max 30 L).\n\nSensation mineure. Vous refroidissez, réchauffez ou parfumez de la matière inerte pendant 1 heure.\n\nMarque magique. Vous faites apparaître une couleur ou un symbole pendant 1 heure.\n\nCréation mineure. Vous créez une babiole ou une image illusoire dans votre main jusqu’à la fin de votre tour suivant.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"stabilisation","name":"Stabilisation","level":0,"school":"necromancy","castingTime":"action","range":"4,50 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Choisissez à portée une créature dotée de 0 point de vie, mais qui n’est pas morte. La créature est Stabilisée. Amélioration de sort mineur. La portée augmente lorsque vous atteignez les niveaux 5 (9 m), 11 (18 m) et 17 (36 m).","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"thaumaturgie","name":"Thaumaturgie","level":0,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"jusqu’à 1 minute","concentration":false,"ritual":false,"description":"Vous engendrez une manifestation surnaturelle mineure. Vous créez l’un des effets magiques suivants à portée. Si vous lancez ce sort plusieurs fois, vous pouvez faire coexister jusqu’à trois de ces effets d’une minute.\n\nBruit fantôme. Un son bref émane d’un point à portée.\n\nJeu avec le feu. Vous manipulez des flammes (vacillement, couleur).\n\nMain invisible. Ouverture ou fermeture soudaine d’une porte/fenêtre.\n\nSecousse. Léger tremblement de terre inoffensif.\n\nVoix retentissante. Votre voix porte trois fois plus fort (Avantage en Intimidation).\n\nYeux modifiés. Vous altérez l’aspect de vos yeux.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"trait-de-feu","name":"Trait de feu","level":0,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez un grain enflammé vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d10 dégâts de feu. Tout objet inflammable touché par ce sort s’embrase s’il n’est pas porté. Amélioration de sort mineur. Les dégâts augmentent de 1d10 lorsque vous atteignez les niveaux 5 (2d10), 11 (3d10) et 17 (4d10).","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"contact-glacial","name":"Contact glacial","level":0,"school":"necromancy","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous canalisez l’étreinte d’outre-tombe et effectuez une attaque de sort au corps à corps contre une cible à portée d’allonge. Si l’attaque touche, la cible subit 1d10 dégâts nécrotiques et ne peut pas récupérer de points de vie jusqu’à la fin de votre tour suivant. Amélioration de sort mineur. Les dégâts augmentent de 1d10 lorsque vous atteignez les niveaux 5 (2d10), 11 (3d10) et 17 (4d10).","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"flamme-sacree","name":"Flamme sacrée","level":0,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une radiance embrasée s’abat sur une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Dextérité sous peine de subir 1d8 dégâts radiants. Les Abris partiels et supérieurs ne confèrent aucun bénéfice dans le cadre de ce jet de sauvegarde. Amélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"flammes","name":"Flammes","level":0,"school":"conjuration","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Une flamme vacillante prend vie dans votre main et y persiste pour toute la durée. Tant qu’elles sont dans votre main, les flammes ne produisent pas de chaleur et n’embrasent rien, mais projettent une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. Le sort prend fin si vous le relancez.\n\nJusqu’à la fin du sort, vous pouvez entreprendre l’action Magie pour projeter des flammes sur une créature ou un objet dans un rayon de 18 m. Effectuez une attaque de sort à distance. Si l’attaque touche, la cible subit 1d8 dégâts de feu.\n\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"illusion-mineure","name":"Illusion mineure","level":0,"school":"illusion","castingTime":"action","range":"9 m","components":{"verbal":false,"somatic":true,"material":true,"materialText":"un peu de laine brute"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Vous créez à portée un son ou l’image d’un objet qui persiste pour toute la durée. La description qui suit détaille les effets pour chacun. L’illusion prend fin si vous relancez ce sort.\n\nUne créature qui entreprend l’action Étude pour examiner le son ou l’image peut comprendre qu’il s’agit d’une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l’illusion continue de la percevoir, quoiqu’amoindrie.\n\nSon. Si vous créez un son, son volume peut aller du murmure au cri. Il peut prendre votre voix, celle de quelqu’un d’autre, imiter le rugissement du lion, un roulement de tambour ou une autre forme de votre choix. Le son se prolonge sans discontinuer pour toute la durée, à moins que vous préfériez ne le faire intervenir que de temps à autre jusqu’à la fin du sort.\n\nImage. Si vous créez l’image d’un objet, comme une chaise, des empreintes boueuses ou un petit coffre, il doit pouvoir tenir dans un Cube de 1,50 m. L’image ne peut créer ni son, ni lumière, ni odeur, ni autre effet sensoriel. Toute interaction physique avec l’image percera l’illusion, car elle n’est pas tangible.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"lumiere","name":"Lumière","level":0,"school":"evocation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une luciole ou de la mousse phosphorescente"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez physiquement un objet de taille G ou inférieure qui n’est porté par personne d’autre. Jusqu’à la fin du sort, l’objet produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. La lumière peut présenter les teintes de votre choix. Recouvrir l’objet d’une surface opaque bloque la lumière. Le sort prend fin si vous le relancez.","classes":["bard","cleric","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"lumieres-dansantes","name":"Lumières dansantes","level":0,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de phosphore"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez jusqu’à quatre lumières de la taille d’une torche, à portée ; pour toute la durée, elles ont l’aspect de torches, de lanternes ou de globes luisants qui flottent dans les airs. Au lieu de cela, vous pouvez fusionner les quatre lumières en forme luisante vaguement humaine, de taille M.\n\nQuelle que soit la forme choisie, chaque lueur émet une Lumière faible dans un rayon de 3 m.\n\nPar une action Bonus, vous pouvez déplacer les lueurs d’un maximum de 18 m vers un nouvel espace à portée. Chaque lueur du sort, à sa création, doit se situer dans un rayon de 6 m d’une autre, et s’évanouit si jamais elle quitte la portée du sort.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"main-du-mage","name":"Main du mage","level":0,"school":"conjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Une main spectrale et flottante apparaît en un point que vous choisissez à portée. La main persiste pour toute la durée. Elle disparaît si jamais elle se retrouve à plus de 9 m de vous ou si vous relancez ce sort.\n\nÀ l’incantation du sort, la main peut servir à manipuler un objet, à ouvrir une porte ou un récipient non verrouillés, à ranger ou récupérer un objet dans un conteneur ouvert ou à déverser le contenu d’une fiole. Au prix de l’action Magie à vos tours suivants, vous pouvez de nouveau contrôler ainsi la main.\n\nDans le cadre de cette action, vous pouvez déplacer la main d’un maximum de 9 m. Elle ne peut ni attaquer, ni activer d’objet magique, ni porter plus de 5 kg.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"moquerie-cruelle","name":"Moquerie cruelle","level":0,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous adressez un chapelet d’insultes assaisonnées de subtils enchantements à une créature que vous voyez ou entendez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir 1d6 dégâts psychiques, ainsi que le Désavantage à son prochain jet d’attaque intervenant avant la fin de son tour suivant.\n\nAmélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).","classes":["bard"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-de-givre","name":"Rayon de givre","level":0,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un rayon de lueur zébrée bleuâtre et glaciale file vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d8 dégâts de froid et sa Vitesse est réduite de 3 m jusqu’au début de votre tour suivant. Amélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"reparation","name":"Réparation","level":0,"school":"transmutation","castingTime":"1 minute","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"deux magnétites"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Ce sort répare une dégradation (déchirure ou bris) sur l’objet que vous touchez, comme un maillon de chaîne brisé, une clef en deux morceaux, une cape déchirée ou une outre percée. Tant que la dégradation ne dépasse pas 30 cm dans quelque dimension que ce soit, vous la réparez et il n’en reste nulle trace.\n\nCe sort peut réparer la structure physique d’un objet magique, mais il ne lui rendra pas sa magie.","classes":["bard","cleric","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"resistance","name":"Résistance","level":0,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous touchez physiquement une créature consentante en choisissant un type de dégâts entre : acide, contondants, feu, foudre, froid, nécrotiques, perforants, poison, radiants, tonnerre et tranchants. Quand la créature subit des dégâts du type retenu avant la fin du sort, elle réduit les dégâts subis de 1d4. Une même créature ne peut bénéficier qu’une fois par tour de ce sort.","classes":["cleric","druid"],"source":"SRD 5.2.1"}];
</script>
<script>
(function () {
  'use strict';

  var SORTS = (window.SPELLS || []).slice();

  // ---------------------------------------------------------------- libellés

  var ECOLES = {
    abjuration:    'Abjuration',
    conjuration:   'Invocation',
    divination:    'Divination',
    enchantment:   'Enchantement',
    evocation:     'Évocation',
    illusion:      'Illusion',
    necromancy:    'Nécromancie',
    transmutation: 'Transmutation'
  };

  var CLASSES = {
    bard:     'Barde',
    cleric:   'Clerc',
    druid:    'Druide',
    paladin:  'Paladin',
    ranger:   'Rôdeur',
    sorcerer: 'Ensorceleur',
    warlock:  'Occultiste',
    wizard:   'Magicien'
  };

  // Le champ castingTime est du texte libre (une vingtaine de formulations,
  // parfois une phrase entière pour les réactions). On le range dans une
  // poignée de catégories, seules utiles pour filtrer.
  var TEMPS = [
    { cle: 'action',   nom: 'Action' },
    { cle: 'bonus',    nom: 'Action bonus' },
    { cle: 'reaction', nom: 'Réaction' },
    { cle: 'min',      nom: '1 à 10 minutes' },
    { cle: 'long',     nom: '1 heure et plus' }
  ];

  function categorieTemps(txt) {
    var t = sansAccents(String(txt || '').toLowerCase());
    if (t.indexOf('reaction') === 0) return 'reaction';
    if (t.indexOf('action bonus') === 0) return 'bonus';
    if (t.indexOf('action') === 0) return 'action';
    if (/^\d+\s*(minute|minutes)/.test(t)) return 'min';
    if (/heure/.test(t)) return 'long';
    return 'action';
  }

  function sansAccents(s) {
    return s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s;
  }

  function niveauCourt(n) { return n === 0 ? '✦' : String(n); }

  function niveauLong(n) {
    return n === 0 ? 'Sort mineur' : 'Niveau ' + n;
  }

  function lettresComposantes(c) {
    var l = [];
    if (c && c.verbal) l.push('V');
    if (c && c.somatic) l.push('S');
    if (c && c.material) l.push('M');
    return l;
  }

  // -------------------------------------------------- préparation des données

  SORTS.forEach(function (s) {
    s._recherche = sansAccents((
      s.name + ' ' + s.description + ' ' +
      (s.components && s.components.materialText ? s.components.materialText : '') + ' ' +
      (s.summonedMonsters || []).join(' ')
    ).toLowerCase());
    s._temps = categorieTemps(s.castingTime);
    s._comp = lettresComposantes(s.components);
  });

  var NIVEAUX = [];
  var i;
  for (i = 0; i <= 9; i++) {
    if (SORTS.some(function (s) { return s.level === i; })) NIVEAUX.push(i);
  }

  // ------------------------------------------------------------------- filtres

  var etat = {
    q: '',
    niveaux: [],
    ecoles: [],
    classes: [],
    temps: '',
    concentration: false,
    rituel: false,
    comp: [],
    tri: 'nom',
    vue: 'tous',
    barre: false
  };

  var MEMOIRE = 'sorts-dnd-filtres';
  var MEMOIRE_SEL = 'sorts-dnd-mes-sorts';

  // ---------------------------------------------------------------- mes sorts
  // La sélection vit dans sa propre clé : « Tout effacer » remet les filtres
  // à zéro, il ne doit surtout pas vider la liste patiemment constituée.

  var selection = [];

  function idDe(s) { return s.canonicalId || s.name; }

  function chargerSelection() {
    try {
      var brut = localStorage.getItem(MEMOIRE_SEL);
      if (!brut) return;
      var sauve = JSON.parse(brut);
      if (!Array.isArray(sauve)) return;
      var connus = {};
      SORTS.forEach(function (s) { connus[idDe(s)] = true; });
      selection = sauve.filter(function (id) {
        return typeof id === 'string' && connus[id];
      });
    } catch (e) { /* stockage bloqué : on repart sans sélection */ }
  }

  function retenirSelection() {
    try { localStorage.setItem(MEMOIRE_SEL, JSON.stringify(selection)); } catch (e) {}
  }

  function estChoisi(s) { return selection.indexOf(idDe(s)) !== -1; }

  function basculerChoix(s) {
    bascule(selection, idDe(s));
    retenirSelection();
  }

  function chargerEtat() {
    try {
      var brut = localStorage.getItem(MEMOIRE);
      if (!brut) return;
      var sauve = JSON.parse(brut);
      Object.keys(etat).forEach(function (k) {
        if (sauve[k] !== undefined && typeof sauve[k] === typeof etat[k]) etat[k] = sauve[k];
      });
    } catch (e) { /* navigation privée, stockage bloqué : on repart à vide */ }
  }

  function retenirEtat() {
    try { localStorage.setItem(MEMOIRE, JSON.stringify(etat)); } catch (e) {}
  }

  function bascule(tableau, valeur) {
    var k = tableau.indexOf(valeur);
    if (k === -1) tableau.push(valeur); else tableau.splice(k, 1);
  }

  function filtresActifs() {
    return etat.q !== '' || etat.niveaux.length > 0 || etat.ecoles.length > 0 ||
           etat.classes.length > 0 || etat.temps !== '' || etat.concentration ||
           etat.rituel || etat.comp.length > 0;
  }

  // Aucune case cochée dans un groupe = tout le groupe. Plusieurs cases
  // cochées = l'une OU l'autre. Deux groupes différents se cumulent (ET).
  function retenu(s) {
    if (etat.q) {
      var mots = sansAccents(etat.q.toLowerCase()).split(/\s+/).filter(Boolean);
      for (var m = 0; m < mots.length; m++) {
        if (s._recherche.indexOf(mots[m]) === -1) return false;
      }
    }
    if (etat.niveaux.length && etat.niveaux.indexOf(s.level) === -1) return false;
    if (etat.ecoles.length && etat.ecoles.indexOf(s.school) === -1) return false;
    if (etat.classes.length && !etat.classes.some(function (c) {
      return (s.classes || []).indexOf(c) !== -1;
    })) return false;
    if (etat.temps && s._temps !== etat.temps) return false;
    if (etat.concentration && !s.concentration) return false;
    if (etat.rituel && !s.ritual) return false;
    for (var c2 = 0; c2 < etat.comp.length; c2++) {
      if (s._comp.indexOf(etat.comp[c2]) === -1) return false;
    }
    return true;
  }

  function trier(liste) {
    var parNom = function (a, b) {
      return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
    };

    var base;
    if (etat.tri === 'niveau') {
      base = function (a, b) { return a.level - b.level || parNom(a, b); };
    } else if (etat.tri === 'ecole') {
      base = function (a, b) {
        return (ECOLES[a.school] || '').localeCompare(ECOLES[b.school] || '', 'fr') ||
               a.level - b.level || parNom(a, b);
      };
    } else {
      base = parNom;
    }

    // Pendant une recherche, la fouille porte aussi sur les descriptions :
    // « boule de feu » remonte donc Boule de feu, mais aussi les sorts qui la
    // citent. On fait passer devant ceux dont le NOM correspond, sinon le sort
    // cherché se perd au milieu des renvois.
    if (etat.q) {
      var mots = sansAccents(etat.q.toLowerCase()).split(/\s+/).filter(Boolean);
      var rang = function (s) {
        var nom = sansAccents(s.name.toLowerCase());
        if (nom === sansAccents(etat.q.toLowerCase())) return 0;   // nom exact
        if (mots.every(function (m) { return nom.indexOf(m) !== -1; })) return 1; // tous les mots dans le nom
        if (mots.some(function (m) { return nom.indexOf(m) !== -1; })) return 2;  // une partie du nom
        return 3;                                                   // seulement dans le texte
      };
      return liste.sort(function (a, b) { return rang(a) - rang(b) || base(a, b); });
    }

    return liste.sort(base);
  }

  // ------------------------------------------------------------- construction

  function el(balise, classe, texte) {
    var n = document.createElement(balise);
    if (classe) n.className = classe;
    if (texte !== undefined) n.textContent = texte;
    return n;
  }

  function puce(texte, actif, surClic, classeSup, styleSup) {
    var b = el('button', 'puce' + (classeSup ? ' ' + classeSup : ''));
    b.type = 'button';
    b.setAttribute('aria-pressed', actif ? 'true' : 'false');
    if (styleSup) b.setAttribute('style', styleSup);
    if (typeof texte === 'string') b.textContent = texte; else b.appendChild(texte);
    b.addEventListener('click', surClic);
    return b;
  }

  function groupe(intitule, contenu) {
    var g = el('div', 'groupe');
    g.appendChild(el('div', 'intitule', intitule));
    g.appendChild(contenu);
    return g;
  }

  function construireFiltres() {
    var zone = document.getElementById('filtres');
    zone.textContent = '';

    // Niveaux
    var pn = el('div', 'puces');
    NIVEAUX.forEach(function (n) {
      pn.appendChild(puce(n === 0 ? 'Mineurs' : String(n), etat.niveaux.indexOf(n) !== -1, function () {
        bascule(etat.niveaux, n); rendre();
      }));
    });
    zone.appendChild(groupe('Niveau', pn));

    // Écoles
    var pe = el('div', 'puces');
    Object.keys(ECOLES).forEach(function (cle) {
      var interne = el('span');
      interne.appendChild(el('span', 'pastille'));
      interne.appendChild(document.createTextNode(ECOLES[cle]));
      pe.appendChild(puce(interne, etat.ecoles.indexOf(cle) !== -1, function () {
        bascule(etat.ecoles, cle); rendre();
      }, 'ecole ec-' + cle));
    });
    zone.appendChild(groupe('École de magie', pe));

    // Classes
    var pc = el('div', 'puces');
    Object.keys(CLASSES).forEach(function (cle) {
      pc.appendChild(puce(CLASSES[cle], etat.classes.indexOf(cle) !== -1, function () {
        bascule(etat.classes, cle); rendre();
      }));
    });
    zone.appendChild(groupe('Classe', pc));

    // Propriétés + composantes
    var pp = el('div', 'puces');
    pp.appendChild(puce('Concentration', etat.concentration, function () {
      etat.concentration = !etat.concentration; rendre();
    }));
    pp.appendChild(puce('Rituel', etat.rituel, function () {
      etat.rituel = !etat.rituel; rendre();
    }));
    [['V', 'Verbale'], ['S', 'Somatique'], ['M', 'Matérielle']].forEach(function (p) {
      var b = puce(p[0] + ' · ' + p[1], etat.comp.indexOf(p[0]) !== -1, function () {
        bascule(etat.comp, p[0]); rendre();
      });
      pp.appendChild(b);
    });
    zone.appendChild(groupe('Propriétés et composantes', pp));

    // Temps d'incantation + tri + remise à zéro
    var outils = el('div', 'rangee-outils');

    var selTemps = el('select');
    selTemps.setAttribute('aria-label', "Temps d'incantation");
    var o0 = el('option', null, "Temps d'incantation : tous");
    o0.value = '';
    selTemps.appendChild(o0);
    TEMPS.forEach(function (t) {
      var o = el('option', null, t.nom);
      o.value = t.cle;
      selTemps.appendChild(o);
    });
    selTemps.value = etat.temps;
    selTemps.addEventListener('change', function () { etat.temps = selTemps.value; rendre(); });
    outils.appendChild(selTemps);

    var selTri = el('select');
    selTri.setAttribute('aria-label', 'Tri');
    [['nom', 'Tri : alphabétique'], ['niveau', 'Tri : par niveau'], ['ecole', 'Tri : par école']]
      .forEach(function (t) {
        var o = el('option', null, t[1]);
        o.value = t[0];
        selTri.appendChild(o);
      });
    selTri.value = etat.tri;
    selTri.addEventListener('change', function () { etat.tri = selTri.value; rendre(); });
    outils.appendChild(selTri);

    var raz = el('button', 'btn', '✕ Tout effacer');
    raz.type = 'button';
    raz.id = 'raz';
    raz.disabled = !filtresActifs();
    raz.addEventListener('click', function () {
      etat.q = ''; etat.niveaux = []; etat.ecoles = []; etat.classes = [];
      etat.temps = ''; etat.concentration = false; etat.rituel = false; etat.comp = [];
      document.getElementById('recherche').value = '';
      rendre();
    });
    outils.appendChild(raz);

    zone.appendChild(outils);
  }

  function ligneSousTitre(s) {
    var bouts = [niveauLong(s.level), ECOLES[s.school] || s.school];
    return bouts.join(' · ');
  }

  // Un seul sort déplié à la fois. On retient la carte ouverte pour la
  // refermer quand on en ouvre une autre : sans ça, on finit avec dix
  // descriptions dépliées et on fait défiler à l'aveugle pour retrouver la
  // suivante — particulièrement pénible au doigt.
  var carteOuverte = null;

  function carte(s) {
    var art = el('article', 'sort ec-' + s.school);

    var tete = el('button', 'sort-entete');
    tete.type = 'button';
    tete.setAttribute('aria-expanded', 'false');

    var niv = el('div', 'niveau' + (s.level === 0 ? ' mineur' : ''), niveauCourt(s.level));
    niv.title = niveauLong(s.level);
    tete.appendChild(niv);

    var titre = el('div', 'sort-titre');
    var nom = el('div', 'sort-nom');
    nom.appendChild(document.createTextNode(s.name));
    if (s.concentration) nom.appendChild(el('span', 'etiq conc', 'CONC.'));
    if (s.ritual) nom.appendChild(el('span', 'etiq rit', 'RITUEL'));
    if (s._comp.length) nom.appendChild(el('span', 'etiq comp', s._comp.join(' ')));
    titre.appendChild(nom);
    titre.appendChild(el('div', 'sort-sous', ligneSousTitre(s)));
    tete.appendChild(titre);

    tete.appendChild(el('span', 'chevron', '›'));

    var etoile = el('button', 'etoile');
    etoile.type = 'button';
    majEtoile(etoile, s);
    etoile.addEventListener('click', function () {
      basculerChoix(s);
      majEtoile(etoile, s);
      majOnglets();
      // Dans « Mes sorts », retirer un sort le fait disparaître de la liste
      // affichée : on refait le rendu plutôt que de laisser une carte fantôme.
      if (etat.vue === 'mes') rendre();
    });

    var haut = el('div', 'sort-haut');
    haut.appendChild(tete);
    haut.appendChild(etoile);
    art.appendChild(haut);

    var corps = el('div', 'sort-corps');
    corps.hidden = true;
    art.appendChild(corps);

    // Le contenu détaillé n'est construit qu'à la première ouverture. Bâtir
    // les 339 descriptions d'emblée (jusqu'à 4 000 caractères chacune) fait
    // ramer un téléphone au moindre changement de filtre, pour du texte que
    // l'on ne regarde presque jamais en entier.
    var rempli = false;
    function remplirCorps() {
      if (rempli) return;
      rempli = true;

      var fiche = el('dl', 'fiche');
      function ligne(cle, valeur) {
        if (!valeur) return;
        fiche.appendChild(el('dt', null, cle));
        fiche.appendChild(el('dd', null, valeur));
      }
      ligne('Incantation', s.castingTime);
      ligne('Portée', s.range);
      ligne('Durée', s.duration);
      var comp = s._comp.join(', ');
      if (s.components && s.components.materialText) {
        comp += ' (' + s.components.materialText + ')';
      }
      ligne('Composantes', comp || '—');
      corps.appendChild(fiche);

      var desc = el('div', 'description');
      String(s.description || '').split(/\n{2,}/).forEach(function (para) {
        // Un seul sort du lot emploie **gras** ; on le rend au lieu de
        // laisser les astérisques à l'écran.
        var p = el('p');
        para.split(/(\*\*[^*]+\*\*)/).forEach(function (bout) {
          if (/^\*\*[^*]+\*\*$/.test(bout)) {
            p.appendChild(el('strong', null, bout.slice(2, -2)));
          } else if (bout) {
            bout.split('\n').forEach(function (l, k) {
              if (k) p.appendChild(document.createElement('br'));
              p.appendChild(document.createTextNode(l));
            });
          }
        });
        desc.appendChild(p);
      });
      corps.appendChild(desc);

      if (s.summonedMonsters && s.summonedMonsters.length) {
        corps.appendChild(el('div', 'classes',
          'Créatures invoquées : ' + s.summonedMonsters.join(', ')));
      }

      var cl = (s.classes || []).map(function (c) { return CLASSES[c] || c; }).sort(function (a, b) {
        return a.localeCompare(b, 'fr');
      });
      corps.appendChild(el('div', 'classes',
        (cl.length ? 'Classes : ' + cl.join(', ') : 'Aucune classe listée') + ' — ' + s.source));
    }

    art.remplirCorps = remplirCorps;

    function replier() {
      tete.setAttribute('aria-expanded', 'false');
      corps.hidden = true;
      art.classList.remove('ouvert');
    }
    art.replier = replier;

    tete.addEventListener('click', function () {
      var ouvert = tete.getAttribute('aria-expanded') === 'true';
      if (!ouvert) {
        if (carteOuverte && carteOuverte !== art && carteOuverte.replier) {
          carteOuverte.replier();
        }
        remplirCorps();
        carteOuverte = art;
      } else {
        carteOuverte = null;
      }
      tete.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
      corps.hidden = ouvert;
      art.classList.toggle('ouvert', !ouvert);
      // Sur un téléphone, une carte ouverte en bas d'écran laisse le texte
      // hors de vue : on ramène l'en-tête sous le bandeau.
      if (!ouvert && typeof tete.scrollIntoView === 'function') {
        setTimeout(function () {
          var haut = tete.getBoundingClientRect().top;
          if (haut < 90 || haut > window.innerHeight * 0.55) {
            tete.scrollIntoView({ block: 'start', behavior: 'smooth' });
          }
        }, 0);
      }
    });

    return art;
  }

  // ------------------------------------------------------------------- rendu

  var liste = document.getElementById('liste');
  var vide = document.getElementById('vide');
  var compteur = document.getElementById('compteur');
  var zoneOnglets = document.getElementById('onglets');
  var barreMes = document.getElementById('barre-mes');

  function majEtoile(b, s) {
    var choisi = estChoisi(s);
    b.textContent = choisi ? '★' : '☆';
    b.setAttribute('aria-pressed', choisi ? 'true' : 'false');
    b.setAttribute('aria-label', (choisi ? 'Retirer' : 'Ajouter') + ' ' + s.name + ' — mes sorts');
    b.title = choisi ? 'Retirer de mes sorts' : 'Ajouter à mes sorts';
  }

  function majOnglets() {
    zoneOnglets.textContent = '';
    [['tous', 'Tous les sorts', SORTS.length], ['mes', 'Mes sorts', selection.length]]
      .forEach(function (o) {
        var b = el('button', 'onglet');
        b.type = 'button';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', etat.vue === o[0] ? 'true' : 'false');
        b.appendChild(document.createTextNode(o[1]));
        b.appendChild(el('span', 'nb', String(o[2])));
        b.addEventListener('click', function () {
          if (etat.vue === o[0]) return;
          etat.vue = o[0];
          rendre();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        zoneOnglets.appendChild(b);
      });
  }

  function bouton(texte, surClic, classeSup) {
    var b = el('button', 'btn' + (classeSup ? ' ' + classeSup : ''), texte);
    b.type = 'button';
    b.addEventListener('click', surClic);
    return b;
  }

  function majBarre() {
    barreMes.textContent = '';
    barreMes.hidden = etat.vue !== 'mes';
    if (barreMes.hidden) { fermerPanneau(); return; }

    var tete = el('button', 'barre-tete');
    tete.type = 'button';
    tete.setAttribute('aria-expanded', etat.barre ? 'true' : 'false');
    tete.appendChild(el('span', 'marque', '★'));
    tete.appendChild(el('span', null, selection.length === 0
      ? 'Liste vide'
      : selection.length + (selection.length > 1 ? ' sorts retenus' : ' sort retenu')));
    tete.appendChild(el('span', 'chevron', '›'));
    tete.addEventListener('click', function () {
      etat.barre = !etat.barre;
      if (!etat.barre) fermerPanneau();
      retenirEtat();
      majBarre();
    });
    barreMes.appendChild(tete);

    var outils = el('div', 'barre-outils');
    outils.hidden = !etat.barre;

    // Le classement est la commande la plus utilisée ici : on la sort du
    // panneau de filtres, replié par défaut.
    if (selection.length) {
      var selClass = el('select');
      selClass.setAttribute('aria-label', 'Classement de mes sorts');
      [['niveau', 'Classer par niveau'], ['ecole', 'Classer par école'], ['nom', 'Classer par ordre alphabétique']]
        .forEach(function (t) {
          var o = el('option', null, t[1]);
          o.value = t[0];
          selClass.appendChild(o);
        });
      selClass.value = etat.tri;
      selClass.addEventListener('change', function () { etat.tri = selClass.value; rendre(); });
      outils.appendChild(selClass);
    }

    var actions = el('div', 'barre-actions');

    var exporter = bouton('⇧ Exporter', function () { ouvrirPanneau('export'); });
    exporter.disabled = selection.length === 0;
    if (exporter.disabled) exporter.style.opacity = '.35';
    actions.appendChild(exporter);

    actions.appendChild(bouton('⇩ Importer', function () { ouvrirPanneau('import'); }));

    if (selection.length) {
      actions.appendChild(bouton('✕ Vider ma liste', function () {
        if (!window.confirm('Retirer les ' + selection.length + ' sorts de votre liste ?')) return;
        selection = [];
        retenirSelection();
        fermerPanneau();
        rendre();
      }));
    }

    outils.appendChild(actions);
    barreMes.appendChild(outils);
  }

  // --------------------------------------------------------- export / import
  // Le code transporte la liste des identifiants de sorts, en base 64 pour
  // n'en faire qu'un seul bloc à copier-coller sans risque de retour à la
  // ligne. La lecture reste tolérante : base 64 ou identifiants en clair.

  var PREFIXE = 'SORTSDD1:';
  var panneau = document.getElementById('echange');
  var modeEchange = null;

  function codeSelection() {
    var brut = selection.join('|');
    try { return PREFIXE + btoa(brut); } catch (e) { return PREFIXE + brut; }
  }

  function idsConnus(texte) {
    var connus = {};
    SORTS.forEach(function (s) { connus[idDe(s)] = true; });
    var vus = {};
    return String(texte).split(/[^a-z0-9-]+/).filter(function (id) {
      if (!id || !connus[id] || vus[id]) return false;
      vus[id] = true;
      return true;
    });
  }

  function lireCode(txt) {
    var t = String(txt || '').trim();
    if (!t) return [];
    if (t.indexOf(PREFIXE) === 0) t = t.slice(PREFIXE.length).trim();

    var essais = [];
    try { essais.push(atob(t.replace(/\s+/g, ''))); } catch (e) { /* pas du base 64 */ }
    essais.push(t);

    for (var i = 0; i < essais.length; i++) {
      var ids = idsConnus(essais[i]);
      if (ids.length) return ids;
    }
    return [];
  }

  function fermerPanneau() {
    panneau.hidden = true;
    panneau.textContent = '';
    modeEchange = null;
  }

  function ouvrirPanneau(mode) {
    if (modeEchange === mode && !panneau.hidden) { fermerPanneau(); return; }
    modeEchange = mode;
    panneau.hidden = false;
    panneau.textContent = '';
    if (mode === 'export') construireExport(); else construireImport();
    panneau.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function copier(zone, msg) {
    function repli() {
      zone.focus();
      zone.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      msg.textContent = ok
        ? 'Code copié.'
        : 'Copie automatique refusée : le code est sélectionné, copiez-le à la main.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(zone.value).then(function () {
        msg.textContent = 'Code copié.';
      }, repli);
    } else {
      repli();
    }
  }

  function construireExport() {
    panneau.appendChild(el('p', null,
      'Ce code contient vos ' + selection.length + ' sorts. Copiez-le (ou enregistrez le fichier), ' +
      'puis collez-le dans « Importer » sur l’autre appareil.'));

    var zone = document.createElement('textarea');
    zone.readOnly = true;
    zone.value = codeSelection();
    zone.setAttribute('aria-label', 'Code d’export');
    panneau.appendChild(zone);

    var msg = el('p', 'msg');
    var boutons = el('div', 'echange-boutons');

    boutons.appendChild(bouton('Copier le code', function () { copier(zone, msg); }));

    boutons.appendChild(bouton('Enregistrer un fichier', function () {
      try {
        var blob = new Blob([zone.value + '\n'], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'mes-sorts-dnd.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        msg.textContent = 'Fichier mes-sorts-dnd.txt enregistré.';
      } catch (e) {
        msg.textContent = 'Enregistrement impossible ici : copiez le code à la place.';
      }
    }));

    boutons.appendChild(bouton('Fermer', fermerPanneau, 'fermer'));
    panneau.appendChild(boutons);
    panneau.appendChild(msg);
  }

  function construireImport() {
    panneau.appendChild(el('p', null,
      'Collez un code d’export (ou ouvrez le fichier .txt), puis choisissez d’ajouter à votre liste ou de la remplacer.'));

    var zone = document.createElement('textarea');
    zone.placeholder = 'SORTSDD1:…';
    zone.setAttribute('aria-label', 'Code à importer');
    panneau.appendChild(zone);

    var msg = el('p', 'msg');

    function appliquer(remplacer) {
      var ids = lireCode(zone.value);
      if (!ids.length) {
        msg.textContent = 'Code non reconnu : aucun sort identifié.';
        return;
      }
      var avant = selection.length;
      if (remplacer) {
        selection = ids.slice();
        msg.textContent = ids.length + ' sorts importés, liste remplacée.';
      } else {
        ids.forEach(function (id) {
          if (selection.indexOf(id) === -1) selection.push(id);
        });
        msg.textContent = (selection.length - avant) + ' sorts ajoutés, ' +
          selection.length + ' au total.';
      }
      retenirSelection();
      zone.value = '';
      rendre();
      panneau.appendChild(msg);   // le rendu ne touche pas au panneau, mais on reste sûr
    }

    var fichier = document.createElement('input');
    fichier.type = 'file';
    fichier.accept = '.txt,text/plain';
    fichier.hidden = true;
    fichier.addEventListener('change', function () {
      var f = fichier.files && fichier.files[0];
      if (!f) return;
      var lecteur = new FileReader();
      lecteur.onload = function () {
        zone.value = String(lecteur.result || '').trim();
        msg.textContent = 'Fichier chargé : choisissez « Ajouter » ou « Remplacer ».';
      };
      lecteur.onerror = function () { msg.textContent = 'Lecture du fichier impossible.'; };
      lecteur.readAsText(f);
      fichier.value = '';
    });
    panneau.appendChild(fichier);

    var boutons = el('div', 'echange-boutons');
    boutons.appendChild(bouton('Ouvrir un fichier', function () { fichier.click(); }));
    boutons.appendChild(bouton('Ajouter à ma liste', function () { appliquer(false); }));
    boutons.appendChild(bouton('Remplacer ma liste', function () {
      if (selection.length && !window.confirm('Remplacer vos ' + selection.length + ' sorts actuels ?')) return;
      appliquer(true);
    }));
    boutons.appendChild(bouton('Fermer', fermerPanneau, 'fermer'));
    panneau.appendChild(boutons);
    panneau.appendChild(msg);
  }

  // ------------------------------------------------------ regroupement (mes sorts)

  function cleGroupe(s) {
    if (etat.tri === 'niveau') return s.level === 0 ? 'Sorts mineurs' : niveauLong(s.level);
    if (etat.tri === 'ecole') return ECOLES[s.school] || s.school;
    return null;
  }

  function enteteGroupe(nom, nombre, sort) {
    var d = el('div', 'section-titre' + (etat.tri === 'ecole' ? ' ec-' + sort.school : ''));
    if (etat.tri === 'ecole') d.appendChild(el('span', 'pastille'));
    d.appendChild(el('span', null, nom));
    d.appendChild(el('span', 'nb', String(nombre)));
    d.appendChild(el('span', 'trait'));
    return d;
  }

  function rendre() {
    // La liste est reconstruite entierement : l'ancienne carte ouverte
    // n'appartient plus au document.
    carteOuverte = null;
    construireFiltres();
    majOnglets();
    majBarre();
    retenirEtat();

    // Les filtres et la recherche continuent de s'appliquer dans « Mes sorts »,
    // ce qui laisse fouiller sa propre liste comme le catalogue complet.
    var base = etat.vue === 'mes' ? SORTS.filter(estChoisi) : SORTS;
    var trouves = trier(base.filter(retenu));

    compteur.textContent = '';
    var b = el('b', null, String(trouves.length));
    compteur.appendChild(b);
    compteur.appendChild(document.createTextNode(
      (trouves.length > 1 ? ' sorts' : ' sort') +
      (trouves.length === base.length ? '' : ' sur ' + base.length)
    ));

    // On reconstruit d'un bloc : plus rapide et plus simple que de réconcilier,
    // et 339 cartes restent instantanées.
    var frag = document.createDocumentFragment();
    var grouper = etat.vue === 'mes' && (etat.tri === 'niveau' || etat.tri === 'ecole');

    if (grouper) {
      var comptes = {};
      trouves.forEach(function (s) {
        var k = cleGroupe(s);
        comptes[k] = (comptes[k] || 0) + 1;
      });
      var precedent = null;
      trouves.forEach(function (s) {
        var k = cleGroupe(s);
        if (k !== precedent) {
          precedent = k;
          frag.appendChild(enteteGroupe(k, comptes[k], s));
        }
        frag.appendChild(carte(s));
      });
    } else {
      trouves.forEach(function (s) { frag.appendChild(carte(s)); });
    }
    liste.textContent = '';
    liste.appendChild(frag);

    if (etat.vue === 'mes') {
      vide.textContent = selection.length === 0
        ? 'Votre liste est vide. Touchez l’étoile ☆ d’un sort pour l’y ajouter.'
        : 'Aucun sort de votre liste ne correspond à ces critères.';
    } else {
      vide.textContent = 'Aucun sort ne correspond à ces critères.';
    }
    vide.hidden = trouves.length > 0;
  }

  // ------------------------------------------------------------- interactions

  var champ = document.getElementById('recherche');
  var minuteur = null;
  champ.addEventListener('input', function () {
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { etat.q = champ.value.trim(); rendre(); }, 110);
  });

  var basculeFiltres = document.getElementById('bascule-filtres');
  var zoneFiltres = document.getElementById('filtres');
  basculeFiltres.addEventListener('click', function () {
    var ouvert = basculeFiltres.getAttribute('aria-expanded') === 'true';
    basculeFiltres.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
    zoneFiltres.hidden = ouvert;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== champ) {
      e.preventDefault();
      champ.focus();
      champ.select();
    }
  });

  // ------------------------------------ bandeau escamotable au défilement
  // On descend : le bandeau s'en va. On remonte d'un cheveu : il revient.
  // Il reste en place tant qu'on est en haut de page, que les filtres sont
  // dépliés ou que la recherche est en cours de saisie.
  var enTete = document.querySelector('header');
  var yPrec = 0;
  var cumul = 0;

  window.addEventListener('scroll', function () {
    var y = window.scrollY < 0 ? 0 : window.scrollY;
    var delta = y - yPrec;
    yPrec = y;
    if (delta === 0) return;

    if (y < 140 || !zoneFiltres.hidden || document.activeElement === champ) {
      cumul = 0;
      enTete.classList.remove('masque');
      return;
    }

    cumul = ((delta > 0) === (cumul > 0)) ? cumul + delta : delta;
    if (cumul > 40) enTete.classList.add('masque');
    else if (cumul < -30) enTete.classList.remove('masque');
  }, { passive: true });

  // Rouvrir les filtres ou revenir en haut doit toujours redonner le bandeau.
  basculeFiltres.addEventListener('click', function () {
    if (!zoneFiltres.hidden) enTete.classList.remove('masque');
  });

  // Retour en haut : indispensable dès qu'on descend dans 339 cartes au doigt.
  var btnHaut = document.getElementById('haut');
  if (btnHaut && typeof window.addEventListener === 'function') {
    btnHaut.addEventListener('click', function () {
      enTete.classList.remove('masque');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      champ.focus({ preventScroll: true });
    });
    window.addEventListener('scroll', function () {
      btnHaut.classList.toggle('visible', window.scrollY > 700);
    }, { passive: true });
  }

  chargerEtat();
  chargerSelection();
  if (etat.vue !== 'mes') etat.vue = 'tous';
  champ.value = etat.q;
  if (filtresActifs()) {
    basculeFiltres.setAttribute('aria-expanded', 'true');
    zoneFiltres.hidden = false;
  }
  rendre();

  // ------------------------------------------------- mise en cache hors ligne
  // Un service worker n'est possible que servi en http(s) (localhost compte).
  // Ouvert par double-clic (file://), l'app fonctionne déjà sans réseau
  // puisque tout est sur le disque : on ne tente rien.
  var etatHL = document.getElementById('etat-hors-ligne');
  if (location.protocol === 'file:') {
    etatHL.textContent = 'Ouverte depuis le disque — rien à mettre en cache.';
  } else if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function () {
      etatHL.textContent = 'Mise en cache active : installable et consultable sans réseau.';
    }).catch(function (err) {
      etatHL.textContent = 'Mise en cache indisponible (' + err.message + ').';
    });
  }
})();
</script>
</body>
</html>
