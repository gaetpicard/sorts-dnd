 m de rayon et 12 m de haut, centré sur un point à portée. Jusqu’à la fin du sort, le Cylindre est empli de Lumière faible et vous pouvez entreprendre l’action Magie à vos tours suivants pour déplacer le Cylindre d’un maximum de 18 m.\n\nLorsque le Cylindre apparaît, chaque créature prise à l’intérieur effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 2d10 dégâts radiants et, si elle est métamorphosée (par le sort métamorphose, par exemple), elle reprend sa forme véritable et ne peut plus en changer tant qu’elle reste dans le Cylindre. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nToute créature qui voit la zone du sort se déplacer dans son espace, ou qui pénètre dans la zone ou y termine son tour, est également soumise à ce JS. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 2e.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-de-soleil","name":"Rayon de soleil","level":6,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une loupe"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous projetez un rayon de soleil sous forme d’une Ligne de 18 m de long et 1,50 m de large. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 6d8 dégâts radiants, ainsi que l’état Aveuglé jusqu’au début de votre tour suivant. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nJusqu’à la fin du sort, vous pouvez entreprendre l’action Magie pour produire une nouvelle Ligne de radiance.\n\nPour toute la durée, un point de radiance brille juste au-dessus de vous. Il émet une Lumière vive sur un rayon de 9 m et une Lumière faible sur 9 m de plus. Cette lumière est celle du soleil.","classes":["cleric","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-empoisonne","name":"Rayon empoisonné","level":1,"school":"necromancy","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous dardez un rayon verdâtre vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 2d8 dégâts de poison, ainsi que l’état Empoisonné jusqu’à la fin de votre tour suivant. Emplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 1.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-tracant","name":"Rayon traçant","level":1,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 round","concentration":false,"ritual":false,"description":"Vous projetez un trait de lumière vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 4d6 dégâts radiants et le prochain jet d’attaque effectué contre elle avant la fin de votre tour suivant a l’Avantage. Emplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"regeneration","name":"Régénération","level":7,"school":"transmutation","castingTime":"1 minute","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un moulin à prières"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Une créature que vous touchez physiquement récupère 4d8 + 15 points de vie. Pour toute la durée, la cible récupère 1 point de vie au début de chacun de ses tours et les parties sectionnées de son anatomie repoussent en 2 minutes.","classes":["bard","cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"reincarnation","name":"Réincarnation","level":5,"school":"necromancy","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"des huiles rares d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez physiquement un Humanoïde mort ou l’un de ses restes. Si la créature n’est pas morte depuis plus de 10 jours, le sort forme un nouveau corps et appelle son âme pour prendre possession de ce corps.\n\nLancez 1d10 en consultant la table suivante pour déterminer l’espèce du nouveau corps ou laissez le MJ choisir directement une espèce jouable. 1d10 Espèce 1d10 Espèce 1 Relancez le dé 6 Halfelin 2 Drakéide 7 Humain 3 Elfe 8 Nain 4 Gnome 9 Orc 5 Goliath 10 Tieffelin\n\nLa créature réincarnée, qui fait les choix proposés par la description de l’espèce, se souvient de son ancienne vie et de ses expériences. Elle conserve les capacités dont elle disposait sous sa forme d’origine, si ce n’est qu’elle perd les traits de l’ancienne forme et acquiert ceux de la nouvelle.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"repli-expeditif","name":"Repli expéditif","level":1,"school":"transmutation","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous entreprenez l’action Pointe et, jusqu’à la fin du sort, vous pouvez entreprendre cette même action par une action Bonus.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"represailles-infernales","name":"Représailles infernales","level":1,"school":"evocation","castingTime":"Réaction, que vous jouez lorsqu’une créature située dans un rayon de 18 m vous inflige des dégâts.","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La créature qui vous a infligé des dégâts se retrouve un court instant cernée de flammes vertes. Elle effectue un jet de sauvegarde de Dextérité, et subit 2d10 dégâts de feu en cas d’échec, la moitié en cas de réussite. Emplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 1.","classes":["warlock"],"source":"SRD 5.2.1"},{"canonicalId":"respiration-aquatique","name":"Respiration aquatique","level":3,"school":"transmutation","castingTime":"action ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un court roseau"},"duration":"24 heures","concentration":false,"ritual":true,"description":"Ce sort octroie la faculté de respirer sous l’eau à un maximum de dix créatures consentantes que vous choisissez à portée, jusqu’à la fin du sort. Les créatures affectées conservent leurs autres modes respiratoires.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"restauration-partielle","name":"Restauration partielle","level":2,"school":"abjuration","castingTime":"action Bonus","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature pour mettre fin à un état qui l’affecte parmi : Assourdi, Aveuglé, Empoisonné et Paralysé.","classes":["bard","cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"restauration-supreme","name":"Restauration suprême","level":5,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de diamant d’une valeur minimale de 100 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature pour lui retirer magiquement l’un des effets suivants : • 1 niveau d’Épuisement • L’état Charmé ou Pétrifié • Une malédiction, y compris l’Harmonisation éventuelle de la cible avec un objet magique maudit • Toute réduction de l’une des valeurs de caractéristique de la cible • Toute réduction du maximum de points de vie de la cible","classes":["bard","cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"resurrection","name":"Résurrection","level":7,"school":"necromancy","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"D’un contact, vous ramenez à la vie une créature dont la mort ne remonte pas à plus d’un siècle, qui n’est pas morte de vieillesse et n’était pas un Mort-vivant au moment de mourir. La créature revient à la vie avec tous ses points de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir. Ce sort referme toutes les blessures mortelles et restitue l’anatomie manquante.\n\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de –4 aux Tests d20. Chaque fois qu’elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu’il tombe à 0.\n\nL’incantation de ce sort s’avère éreintante lorsqu’il s’agit de ramener à la vie une créature morte depuis 365 jours ou plus. Tant que vous n’avez pas terminé de Repos long, vous ne pouvez plus lancer de sort et vous subissez le Désavantage aux Tests d20.","classes":["bard","cleric"],"source":"SRD 5.2.1"},{"canonicalId":"resurrection-supreme","name":"Résurrection suprême","level":9,"school":"necromancy","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"au moins 25 000 po de diamants, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez une créature morte depuis un maximum de 200 ans pour quelque raison que ce soit, hormis de vieillesse. La créature est ranimée avec tous ses points de vie.\n\nCe sort referme toutes les plaies, neutralise tous les poisons, soigne toutes les maladies magiques et lève toutes les malédictions qui affectaient la cible à sa mort. Il remplace les organes et membres endommagés ou manquants. Si la créature était un Mort-vivant, elle retrouve sa forme de vivant.\n\nLe sort peut fournir un nouveau corps si celui d’origine n’existe plus, auquel cas vous devez prononcer le nom de la créature. Celle-ci apparaît en un espace inoccupé que vous choisissez dans un rayon de 3 m de vous.","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"retour-a-la-vie","name":"Retour à la vie","level":3,"school":"necromancy","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 300 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez une créature morte dans la minute qui vient de s’écouler. La créature est ramenée à la vie avec 1 point de vie. Ce sort ne peut pas affecter une créature morte de vieillesse, pas plus qu’il ne restitue l’anatomie manquante.","classes":["cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"sanctification","name":"Sanctification","level":5,"school":"abjuration","castingTime":"24 heures","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"encens d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous touchez un point pour investir la zone environnante de pouvoir sacré ou impie. Le rayon de la zone peut atteindre 18 m, le sort échouant si ce rayon chevauche une zone déjà affectée par le sort sanctification. La zone affectée présente les effets suivants.\n\nBarrière sanctifiée. Choisissez un ou plusieurs types parmi les suivants : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Les créatures des types retenus ne peuvent pénétrer volontairement dans la zone, et toute créature possédée, Charmée ou Effrayée par de telles créatures ne l’est plus tant qu’elle reste dans la zone.\n\nEffet supplémentaire. Vous liez un effet supplémentaire à la zone, parmi ceux de la liste suivante :\n\nCourage. Les créatures des types retenus ne peuvent recevoir l’état Effrayé tant qu’elles sont dans la zone.\n\nDon des langues. Les créatures des types retenus peuvent communiquer avec toute autre créature présente dans la zone, même si elles ne parlent aucune langue en commun.\n\nInterférence extradimensionnelle. Les créatures des types retenus ne peuvent pas entrer dans la zone ni en sortir par téléportation ni en recourant au voyage interplanaire.\n\nLumière du jour. Une Lumière vive emplit la zone. Les Ténèbres magiques créées par des sorts de niveau inférieur à celui de ce sort ne peuvent pas occulter cette lumière.\n\nRepos paisible. Les dépouilles enterrées dans la zone ne peuvent pas être transformées en Morts-vivants.\n\nRésistance. Tant qu’elles sont dans la zone, les créatures des types retenus bénéficient de la Résistance à un type de dégâts de votre choix.\n\nSilence. Aucun son ne peut émaner de l’intérieur de la zone ni y pénétrer.\n\nTénèbres. Les Ténèbres envahissent la zone. Les lumières ordinaires, ainsi que les lumières magiques créées par des sorts de niveau inférieur à celui de ce sort, ne peuvent pas éclairer la zone.\n\nTerreur. Les créatures des types retenus subissent l’état Effrayé tant qu’elles sont dans la zone.\n\nVulnérabilité. Tant qu’elles sont dans la zone, les créatures des types retenus subissent la Vulnérabilité à un type de dégâts de votre choix.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"sanctuaire","name":"Sanctuaire","level":1,"school":"abjuration","castingTime":"action Bonus","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un éclat de verre issu d’un miroir"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Vous protégez une créature à portée. Jusqu’à la fin du sort, toute créature qui cible la créature protégée avec un jet d’attaque ou un sort nuisible doit réussir un jet de sauvegarde de Sagesse, sans quoi elle doit choisir une autre cible pour ne pas perdre l’attaque ou le sort.\n\nCe sort ne protège pas la créature contre les zones d’effet. Le sort prend fin pour la créature protégée si elle effectue un jet d’attaque, lance un sort ou inflige des dégâts.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"sanctuaire-prive","name":"Sanctuaire privé","level":4,"school":"abjuration","castingTime":"10 minutes","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une feuille de plomb"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Vous sécurisez magiquement une zone à portée. La zone est un Cube dont l’arête peut aller de 1,50 m à 30 m. Le sort persiste pour toute la durée. À l’incantation du sort, vous décidez quel genre de sécurité octroie le sort, en choisissant autant de propriétés souhaitées parmi les suivantes :\n\n• Les sons ne franchissent pas le périmètre de la zone protégée.\n\n• Le périmètre de la zone protégée apparaît sombre et brumeux, ce qui empêche de voir au travers (y compris avec la Vision dans le noir).\n\n• Les capteurs créés par les sorts de Divination ne peuvent ni apparaître à l’intérieur de la zone protégée ni franchir son périmètre.\n\n• Les créatures de la zone ne peuvent pas être ciblées par les sorts de Divination.\n\n• Rien ne peut se téléporter dans la zone protégée ou hors d’elle.\n\n• Le voyage planaire est bloqué au sein de la zone protégée.\n\nLancer ce sort quotidiennement au même endroit pendant 365 jours fait persister le sort jusqu’à dissipation.\n\nEmplacement de niveau supérieur. Vous pouvez augmenter l’arête du Cube de 30 m par niveau d’emplacement au-delà du 4e.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"saut","name":"Saut","level":1,"school":"transmutation","castingTime":"action Bonus","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une patte arrière de sauterelle"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Vous touchez une créature consentante. Une fois à chacun de ses tours jusqu’à la fin du sort, la créature peut sauter d’un maximum de 9 m en dépensant 3 m de déplacement. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"scrutation","name":"Scrutation","level":5,"school":"divination","castingTime":"10 minutes","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un focaliseur d’une valeur minimale de 1 000 po, comme une boule de cristal, un miroir en argent ou une vasque remplie d’eau bénite"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous voyez et entendez une créature de votre choix, située sur le même plan d’existence que vous. La cible effectue un jet de sauvegarde de Sagesse, modifié par votre connaissance de la créature et le genre de lien physique que vous entretenez avec elle (voir les tables ci-après). La cible ignore contre quoi s’effectue le JS, et ressent juste une forme de malaise.\n\nVotre connaissance de la cible est… Modificateur au JS indirecte (vous avez entendu parler d’elle) +5 directe (vous l’avez rencontrée) +0 intime (vous la connaissez) −5 Vous disposez… Modificateur au JS de son portrait ou autre représentation −2 d’un vêtement ou autre bien personnel −4 d’un élément anatomique, mèche de cheveux ou rognure d’ongle −10\n\nEn cas de JS réussi, la cible n’est pas affectée et vous ne pouvez plus réutiliser ce sort sur elle pendant 24 heures. En cas d’échec, le sort crée un capteur Invisible et intangible dans un rayon de 3 m de la cible. Vous voyez et entendez par l’intermédiaire du capteur comme si vous y étiez. Le capteur se déplace avec la cible, en restant dans un rayon de 3 m d’elle pour toute la durée. Pour qui perçoit le capteur, celui-ci apparaît comme un orbe lumineux de la taille de votre poing.\n\nPlutôt qu’une créature, vous pouvez cibler un lieu que vous avez déjà vu. Ce faisant, le capteur apparaît à l’endroit désigné et ne bouge plus.","classes":["bard","cleric","druid","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"serviteur-invisible","name":"Serviteur invisible","level":1,"school":"conjuration","castingTime":"action ou rituel","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un bout de ficelle et un morceau de bois"},"duration":"1 heure","concentration":false,"ritual":true,"description":"Le sort crée une force de taille M, Invisible, dépourvue de conscience et de forme, qui accomplit des tâches rudimentaires sous vos ordres jusqu’à la fin du sort. Le serviteur se matérialise au sol, en un espace inoccupé à portée. Il est doté d’un CA de 10, de 1 point de vie, d’une Force de 2, et ne peut pas effectuer d’attaques. S’il tombe à 0 point de vie, le sort prend fin.\n\nÀ chacun de vos tours, vous pouvez par une action Bonus ordonner mentalement au serviteur de se déplacer d’un maximum de 4,50 m et d’interagir avec un objet. Le serviteur peut accomplir des tâches rudimentaires à la portée d’un humain, comme aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu ou servir les repas et la boisson.\n\nUne fois l’instruction reçue, le serviteur s’attèle à la tâche de son mieux jusqu’à l’avoir accomplie, puis attend vos prochaines directives. Si vous lui assignez une tâche qui lui demande de s’éloigner de plus de 18 m de vous, le sort prend fin.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"silence","name":"Silence","level":2,"school":"illusion","castingTime":"action ou rituel","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":true,"description":"Pour toute la durée, nul son ne peut être produit dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée. Les créatures et objets entièrement compris dans la Sphère ont l’Immunité contre les dégâts de tonnerre ; les créatures y subissent l’état Assourdi. Il est impossible de lancer un sort doté d’une composante verbale depuis l’intérieur de cette Sphère.","classes":["bard","cleric","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"simulacre","name":"Simulacre","level":7,"school":"illusion","castingTime":"12 heures","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de rubis d’une valeur minimale de 1 500 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous façonnez un simulacre d’une Bête ou d’un Humanoïde qui se trouve dans un rayon de 3 m pendant tout le temps d’incantation du sort. Vous terminez l’incantation en touchant physiquement la créature en même temps qu’un tas de neige ou de glace de même taille que la créature, le tas prenant alors la forme du simulacre ; une nouvelle créature. Il reprend le profil de la créature d’origine au moment de l’incantation, si ce n’est qu’il s’agit d’un Artificiel, que son maximum de points de vie est moitié moindre et qu’il ne peut pas lancer de sorts.\n\nLe simulacre est Amical envers vous et les créatures que vous désignez. Il obéit à vos ordres et agit à votre tour au combat. Le simulacre ne peut pas gagner de niveaux ni prendre de Repos, courts ou longs.\n\nSi le simulacre subit des dégâts, le seul moyen de lui restituer des points de vie consiste à le réparer lors d’un Repos long de votre part, durant lequel vous devez dépenser des composantes : l’équivalent de 100 po par point de vie restitué. Le simulacre doit rester dans un rayon de 1,50 m de vous durant toute l’opération.\n\nLe simulacre persiste jusqu’à ce qu’il tombe à 0 point de vie, après quoi il retrouve sa substance aqueuse et fond. Si vous relancez ce sort, tout autre simulacre actif que vous avez créé par ce même sort est aussitôt détruit.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"simulacre-de-vie","name":"Simulacre de vie","level":1,"school":"necromancy","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte d’alcool"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous recevez 2d4 + 4 points de vie temporaires. Emplacement de niveau supérieur. Vous recevez 5 points de vie temporaires supplémentaires par niveau d’emplacement au-delà du 1.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"soins","name":"Soins","level":1,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La créature que vous touchez physiquement récupère un nombre de points de vie égal à 2d8 + votre modificateur de caractéristique d’incantation. Emplacement de niveau supérieur. Les soins augmentent de 2d8 par niveau d’emplacement au-delà du 1.","classes":["bard","cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"soins-de-groupe","name":"Soins de groupe","level":5,"school":"abjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une vague d’énergie curative déferle depuis un point que vous voyez à portée. Désignez un maximum de six créatures dans une Sphère de 9 m de rayon centrée sur ce point. Chaque cible récupère autant de points de vie que 5d8 + votre modificateur de caractéristique d’incantation. Emplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d’emplacement au-delà du 5e.","classes":["bard","cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"sommeil","name":"Sommeil","level":1,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un pincée de sable ou des pétales de rose"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Chaque créature que vous choisissez dans une Sphère de 1,50 m centrée sur un point à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Neutralisé jusqu’à la fin de son tour suivant et de réitérer le JS à la fin de cet intervalle. Si la cible rate ce second JS, elle subit l’état Inconscient pour toute la durée.\n\nLe sort prend fin sur toute cible qui subit des dégâts ou qui reçoit une secousse énergique d’une autre créature située dans un rayon de 1,50 m d’elle.\n\nLes créatures qui ne dorment pas, comme les elfes, et celles qui ont l’Immunité contre l’Épuisement, réussissent automatiquement leur JS contre ce sort.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"songe","name":"Songe","level":5,"school":"illusion","castingTime":"1 minute","range":"spéciale","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une poignée de sable"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous ciblez une créature que vous connaissez sur votre plan d’existence. Vous-même, ou une créature consentante que vous touchez, entrez en transe pour faire office de messager onirique. Tant qu’il est en transe, le messager est Neutralisé et sa Vitesse est de 0.\n\nSi la cible est endormie, le messager lui apparaît en rêve et peut converser avec elle aussi longtemps que le sommeil se prolonge et que le sort persiste. Le messager peut également façonner l’environnement du songe en y ajoutant des paysages, des objets et autres images. Le messager peut sortir de sa transe à tout moment, ce qui met fin au sort. La cible se souvient parfaitement du songe à son réveil.\n\nSi la cible est réveillée à l’incantation du sort, le messager le sait et peut mettre un terme à sa transe (et au sort) ou attendre que la cible s’endorme, ce qui fera apparaître le messager dans ses rêves.\n\nVous pouvez rendre le messager terrifiant pour la cible. Dans ce cas, il livre un message qui ne dépasse pas dix mots, après quoi la cible effectue un jet de sauvegarde de Sagesse. En cas d’échec, la cible ne reçoit aucun bénéfice de son Repos et subit 3d6 dégâts psychiques à son réveil.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"souffle-du-dragon","name":"Souffle du dragon","level":2,"school":"transmutation","castingTime":"action Bonus","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un piment"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous touchez physiquement une créature consentante et choisissez entre acide, feu, foudre, froid ou poison. Jusqu’à la fin du sort, la cible peut entreprendre l’action Magie pour exhaler un Cône de 4,50 m. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité, et subit 3d6 dégâts du type choisi en cas d’échec, la moitié en cas de réussite.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 2e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"souhait","name":"Souhait","level":9,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Souhait est le sort le plus puissant que puisse lancer un mortel. De votre seule voix, vous pouvez influer sur la réalité même. L’utilisation standard du sort revient à reproduire le sort de votre choix du 8e niveau ou inférieur. Dans cette version, vous n’avez pas besoin de remplir les conditions habituelles du sort, y compris ses composantes coûteuses. Le sort prend tout simplement effet.\n\nUne autre approche vous permet de produire l’un des effets suivants, au choix :\n\nCréation d’objet. Vous créez un objet non magique d’une valeur maximale de 25 000 po. Aucune des dimensions de l’objet ne peut dépasser 90 m et il apparaît au sol, en un espace inoccupé que vous voyez.\n\nSanté souveraine. Vous permettez à un maximum de vingt créatures que vous voyez de récupérer tous leurs points de vie et mettre un terme à tous les effets qui les touchent parmi ceux décrits pour le sort restauration suprême.\n\nRésistance. Vous octroyez la Résistance au type de dégâts de votre choix à un maximum de dix créatures que vous voyez. Cette Résistance est permanente.\n\nImmunité magique. Vous octroyez l’Immunité contre un sort (ou un effet magique) unique pendant 8 heures, à un maximum de dix créatures que vous voyez.\n\nApprentissage instantané. Vous remplacez l’un de vos dons par un autre don pour lequel vous remplissez les prérequis. Vous perdez tous les bénéfices de l’ancien don au profit de tous ceux du nouveau. Vous ne pouvez pas remplacer un don qui figure parmi les prérequis d’un autre don ou d’une aptitude.\n\nCaprice des dés. Vous modifiez un événement récent en faisant rejouer un jet de dés intervenu au cours du dernier round (ce qui comprend votre dernier tour). La réalité s’adapte alors à ce nouveau résultat. Souhait peut ainsi annuler le jet de sauvegarde raté d’un allié ou le Coup critique d’un ennemi. Vous pouvez décider que le jet se rejoue avec l’Avantage ou le Désavantage, et vous décidez en connaissance de cause lequel s’applique entre le jet d’origine et le nouveau.\n\nRéalité remodelée. Vous pouvez souhaiter quelque chose qui n’entre pas dans le cadre de ces effets. Si vous avez une idée qui n’entre pas dans leur cadre, faites-en part à votre MJ, le plus précisément possible. Le MJ est alors seul juge de ce qui peut se passer : plus le souhait est ambitieux, plus il risque d’engendrer des incidents. Le sort pourrait tout simplement échouer, ou ne produire que partiellement l’effet désiré, ou vous pourriez connaître un imprévu fâcheux en raison d’une formulation hasardeuse. Si vous faites par exemple le souhait que votre grand ennemi meure, vous pourriez vous retrouver projeté dans l’avenir, à une époque où cet adversaire n’est effectivement plus en vie, mais votre héros quitterait du même coup la partie. De même, souhaiter mettre la main sur un objet magique légendaire ou un artefact pourrait vous transporter aussitôt face à l’actuel propriétaire. Si votre souhait est exaucé et que ses effets pèsent sur toute une communauté, une région ou un monde, vous risquez fort d’attirer de puissants adversaires. Si votre souhait est susceptible d’affecter un dieu, ses serviteurs divins pourraient bien intervenir dans l’instant pour empêcher ce souhait ou pour vous inciter à le formuler de manière très spécifique. Si votre souhait menace d’anéantir le multivers même, il n’est pas exaucé.\n\nDès lors qu’il ne s’agit pas seulement de reproduire les effets d’un autre sort, lancer souhait est une véritable épreuve. Après une telle gageure, chaque fois que vous jetez un sort sans avoir terminé un Repos long, vous subissez 1d10 dégâts nécrotiques par niveau du sort. Ces dégâts ne peuvent être réduits ni évités d’aucune manière. De plus, votre valeur de Force passe à 3 pendant 2d4 jours. Chaque jour que vous passez alors à vous reposer en vous contentant de menues tâches déduit 2 jours de cette période de convalescence. Enfin, cette épreuve entraîne un risque de 33 pour cent que vous ne soyez plus jamais capable de relancer souhait.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"sphere-de-feu","name":"Sphère de feu","level":2,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une boule de cire"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous produisez une Sphère de flammes de 1,50 m de diamètre qui apparaît au sol en un espace inoccupé à portée. Elle persiste pour toute la durée. Toute créature qui termine son tour dans un rayon de 1,50 m de la Sphère effectue un jet de sauvegarde de Dextérité et subit 2d6 dégâts de feu en cas d’échec, la moitié en cas de réussite.\n\nPar une action Bonus, vous pouvez déplacer la Sphère d’un maximum de 9 m, en la faisant rouler au sol. Si vous déplacez la Sphère dans l’espace d’une créature, celle-ci effectue un jet de sauvegarde contre les dégâts de la Sphère, puis la Sphère cesse de se déplacer pour ce tour. Lorsque vous déplacez la Sphère, vous pouvez lui faire franchir des obstacles dont la hauteur ne dépasse pas 1,50 m et des fosses d’une largeur maximale de 3 m.\n\nLa Sphère embrase les objets inflammables qui ne sont portés par personne, produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 2e.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"sphere-de-vitriol","name":"Sphère de vitriol","level":4,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de bile"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous pointez du doigt un lieu à portée et une boule d’acide luisant, de 30 cm de diamètre, y file aussitôt et y explose sous forme de Sphère de 6 m de rayon. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité. En cas d’échec, elle subit 10d4 dégâts d’acide, puis 5d4 dégâts d’acide à la fin de son tour suivant. En cas de réussite, elle subit uniquement la moitié des dégâts initiaux.\n\nEmplacement de niveau supérieur. Les dégâts initiaux augmentent de 2d4 par niveau d’emplacement au-delà du 4e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"sphere-glacee","name":"Sphère glacée","level":6,"school":"evocation","castingTime":"action","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une Sphère miniature en cristal"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un globe glacial jaillit de vous vers un point que vous choisissez à portée, où il explose sous forme d’une Sphère de 18 m de rayon. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 10d6 dégâts de froid en cas d’échec, la moitié en cas de réussite.\n\nSi le globe heurte un volume d’eau, il gèle cette eau sur une profondeur de 15 cm et une surface carrée de 9 m de côté. Cette glace persiste pendant 1 minute. Les créatures qui nageaient à la surface de l’eau désormais gelée se retrouvent bloquées dans la glace, avec l’état Entravé. Une créature bloquée peut consacrer une action à effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts pour s’extraire de la glace.\n\nVous pouvez si vous le souhaitez vous retenir de projeter le globe une fois l’incantation terminée. Dans ce cas, un globe de la taille d’une bille de fronde, froid au contact, apparaît dans votre main. À tout moment, vous ou une créature à qui vous confiez le globe pouvez le projeter (sur une distance maximale de 12 m) ou vous servir d’une fronde pour le lancer (profitant ainsi de la portée normale de la fronde). Il se brise à l’impact, en produisant les mêmes effets que l’incantation de base du sort. Vous pouvez également poser le globe sans le briser. Au bout de 1 minute, s’il ne s’est toujours pas brisé, le globe explose.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 6e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"sphere-resiliente","name":"Sphère résiliente","level":4,"school":"abjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une Sphère de verre"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une Sphère chatoyante séquestre une créature ou un objet de taille G ou inférieure à portée. Une créature non consentante doit réussir un jet de sauvegarde de Dextérité pour ne pas être confinée pour toute la durée.\n\nRien, ni les objets physiques, ni l’énergie, ni les autres effets de sort, ne peut franchir cette barrière dans un sens comme dans l’autre, mais la créature séquestrée peut respirer normalement. La Sphère est immunisée contre tous les dégâts, et la créature ou l’objet enfermé ne peut subir de dégâts des attaques et effets émanant de l’autre côté, pas plus qu’une créature séquestrée ne peut infliger de dégâts vers l’extérieur.\n\nLa Sphère, qui ne pèse rien, est juste assez grande pour contenir la créature ou l’objet. Une créature confinée peut consacrer son action à pousser sur les parois de la Sphère et la faire rouler à concurrence de la moitié de sa propre Vitesse. De même, d’autres créatures peuvent ramasser le globe et le déplacer.\n\nLe sort désintégration, s’il cible le globe, le détruit sans risque pour ce qui se trouve à l’intérieur.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"suggestion","name":"Suggestion","level":2,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une goutte de miel"},"duration":"Concentration, jusqu’à 8 heures","concentration":true,"ritual":false,"description":"Vous suggérez une ligne de conduite par 25 mots ou moins afin d’influencer magiquement une créature que vous voyez à portée, qui vous entend et vous comprend. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d’infliger des dégâts à la cible ni à ses alliés.\n\nVous pourriez ainsi formuler : « Récupère la clef de la chambre forte de la secte et apporte-la-moi. » Ou bien : « Cesse de combattre, quitte la bibliothèque sans faire d’histoires et ne reviens pas. »\n\nLa cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée ou jusqu’à que vous ou l’un de vos alliés lui infligiez des dégâts. La cible Charmée se soumet à la suggestion de son mieux. L’activité suggérée peut s’étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu’elle en a terminé.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"suggestion-de-groupe","name":"Suggestion de groupe","level":6,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une langue de serpent"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Vous suggérez une ligne de conduite par 25 mots ou moins afin d’influencer magiquement un maximum de douze créatures que vous voyez à portée et qui vous entendent et vous comprennent. La suggestion doit paraître raisonnable et ne pas présenter de risque évident d’infliger des dégâts aux cibles ni à leurs alliés.\n\nVous pourriez ainsi dire : « Marchez jusqu’au village suivant pour aider la population à la moisson jusqu’au crépuscule. » Ou bien : « L’heure n’est pas à la violence. Lâchez vos armes et dansez ! Cessez dans une heure. »\n\nChaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée ou jusqu’à que vous ou l’un de vos alliés lui infligiez des dégâts. Chaque cible Charmée se soumet à la suggestion de son mieux. L’activité suggérée peut s’étendre sur toute la durée, mais s’il est possible de l’accomplir plus tôt, le sort prend fin sur la cible dès qu’elle en a terminé.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"symbole","name":"Symbole","level":7,"school":"abjuration","castingTime":"1 minute","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de diamant d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"jusqu’à dissipation ou activation","concentration":false,"ritual":false,"description":"Vous inscrivez un glyphe nuisible à d’autres créatures, soit sur une surface (comme un pan de mur ou de sol), soit à l’intérieur d’un objet que l’on peut fermer (comme un livre ou un coffre). Le glyphe peut recouvrir une zone dont le diamètre ne dépasse pas 3 m. Si vous optez pour un objet, celui-ci doit rester à sa place ; si on le déplace de plus de 3 m de l’endroit où vous avez lancé le sort, le glyphe est rompu et le sort prend fin sans avoir été activé.\n\nLe glyphe est pratiquement imperceptible, au point qu’il faut réussir un test de Sagesse (Perception) assorti de votre DD de sauvegarde des sorts pour le remarquer. Lors de l’inscription du glyphe, vous décidez de son déclencheur et de l’effet porté par le symbole : discorde, douleur, étourdissement, mort, sommeil ou terreur. Chaque effet est expliqué ci-après.\n\nDéclencheur. Vous décidez ce qui le déclenche à l’incantation du sort. Dans le cas des glyphes de surface, les déclencheurs courants sont les suivants : toucher le glyphe, le fouler, retirer un objet qui le recouvre ou s’approcher dans un certain rayon. Pour les glyphes inscrits dans un objet, les déclencheurs courants sont l’ouverture de l’objet et la vue du glyphe. Vous pouvez préciser le déclencheur afin que seules les créatures d’un type donné l’activent (le glyphe ne pourrait ainsi affecter que les Aberrations). Vous pouvez aussi définir les critères de créatures qui ne déclenchent pas le glyphe, comme le fait de prononcer un certain mot de passe.\n\nQuand il s’active, le glyphe se met à luire en emplissant une Sphère de 18 m de rayon de Lumière faible pendant 10 minutes, après quoi le sort prend fin. Chaque créature prise dans la Sphère au moment de l’activation du glyphe est ciblée par son effet, de même que toute créature qui pénètre dans la Sphère pour la première fois d’un tour ou y termine son tour. Une même créature ne peut être ciblée qu’une fois par tour.\n\nDiscorde. Chaque cible effectue un jet de sauvegarde de Sagesse. En cas d’échec, la cible se chamaille verbalement avec une autre créature pendant 1 minute. Tout ce temps, elle est incapable de communiquer de manière cohérente et ses jets d’attaque et tests de caractéristique s’effectuent avec le Désavantage.\n\nDouleur. Chaque cible doit réussir un jet de sauvegarde de Constitution sous peine de subir l’état Neutralisé pendant 1 minute.\n\nÉtourdissement. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Étourdi pendant 1 minute.\n\nMort. Chaque cible effectue un jet de sauvegarde de Constitution et subit 10d10 dégâts nécrotiques en cas d’échec, la moitié en cas de réussite.\n\nSommeil. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Inconscient pendant 10 minutes. Une telle créature reprend connaissance si elle subit des dégâts ou si quelqu’un consacre une action à la secouer.\n\nTerreur. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Effrayé pendant 1 minute. Tant qu’une cible est ainsi Effrayée, elle doit s’éloigner au minimum de 9 m du glyphe à chacun de ses tours si elle en a la possibilité.","classes":["bard","cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"telekinesie","name":"Télékinésie","level":5,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous recevez la faculté de déplacer ou manipuler objets et créatures par la simple pensée. À l’incantation, ainsi qu’au prix de l’action Magie à vos tours suivants avant la fin du sort, vous pouvez exercer votre volonté sur une créature ou un objet que vous voyez à portée pour produire l’effet adéquat décrit plus loin. Vous pouvez affecter la même cible round après round, ou en sélectionner une nouvelle chaque fois que vous le souhaitez. Si vous changez de cible, la précédente n’est plus affectée par le sort.\n\nCréature. Vous tentez de déplacer une créature de taille TG ou inférieure. La cible doit réussir un jet de sauvegarde de Force sous peine d’être déplacée d’un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Jusqu’à la fin de votre tour suivant, la créature subit l’état Entravé ; si vous la soulevez dans les airs, elle y reste suspendue. Elle chute à la fin de votre tour suivant sauf si vous recourez une nouvelle fois à cette option sur elle et qu’elle rate le JS.\n\nObjet. Vous tentez de déplacer un objet de taille TG ou inférieure. Si l’objet n’est porté par personne, vous parvenez automatiquement à le déplacer d’un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Si l’objet est porté par une créature, celle-ci doit réussir un jet de sauvegarde de Force, sans quoi vous lui arrachez l’objet et le déplacez d’un maximum de 9 m dans la direction de votre choix, dans les limites de portée du sort. Vous pouvez exercer un contrôle plus précis sur les objets soumis à votre poigne télékinétique, comme manipuler un outil rudimentaire.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"teleportation","name":"Téléportation","level":7,"school":"conjuration","castingTime":"action","range":"3 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Ce sort vous transporte instantanément, ainsi que huit créatures consentantes que vous voyez à portée, ou bien un seul objet que vous voyez à portée, vers la destination sélectionnée. Si vous ciblez un objet, il doit être de taille G ou inférieure et ne doit pas être porté par une créature non consentante.\n\nVous devez connaître la destination que vous choisissez et elle doit se trouver sur le même plan d’existence que vous. Votre niveau de familiarité avec la destination détermine si vous y parvenez effectivement. Le MJ lance 1d100 en consultant la table Résultat de téléportation et l’explication correspondante.\n\nRésultat de téléportation Familiarité Incident Zone comparable Déviation Sur place Cercle permanent — — — 01–00 Objet lié — — — 01–00 Grande familiarité 01–05 06–13 14–24 25–00 Vu plusieurs fois 01–33 34–43 44–53 54–00 Vu une fois ou décrit 01–43 44–53 54–73 74–00 Destination factice 01–50 51–00 — —\n\nFamiliarité. Les termes de la colonne Familiarité de la table se comprennent comme suit :\n\n• « Cercle permanent » fait référence à un cercle de téléportation permanent dont vous connaissez la séquence de runes.\n\n• « Objet lié » indique que vous détenez un objet rapporté de la destination souhaitée au cours des six derniers mois, comme un livre issu de la bibliothèque d’un Magicien.\n\n• « Grande familiarité » correspond à un endroit où vous avez passé du temps, un lieu que vous avez étudié en profondeur ou un site que vous voyez à l’incantation du sort.\n\n• « Vu plusieurs fois » représente un lieu que vous avez vu plus d’une fois, mais que vous connaissez finalement assez peu.\n\n• « Vu une fois ou décrit » correspond à un site que vous n’avez vu qu’une fois, éventuellement par magie, ou un endroit qu’on vous a décrit avec un certain détail, éventuellement par le biais d’une carte.\n\n• « Destination factice » correspond à un lieu qui n’existe pas. Vous avez par exemple tenté de scruter le sanctuaire de l’ennemi, mais avez été dupé par une illusion, à moins que vous cherchiez à atteindre un lieu qui n’existe plus.\n\nIncident. La magie imprévisible de ce sort se traduit par une mésaventure. Chaque créature téléportée (ou l’objet ciblé) subit 3d10 dégâts de force et le MJ rejoue sur la table pour voir où vous terminez (plusieurs incidents consécutifs sont possibles, entraînant chaque fois des dégâts).\n\nZone comparable. Vous et votre groupe (ou l’objet ciblé) terminez dans une zone différente dont l’ambiance et l’aspect se rapprochent de la destination souhaitée. Vous apparaissez à l’endroit comparable le plus proche. Si vous souhaitiez rejoindre votre laboratoire, par exemple, vous pourriez aboutir dans celui d’une autre personne de la même ville.\n\nDéviation. Vous et votre groupe (ou l’objet ciblé) arrivez à 2d12 x 1,5 km et dans une direction aléatoire de la destination souhaitée. Lancez 1d8 pour la direction : 1, est ; 2, sud-est ; 3, sud ; 4, sud-ouest ; 5, ouest ; 6, nord-ouest ; 7, nord ; 8, nord-est.\n\nSur place. Vous et votre groupe (ou l’objet ciblé) arrivez à l’endroit souhaité.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"tempete-de-feu","name":"Tempête de feu","level":7,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une tempête de flammes éclate à portée. La zone de la tempête consiste en un maximum de 10 Cubes de 3 m, que vous disposez à votre guise. Chaque Cube doit être contigu à au moins un autre Cube.\n\nChaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité et subit 7d10 dégâts de feu en cas d’échec, la moitié en cas de réussite. L’explosion embrase les objets inflammables de la zone qui ne sont portés par personne.","classes":["cleric","druid","sorcerer"],"source":"SRD 5.2.1"},{"canonicalId":"tempete-de-grele","name":"Tempête de grêle","level":4,"school":"evocation","castingTime":"action","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une moufle"},"duration":"instantanée","concentration":false,"ritual":false,"description":"La grêle s’abat au sol dans un Cylindre de 6 m de rayon et 12 m de hauteur centré sur un point à portée. Chaque créature prise dans le Cylindre effectue un jet de sauvegarde de Dextérité. Elle subit 2d10 dégâts contondants et 4d6 dégâts de froid en cas d’échec, la moitié en cas de réussite.\n\nLes grêlons transforment le sol du Cylindre en Terrain difficile jusqu’à la fin de votre tour suivant.\n\nEmplacement de niveau supérieur. Les dégâts contondants augmentent de 1d10 par niveau d’emplacement au-delà du 4e.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"tempete-de-neige","name":"Tempête de neige","level":3,"school":"conjuration","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un parapluie miniature"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Jusqu’à la fin du sort, la neige tombe dans un Cylindre de 12 m de haut et 6 m de diamètre centré sur un point que vous choisissez à portée. La Visibilité de la zone est nulle et les flammes nues s’y éteignent aussitôt. Le sol du Cylindre constitue un Terrain difficile.\n\nQuand une créature pénètre dans le Cylindre pour la première fois d’un tour ou qu’elle y commence son tour, elle doit réussir un jet de sauvegarde de Dextérité sous peine de subir l’état À terre et de perdre sa Concentration.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"tempete-vengeresse","name":"Tempête vengeresse","level":9,"school":"conjuration","castingTime":"action","range":"1,5 km","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un nuage menaçant se forme pour toute la durée, centré sur un point à portée, et se déploie sur un rayon de 90 m. Chaque créature prise dans le nuage à son apparition doit réussir un jet de sauvegarde de Constitution sous peine de subir 2d6 dégâts de tonnerre, ainsi que l’état Assourdi pour toute la durée.\n\nAu début de chacun de vos tours suivants, la tempête produit des effets différents, comme détaillé ci-après.\n\nTour 2. Une pluie acide s’abat. Tous les objets et créatures directement dominés par le nuage subissent 4d6 dégâts d’acide.\n\nTour 3. Vous invoquez six éclairs qui jaillissent du nuage pour frapper six créatures ou objets dominés par le nuage. Chaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d6 dégâts de foudre en cas d’échec, la moitié en cas de réussite.\n\nTour 4. La grêle s’abat depuis le nuage. Toute créature directement dominée par le nuage subit 2d6 dégâts contondants.\n\nTours 5 à 10. La zone directement dominée par le nuage est assaillie de bourrasques et d’une pluie glaciale. Toute créature qui s’y trouve subit 1d6 dégâts de froid. Jusqu’à la fin du sort, la zone constitue un Terrain difficile et présente une Visibilité nulle, les attaques à distance avec une arme y sont impossibles et un vent fort souffle dans toute la zone.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"tenebres","name":"Ténèbres","level":2,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une touffe de fourrure de chauve-souris et un bout de charbon"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Pour toute la durée, des Ténèbres magiques se déploient depuis un point à portée en remplissant une Sphère de 4,50 m de rayon. La Vision dans le noir ne perce pas ces ténèbres et les lumières non magiques n’illuminent pas dans la Sphère.\n\nAu lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les Ténèbres emplissent une Émanation de 4,50 m centrée sur l’objet. Il suffit de recouvrir cet objet d’une surface opaque, comme une gamelle ou un heaume, pour bloquer les Ténèbres.\n\nSi tout ou partie de ce sort chevauche la zone de Lumière vive ou faible créée par un sort du 2e niveau ou inférieur, l’effet qui produit cette lumière est dissipé.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"tentacules-noirs","name":"Tentacules noirs","level":4,"school":"conjuration","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un tentacule"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Des tentacules frétillants d’un noir d’ébène surgissent du sol et emplissent un espace de 6 m de côté que vous voyez à portée. Pour toute la durée, ces tentacules transforment le sol de la zone en Terrain difficile.\n\nToute créature prise dans la zone effectue un jet de sauvegarde de Force. En cas d’échec, elle subit 3d6 dégâts contondants, ainsi que l’état Entravé jusqu’à la fin du sort. Une créature effectue aussi ce JS si elle pénètre dans la zone ou y termine son tour. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nUne créature Entravée peut entreprendre une action pour effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts, et met à un terme à l’état sur elle-même en cas de réussite.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"terrain-hallucinatoire","name":"Terrain hallucinatoire","level":4,"school":"illusion","castingTime":"10 minutes","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un champignon"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Un terrain naturel qui pourrait loger dans un Cube de 45 m à portée apparaît comme un autre type de terrain naturel, sur les plans visuel, auditif et olfactif. Ainsi un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou autre environnement difficile ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée.\n\nLes bâtiments, l’équipement et les créatures de la zone ne changent pas. Les propriétés tactiles du terrain ne changent pas non plus, si bien qu’une créature qui pénètre dans la zone remarquera probablement l’illusion.\n\nSi la différence n’est pas évidente au contact, une créature qui examine la zone peut entreprendre l’action Étude pour tenter un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts afin de percer l’illusion à jour. Une créature qui discerne le subterfuge perçoit une image vague superposée au véritable terrain.","classes":["bard","druid","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"terreur","name":"Terreur","level":3,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une plume blanche"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Chaque créature prise dans un Cône de 9 m doit réussir un jet de sauvegarde de Sagesse sous peine de lâcher ce qu’elle tient, et de subir l’état Effrayé pour toute la durée.\n\nAinsi Effrayée, la créature entreprend à chacun de ses tours l’action Pointe pour s’éloigner de vous par le chemin le plus sûr, sauf si elle n’a nulle part où aller.\n\nSi la créature termine son tour en un espace d’où elle ne vous a plus dans son champ de vision, elle effectue un jet de sauvegarde de Sagesse. En cas de réussite, le sort prend fin pour elle.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"texte-illusoire","name":"Texte illusoire","level":1,"school":"illusion","castingTime":"1 minute ou rituel","range":"contact","components":{"verbal":false,"somatic":true,"material":true,"materialText":"de l’encre d’une valeur minimale de 10 po, que le sort détruit"},"duration":"10 jours","concentration":false,"ritual":true,"description":"Vous écrivez sur du parchemin, du papier ou autre surface adaptée et y insufflez une illusion qui persiste pour toute la durée.\n\nÀ vos yeux, ainsi qu’à ceux de toute créature que vous désignez à l’incantation du sort, le texte paraît normalement écrit, de votre main, et porte le message voulu de votre part. Pour toute autre créature, le texte paraît rédigé selon un alphabet inconnu ou magique, parfaitement incompréhensible. Une autre option consiste à donner un sens différent au message, qui semble écrit par quelqu’un d’autre et dans une autre langue que vous maîtrisez.\n\nSi le sort est dissipé, le texte original et l’illusion disparaissent. Une créature dotée de la Vision lucide peut lire le message caché.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"toile-d-araignee","name":"Toile d’araignée","level":2,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"quelques filandres de toile d’araignée"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous invoquez une masse gluante de fils d’araignée en un point que vous choisissez à portée. Pour toute la durée, cette toile remplit un Cube de 6 m depuis ce point d’origine. Elle constitue un Terrain difficile et la Visibilité est réduite dans la zone.\n\nSi les fils ne peuvent pas se fixer à deux volumes solides (comme des murs ou des arbres) et ne sont pas disposés en travers d’un sol, d’un mur ou d’un plafond, la toile s’effondre sur elle-même et le sort prend fin au début de votre tour suivant. Invoquée sur une surface plane, la toile présente une épaisseur de 1,50 m.\n\nQuand une créature pénètre pour la première fois d’un tour dans la toile ou qu’elle y commence son tour, elle doit réussir un jet de sauvegarde de Dextérité sous peine de subir l’état Entravé tant qu’elle reste dans la toile et qu’elle ne s’en est pas libérée. Une créature ainsi Entravée peut consacrer son action à effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts. En cas de réussite, elle n’est plus Entravée.\n\nLa toile est inflammable. Tout Cube de toile de 1,50 m exposé aux flammes brûle en 1 round et inflige 2d4 dégâts de feu à toute créature qui commence son tour dans les flammes.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"tremblement-de-terre","name":"Tremblement de terre","level":8,"school":"transmutation","castingTime":"action","range":"150 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pierre brisée"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez un point du sol que vous voyez à portée. Pour toute la durée, le sol est parcouru d’intenses secousses dans un cercle de 30 m de rayon centré sur le point choisi. Le sol concerné constitue un Terrain difficile.\n\nÀ l’incantation du sort et à la fin de chacun de vos tours pour toute la durée, chaque créature au contact du sol de la zone effectue un jet de sauvegarde de Dextérité. En cas d’échec, la créature subit l’état À terre et sa Concentration est rompue.\n\nVous pouvez également provoquer les effets ci-après.\n\nCrevasses. Un total de 1d6 crevasses de ce type s’ouvrent dans la zone du sort à la fin du tour de l’incantation. Vous choisissez leurs emplacements, qui ne doivent pas se situer sous des structures. Elles sont chacune profondes de 1d10 x 3 m, larges de 3 m et s’étendent d’un bout de la zone du sort à l’autre. Une créature située dans l’espace d’une fissure doit réussir un jet de sauvegarde de Dextérité sous peine d’y chuter. En cas de réussite, elle accompagne le rebord de la crevasse et reste à la surface.\n\nStructures. Le séisme inflige 50 dégâts contondants à toute structure en contact avec le sol de la zone à l’incantation du sort, ainsi qu’à la fin de chacun de vos tours jusqu’à la fin du sort. Si un bâtiment tombe à 0 point de vie, il s’effondre. Une créature distante d’une telle structure de la moitié de sa hauteur ou moins effectue un jet de sauvegarde de Dextérité. En cas d’échec, la créature subit 12d6 dégâts contondants et l’état À terre, et finit ensevelie dans les gravats. S’en extraire demande de réussir un test de Force (Athlétisme) DD 20 au prix d’une action. En cas de réussite, elle subit uniquement la moitié de ces dégâts.","classes":["cleric","druid","sorcerer"],"source":"SRD 5.2.1"},{"canonicalId":"tsunami","name":"Tsunami","level":8,"school":"conjuration","castingTime":"1 minute","range":"1,5 km","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 6 rounds","concentration":true,"ritual":false,"description":"Une muraille d’eau se matérialise en un point que vous choisissez à portée. Ce mur peut atteindre jusqu’à 90 m de longueur, 90 m de hauteur et 15 m d’épaisseur. Le mur persiste pour toute la durée.\n\nQuand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Force et subit 6d10 dégâts contondants en cas d’échec, la moitié en cas de réussite.\n\nAu début de chacun de vos tours suivant son apparition, le mur et toutes les créatures qu’il englobe s’éloignent de 15 m de vous. Toutes les créatures de taille TG ou inférieure qui occupent un espace dans lequel le mur se déplace doivent réussir un jet de sauvegarde de Force sous peine de subir 5d10 dégâts contondants. Une même créature ne peut subir ces dégâts qu’une fois par round. À la fin du tour, la hauteur du mur diminue de 15 m et les dégâts qu’il peut infliger aux rounds suivants diminuent de 1d10. Une fois que la hauteur du mur est de 0 m, le sort prend fin.\n\nUne créature prise dans le mur ne peut se déplacer qu’en nageant. La force de la vague est toutefois telle que la créature doit pour ce faire réussir un test de Force (Athlétisme) contre le DD de sauvegarde du sort. En cas d’échec, elle ne peut pas se déplacer. Une créature qui se déplace hors du mur tombe au sol.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"vague-tonnante","name":"Vague tonnante","level":1,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous produisez une vague de force tonitruante. Chaque créature prise dans un Cube de 4,50 m émanant de vous effectue un jet de sauvegarde de Constitution. En cas d’échec, la créature subit 2d8 dégâts de tonnerre et le choc l’éloigne de 3 m de vous. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nEn outre, les objets non fixés entièrement compris dans le Cube sont automatiquement repoussés de 3 m de vous par le sort, dont le fracas s’entend à une distance de 90 m.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 1.","classes":["bard","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"vent-divin","name":"Vent divin","level":6,"school":"transmutation","castingTime":"1 minute","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une bougie"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous et un maximum de dix créatures consentantes que vous choisissez à portée adoptez une forme gazeuse pour toute la durée et apparaissez comme autant de volutes. Tant qu’elle est sous cette forme brumeuse, une cible est dotée d’une Vitesse de vol de 90 m avec la faculté de vol stationnaire, de l’Immunité contre l’état À terre et de la Résistance aux dégâts contondants, perforants et tranchants.\n\nLes seules actions qu’elle peut entreprendre sous cette forme sont l’action Pointe et commencer à reprendre sa forme normale au prix de l’action Magie. Il lui faut 1 minute pour retrouver sa forme d’origine, intervalle durant lequel elle subit l’état Étourdi. Jusqu’à la fin du sort, la créature peut également reprendre une forme gazeuse, transformation qui lui demande aussi d’entreprendre l’action Magie et nécessite 1 minute.\n\nSi une cible est sous forme gazeuse et en vol au moment où le sort prend fin, elle redescend au rythme de 18 m par round pendant 1 minute, jusqu’à atterrir sans heurt. Si cette minute ne lui a pas suffi à toucher le sol, la cible chute de la distance restante.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"verrou-magique","name":"Verrou magique","level":2,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre d’or d’une valeur minimale de 25 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous touchez un accès fermé : porte, fenêtre, portail, récipient ou écoutille. L’accès est alors verrouillé magiquement pour toute la durée. Ce verrou résiste à toutes les tentatives d’ouverture non magiques.\n\nVous et toutes les créatures que vous désignez à l’incantation du sort pouvez ouvrir et fermer normalement l’objet malgré le verrou. Vous pouvez également décider d’un mot de passe qui déverrouille l’objet pendant 1 minute s’il est prononcé dans un rayon de 1,50 m de celui-ci.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"vision-dans-le-noir","name":"Vision dans le noir","level":2,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une carotte séchée"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Pour toute la durée, une créature consentante que vous touchez physiquement acquiert la Vision dans le noir sur 45 m.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"vision-supreme","name":"Vision suprême","level":6,"school":"divination","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de champignon d’une valeur minimale de 25 po, que le sort détruit"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Pour toute la durée, une créature consentante que vous touchez physiquement acquiert la Vision lucide sur 36 m.","classes":["bard","cleric","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"voie-vegetale","name":"Voie végétale","level":6,"school":"conjuration","castingTime":"action","range":"3 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Ce sort crée un lien magique entre une plante inanimée à portée, de taille G ou supérieure, et une autre plante du même plan d’existence, sans contrainte de distance. Vous devez avoir déjà vu ou touché la plante de destination au moins une fois.\n\nPour toute la durée, toutes les créatures peuvent s’avancer dans la plante ciblée et ressortir par la plante de destination en y consacrant 1,50 m de leur déplacement.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"vol","name":"Vol","level":3,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une plume"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous touchez une créature consentante. Pour toute la durée, la cible acquiert une Vitesse de vol de 18 m et bénéficie du vol stationnaire. Lorsque le sort prend fin, la cible tombe si elle est toujours dans les airs, à moins de pouvoir arrêter sa chute. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 3e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"zone-de-verite","name":"Zone de vérité","level":2,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Vous créez une zone magique qui interdit les mensonges dans une Sphère de 4,50 m de rayon centrée sur un point à portée.\n\nJusqu’à la fin du sort, quand une créature entre dans la zone du sort pour la première fois d’un tour ou y commence son tour, elle effectue un jet de sauvegarde de Charisme. En cas d’échec, elle ne peut mentir sciemment tant qu’elle est dans la zone. Vous savez si une telle créature a raté ou réussi son jet de sauvegarde.\n\nUne créature affectée a conscience du sort et peut éluder les questions auxquelles elle répondrait normalement par un mensonge. Elle peut se montrer évasive, mais ce qu’elle dit doit rester vrai dans son esprit.","classes":["bard","cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"aspersion-acide","name":"Aspersion acide","level":0,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous créez une bulle acide en un point à portée, où elle explose sous forme de Sphère de 1,50 m de rayon. Chaque créature prise dans la Sphère doit réussir un jet de sauvegarde de Dextérité sous peine de subir 1d6 dégâts d’acide. Amélioration de sort mineur. Les dégâts augmentent de 1d6 lorsque vous atteignez les niveaux 5 (2d6), 11 (3d6) et 17 (4d6).","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"assistance","name":"Assistance","level":0,"school":"divination","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous touchez physiquement une créature consentante en choisissant une compétence. Jusqu’à la fin du sort, la créature ajoute 1d4 au résultat de tout test de caractéristique associé à cette compétence.","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"bouffee-de-poison","name":"Bouffée de poison","level":0,"school":"necromancy","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez une brume toxique vers une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d12 dégâts de poison. Amélioration de sort mineur. Les dégâts augmentent de 1d12 lorsque vous atteignez les niveaux 5 (2d12), 11 (3d12) et 17 (4d12).","classes":["druid","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"coup-au-but","name":"Coup au but","level":0,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":false,"somatic":true,"material":true,"materialText":"une arme dont vous avez la maîtrise, d’une valeur minimale de 1 pc"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une fulgurance magique vous guide pour effectuer une attaque avec l’arme utilisée pour l’incantation. Les jets d’attaque et de dégâts correspondants se basent sur votre caractéristique d’incantation, au lieu de la Force ou la Dextérité. Si l’attaque inflige des dégâts, il peut s’agir de dégâts radiants ou des dégâts normaux de l’arme (à votre convenance).\n\nAmélioration de sort mineur. Que vous infligiez des dégâts radiants ou les dégâts normaux de l’arme, l’attaque inflige des dégâts radiants supplémentaires lorsque vous atteignez les niveaux 5 (1d6), 11 (2d6) et 17 (3d6).","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"crosse-des-druides","name":"Crosse des druides","level":0,"school":"transmutation","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"du gui"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Le bois d’un gourdin ou d’un bâton de combat que vous tenez s’imprègne du pouvoir de la nature. Pour toute la durée, vous pouvez recourir à votre caractéristique d’incantation plutôt qu’à la Force pour les jets d’attaque et de dégâts de vos attaques de corps à corps effectuées avec cette arme.\n\nLe dé de dégâts de l’arme passe en outre à d8. Si l’attaque inflige des dégâts, il peut s’agir de dégâts de force ou des dégâts normaux de l’arme (à votre convenance).\n\nLe sort prend fin prématurément si vous le relancez ou si vous lâchez l’arme.\n\nAmélioration de sort mineur. Le dé de dégâts change lorsque vous atteignez les niveaux 5 (d10), 11 (d12) et 17 (2d6).","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"decharge-occulte","name":"Décharge occulte","level":0,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez un rayon d’énergie crépitante. Effectuez une attaque de sort à distance contre une créature ou un objet à portée. Si l’attaque touche, la cible subit 1d10 dégâts de force.\n\nAmélioration de sort mineur. Le sort produit deux rayons au niveau 5, trois au niveau 11 et quatre au niveau 17. Vous pouvez viser la même cible avec ces rayons ou les répartir entre plusieurs cibles. Effectuez un jet d’attaque séparé pour chaque rayon.","classes":["warlock"],"source":"SRD 5.2.1"},{"canonicalId":"druidisme","name":"Druidisme","level":0,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous murmurez aux esprits de la nature pour créer l’un des effets suivants à portée :\n\nCapteur climatique. Vous produisez un effet sensoriel inoffensif de taille TP qui prédit le temps qu’il fera où vous vous trouvez dans les 24 prochaines heures.\n\nFloraison. Vous faites instantanément s’épanouir une fleur, s’ouvrir une cosse de graines ou fleurir un bourgeon.\n\nEffet sensoriel. Vous créez un effet sensoriel inoffensif ; feuilles qui tombent, petites fées spectrales qui dansent, douce brise, bruit animal, vague odeur de sconse, etc. L’effet doit tenir dans un Cube de 1,50 m.\n\nJeu avec le feu. Vous allumez ou éteignez une bougie, une torche ou un petit feu de camp.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"elementalisme","name":"Élémentalisme","level":0,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous exercez votre contrôle sur les éléments, ce qui produit l’un des effets suivants à portée.\n\nAppel d’air. Vous produisez une brise suffisante pour faire ondoyer les vêtements, soulever la poussière, bruisser les feuilles et fermer les portes et volets ouverts compris dans un Cube de 1,50 m.\n\nAppel d’eau. Vous produisez des embruns frais qui humectent les créatures et objets dans un Cube de 1,50 m.\n\nAppel de feu. Vous produisez un nuage de fumée parfumée, colorée et ardente, mais inoffensive, dans un Cube de 1,50 m.\n\nAppel de terre. Vous produisez un linceul de poussière ou de sable qui tapisse les surfaces d’une zone de 1,50 m de côté.\n\nFaçonnage élémentaire. De la terre, du sable, des flammes, de la fumée, de la brume ou de l’eau qui tiennent dans un Cube de 30 cm adoptent grossièrement une forme pendant 1 heure.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"eruption-ensorcelee","name":"Éruption ensorcelée","level":0,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez des énergies ensorcelées vers une créature ou un objet à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d8 dégâts du type choisi : acide, feu, foudre, froid, poison, psychiques ou tonnerre.\n\nSi vous obtenez un 8 sur un d8 du sort, vous pouvez en lancer un autre pour l’ajouter aux dégâts. Quand vous lancez ce sort, le maximum de d8 supplémentaires que vous pouvez ainsi ajouter aux dégâts du sort est égal à votre modificateur de caractéristique d’incantation.\n\nAmélioration de sort mineur. Les dégâts augmentent de 1d8 lorsque vous atteignez les niveaux 5 (2d8), 11 (3d8) et 17 (4d8).","classes":["sorcerer"],"source":"SRD 5.2.1"},{"canonicalId":"message","name":"Message","level":0,"school":"transmutation","castingTime":"action","range":"36 m","components":{"verbal":false,"somatic":true,"material":true,"materialText":"du fil de cuivre"},"duration":"1 round","concentration":false,"ritual":false,"description":"Vous pointez le doigt vers une créature à portée et murmurez un message. La cible (et seulement elle) entend votre message et peut y répondre par un murmure audible de votre seule personne.\n\nVous pouvez lancer ce sort à travers des objets solides si vous connaissez la cible et savez qu’elle se trouve derrière ces obstacles. Le silence magique, 30 cm de pierre, de métal ou de bois, ou une simple feuille de plomb suffisent à bloquer le sort.","classes":["bard","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"poigne-electrique","name":"Poigne électrique","level":0,"school":"evocation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La foudre jaillit de vous vers une créature que vous tentez de toucher. Effectuez une attaque de sort au corps à corps contre la cible. Si l’attaque touche, la cible su
