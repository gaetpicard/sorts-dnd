,"sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"chatiment-de-fournaise","name":"Châtiment de fournaise","level":1,"school":"evocation","castingTime":"action Bonus, que vous entreprenez aussitôt après avoir touché une cible avec une arme de corps à corps ou à mains nues","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Alors que vous touchez la cible, elle subit 1d6 dégâts de feu supplémentaires de l’attaque. Au début de chacun de ses tours jusqu’à la fin du sort, la cible subit 1d6 dégâts de feu et effectue un jet de sauvegarde de Constitution. En cas d’échec, le sort se poursuit. En cas de réussite, le sort prend fin.\n\nEmplacement de niveau supérieur. Tous les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["paladin"],"source":"SRD 5.2.1"},{"canonicalId":"chatiment-de-revelation","name":"Châtiment de révélation","level":2,"school":"transmutation","castingTime":"action Bonus, que vous entreprenez aussitôt après avoir touché une créature avec une arme de corps à corps ou une attaque à mains nues","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"La cible touchée par l’attaque subit 2d6 dégâts radiants supplémentaires. Jusqu’à la fin du sort, la cible émet une Lumière vive dans un rayon de 1,50 m, les jets d’attaque contre elle ont l’Avantage et elle ne peut pas bénéficier de l’état Invisible. Emplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 2e.","classes":["paladin"],"source":"SRD 5.2.1"},{"canonicalId":"chatiment-divin","name":"Châtiment divin","level":1,"school":"evocation","castingTime":"action Bonus, que vous entreprenez aussitôt après avoir touché une cible avec une arme de corps à corps ou à mains nues","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"L’attaque inflige à la cible 2d8 dégâts radiants supplémentaires. Ces dégâts supplémentaires augmentent de 1d8 si la cible est un Fiélon ou un Mort-vivant. Emplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 1.","classes":["paladin"],"source":"SRD 5.2.1"},{"canonicalId":"chien-de-garde","name":"Chien de garde","level":4,"school":"conjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un sifflet en argent"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous invoquez un chien de garde fantomatique en un espace inoccupé que vous voyez à portée. Le molosse reste pour toute la durée (il disparaît toutefois si vous et lui vous retrouvez éloignés de plus de 90 m). En dehors de vous, personne ne voit le chien de garde, qui est à la fois intangible et invulnérable.\n\nQuand une créature de taille S ou supérieure s’approche dans un rayon de 9 m de lui sans prononcer au préalable le mot de passe que vous avez spécifié à l’incantation du sort, le chien se met à aboyer furieusement. Le molosse est doté de la Vision lucide avec une portée de 9 m.\n\nAu début de chacun de vos tours, le molosse tente de mordre un ennemi situé dans un rayon de 1,50 m de lui. Cet ennemi doit réussir un jet de sauvegarde de Dextérité sous peine de subir 4d8 dégâts de force.\n\nÀ vos tours suivants, vous pouvez entreprendre l’action Magie pour déplacer le molosse d’un maximum de 9 m.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"clairvoyance","name":"Clairvoyance","level":3,"school":"divination","castingTime":"10 minutes","range":"1,5 km","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un focaliseur d'une valeur minimale de 100 po"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez un capteur Invisible à portée en un lieu que vous connaissez (pour l’avoir déjà visité ou vu) ou en un lieu que vous ne connaissez pas, mais que vous pouvez imaginer (derrière une porte, au coin d’un couloir ou dans un bosquet d’arbres). Ce capteur intangible et invulnérable reste en place pour toute la durée.\n\nÀ l’incantation du sort, choisissez entre écouter et observer. Vous pouvez alors recourir au sens retenu (ouïe ou vision) comme si vous vous trouviez dans l’espace du capteur. Par une action Bonus, vous pouvez passer de l’ouïe à la vision, ou réciproquement.\n\nUne créature qui voit le capteur (parce qu’elle bénéficie de détection de l’invisibilité ou de la Vision lucide, par exemple) perçoit un globe lumineux de la taille de votre poing.","classes":["bard","cleric","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"clignotement","name":"Clignotement","level":3,"school":"transmutation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Lancez 1d6 à la fin de chacun de vos tours, pour toute la durée. Sur un résultat de 4 à 6, vous disparaissez de votre plan d’existence actuel pour réapparaître sur le Plan Éthéré (si vous êtes déjà sur ce dernier plan, le sort prend aussitôt fin).\n\nTant que vous êtes sur le Plan Éthéré, vous percevez le plan d’où vous venez, mais tout est nuances de gris et votre vision ne porte que sur 18 m. Vous pouvez affecter d’autres créatures du Plan Éthéré (et elles peuvent vous affecter), tandis que les créatures situées sur l’autre plan ne vous perçoivent pas, sauf celles qui disposent d’une faculté spéciale leur permettant de percevoir ce qui se trouve sur le Plan Éthéré.\n\nVous retournez sur l’autre plan au début de votre tour suivant, ainsi que si le sort prend fin alors que vous êtes sur le Plan Éthéré. Vous réapparaissez alors en un espace inoccupé que vous voyez et choisissez dans un rayon de 3 m de l’espace que vous aviez quitté. Si aucun espace n’est libre dans ce rayon, vous apparaissez dans l’espace inoccupé le plus proche.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"clone","name":"Clone","level":8,"school":"necromancy","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 1 000 po que le sort détruit et un récipient d’une valeur minimale de 2 000 po, assez grand pour contenir la créature à cloner"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature ou au moins 15 cm3 de sa chair. Une réplique inerte se forme à l’intérieur d’un récipient utilisé pour l’incantation, sa croissance jusqu’à maturité demandant 120 jours. Vous décidez si le clone est une version plus jeune de la créature ou du même âge. Le clone reste inerte et immarcescible tant que le récipient n’est pas endommagé.\n\nSi, une fois le clone formé, la créature d’origine meurt, son âme (à condition qu’elle soit libre et consentante) est transférée dans le clone. Le clone est identique à l’original sur le plan physique et présente la même personnalité ; ses souvenirs sont les mêmes, ainsi que ses caractéristiques, mais il ne récupère rien de l’équipement de la créature clonée.\n\nLa dépouille du cloné, si elle existe, devient inerte et ne pourra être ramenée à la vie, étant donné que l’âme de la créature est ailleurs.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"coffre-secret","name":"Coffre secret","level":4,"school":"conjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un coffre de 90 cm par 60 et 60, fait de matériaux rares d’une valeur minimale de 5 000 po, et sa réplique de taille TP faite des mêmes matériaux d’une valeur minimale de 50 po"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous cachez un coffre et son contenu sur le Plan Éthéré. Vous devez toucher le coffre et la réplique miniature qui sert de composante matérielle pour le sort. Le coffre peut renfermer un maximum de 0,3 m3 de matière non vivante (90 x 60 x 60 cm).\n\nTant que le coffre reste sur le Plan Éthéré, vous pouvez entreprendre l’action Magie pour toucher la réplique et rappeler le coffre. Il réapparaît au sol, en un espace inoccupé dans un rayon de 1,50 m de vous. Vous pouvez le renvoyer sur le Plan Éthéré au prix de l’action Magie, en touchant simultanément le coffre et sa réplique.\n\nAu bout de 60 jours, 5 % de risque s’accumulent chaque jour que le sort prenne fin. Le sort prend aussi fin si vous le relancez ou si la réplique de taille TP est détruite. Si le sort prend fin alors que le grand coffre se trouve sur le Plan Éthéré, celui-ci reste sur ce plan en attendant d’être retrouvé.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"colonne-de-flamme","name":"Colonne de flamme","level":5,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de soufre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une colonne verticale de flammes radieuses surgit des hauteurs. Chaque créature prise dans un Cylindre d’un rayon de 3 m, haut de 12 m et centré sur un point à portée effectue un jet de sauvegarde de Dextérité. Elle subit 5d6 dégâts de feu et 5d6 dégâts radiants en cas d’échec, la moitié en cas de réussite.\n\nEmplacement de niveau supérieur. Les dégâts de feu et les dégâts radiants augmentent chacun de 1d6 par niveau d’emplacement au-delà du 5e.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"communication-avec-les-animaux","name":"Communication avec les animaux","level":1,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 minutes","concentration":false,"ritual":true,"description":"Pour toute la durée, vous avez la faculté de comprendre les Bêtes et de communiquer verbalement avec elles, et toutes les options de compétence de l’action Influence vous sont accessibles avec elles.\n\nLa plupart des Bêtes ont peu à dire au-delà des sujets de survie et d’affection, mais toutes sont capables de vous informer sur les environs et les monstres locaux, notamment ce qu’elles ont perçu au cours de la dernière journée.","classes":["bard","druid","warlock","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"communication-a-distance","name":"Communication à distance","level":3,"school":"divination","castingTime":"action","range":"illimitée","components":{"verbal":true,"somatic":true,"material":true,"materialText":"du fil de cuivre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous envoyez un bref message n’excédant pas 25 mots à une créature que vous avez rencontrée (ou qu’une personne qui l’a rencontrée vous a décrite). L’esprit de la cible perçoit le message, celle-ci vous identifie comme expéditeur si elle vous connaît et peut vous répondre aussitôt dans le même mode. Le sort permet aux cibles de comprendre le sens de votre message.\n\nLa distance qui vous sépare du destinataire n’a pas d’importance et vous pouvez même atteindre d’autres plans d’existence, mais si la cible se trouve sur un plan différent, il y a 5 % de chance pour que le message n’aboutisse pas. Si la transmission ne s’est pas faite, vous le savez.\n\nÀ la réception du message, la créature peut vous empêcher de la recontacter par ce sort pour les 8 prochaines heures. Si vous tentez de lui envoyer un autre message dans cet intervalle, vous savez qu’elle vous a bloqué et le sort échoue.","classes":["bard","cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"communication-avec-les-morts","name":"Communication avec les morts","level":3,"school":"necromancy","castingTime":"action","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de l’encens qui brûle"},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Vous octroyez un semblant de vie à un cadavre que vous choisissez à portée, pour qu’il puisse répondre aux questions que vous lui posez. La dépouille doit disposer d’une bouche et le sort échoue si la créature décédée était un Mort-vivant au moment de trépasser. Le sort échoue également si le cadavre a déjà été ciblé par ce sort au cours des 10 derniers jours.\n\nJusqu’à la fin du sort, vous pouvez poser jusqu’à cinq questions à la dépouille. Elle ne sait rien de plus que de son vivant et parle toujours les mêmes langues. Ses réponses ont tendance à se montrer brèves, sibyllines ou répétitives, d’autant que le cadavre n’est nullement contraint de vous répondre avec sincérité si vous lui êtes antipathique ou s’il vous voit comme un ennemi.\n\nCe sort ne ramène pas l’âme de la créature dans son corps ; il ne fait qu’animer son esprit. Ainsi, le cadavre ne peut rien apprendre de nouveau ni comprendre ce qui a pu se passer depuis son décès, et ne peut pas davantage conjecturer sur l’avenir.","classes":["bard","cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"communication-avec-les-plantes","name":"Communication avec les plantes","level":3,"school":"transmutation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Vous investissez la flore comprise dans une Émanation immobile de 9 m d’une conscience limitée et de mouvements, de quoi lui permettre de communiquer avec vous et de suivre vos instructions rudimentaires. Vous pouvez interroger ces plantes sur ce qui s’est passé dans la zone du sort depuis un jour, notamment la nature des créatures qui l’ont traversée, le temps qu’il a fait et autres détails.\n\nVous pouvez également transformer tout Terrain difficile engendré par la végétation (buissons et sousbois, par exemple) en terrain ordinaire qui persiste pour toute la durée. Ou bien transformer un terrain ordinaire pourvu de végétation en Terrain difficile qui persiste pour toute la durée. Le sort ne permet pas aux plantes de se déraciner pour se déplacer, mais elles peuvent agiter leurs branches, leurs vrilles et leurs pédoncules.\n\nSi une créature de type Plante se trouve dans la zone, vous pouvez communiquer avec elle comme si vous parliez une langue commune.","classes":["bard","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"communion","name":"Communion","level":5,"school":"divination","castingTime":"1 minute ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"encens"},"duration":"1 minute","concentration":false,"ritual":true,"description":"Vous contactez une divinité ou un intermédiaire divin pour lui poser trois questions auxquelles on peut répondre par l’affirmative ou la négative. Vous devez poser vos questions avant la fin du sort.\n\nVous recevez une réponse juste à chaque question. Les êtres divins ne sont pas forcément omniscients, si bien que vous pouvez recevoir « incertain » comme réponse (au lieu de « oui » ou « non ») si la question fait appel à des éléments qui s’écartent du domaine de connaissance de la déité. Si une réponse en un mot peut s’avérer trompeuse ou contraire aux intérêts de la divinité, le MJ peut se fendre d’une courte phrase en guise de réponse.\n\nSi vous lancez le sort plus d’une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu’il ne vous livre aucune réponse.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"communion-avec-la-nature","name":"Communion avec la nature","level":5,"school":"divination","castingTime":"1 minute ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous communiez avec des esprits de la nature en quête d’informations sur les environs. En extérieur, le sort vous investit des connaissances de la zone dans un rayon de 4,5 km. Dans une grotte et en milieu souterrain naturel, ce rayon est limité à 90 m. Le sort reste sans effet dans les endroits où la nature a laissé place aux constructions, comme dans un château ou dans un bourg.\n\nChoisissez trois éléments parmi les suivants ; vous prenez connaissance de ces éléments, en relation avec la zone concernée :\n\n• Position des communautés implantées\n\n• Position des portails vers d’autres plans d’existence\n\n• Position d’une créature dont le facteur de puissance est d’au moins 10 (choisie par le MJ) et dont le type est Céleste, Élémentaire, Fée, Fiélon ou Mort-vivant\n\n• Type de plante, minéral ou Bête le plus courant (choisissez sur quel aspect vous informer)\n\n• Localisation des plans et cours d’eau\n\nAinsi, vous pouvez déterminer où se trouve un puissant monstre de la zone, les plans et cours d’eau, et les bourgs des environs.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"comprehension-des-langues","name":"Compréhension des langues","level":1,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de suie et de sel"},"duration":"1 heure","concentration":false,"ritual":true,"description":"Pour toute la durée, vous comprenez le sens littéral de toute langue parlée que vous entendez. Vous comprenez également tout écrit que vous voyez, à condition de toucher la surface sur laquelle il est rédigé. Il vous faut environ 1 minute pour lire une page de texte. Ce sort ne décrypte pas les symboles ni les messages secrets.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"compulsion","name":"Compulsion","level":4,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Chaque créature de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé jusqu’à la fin du sort.\n\nPour toute la durée, vous pouvez par une action Bonus désigner une direction qui vous est horizontale. Chaque cible Charmée doit, à son tour suivant, consacrer autant de son déplacement que possible à se déplacer dans cette direction, selon le chemin le plus sûr. Une fois ce déplacement terminé, la cible réitère le JS et met un terme au sort sur elle-même en cas de réussite.","classes":["bard"],"source":"SRD 5.2.1"},{"canonicalId":"cone-de-froid","name":"Cône de froid","level":5,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"petit Cône de verre ou de cristal"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous libérez une gerbe d’air glacial. Chaque créature prise dans un Cône de 18 m émanant de vous effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts de froid en cas d’échec, la moitié en cas de réussite. Une créature tuée par ce sort se transforme en statue givrée, jusqu’à ce qu’elle dégèle.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 5e.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"confusion","name":"Confusion","level":4,"school":"enchantment","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"trois coquilles de noix"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Chaque créature prise dans une Sphère de 3 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Sagesse, sous peine de ne pas pouvoir jouer de Réaction ni entreprendre d’action Bonus et de devoir jeter 1d10 au début de chacun de ses tours pour savoir comment elle se comporte à ce tour, selon la table ci-après.\n\n1d10 Comportement du tour 1 La cible n’entreprend aucune action et consacre tout son déplacement à se déplacer. Lancez 1d4 pour la direction : 1, nord ; 2, est ; 3, sud ; 4, ouest. 2–6 La cible ne se déplace pas et n’entreprend aucune action. 7–8 La cible ne se déplace pas et entreprend l’action Attaque pour effectuer une attaque de corps à corps contre une créature aléatoire à portée d’allonge. Si aucune créature n’est à portée d’allonge, la cible n’entreprend aucune action. 9–10 La cible agit et se déplace à sa guise.\n\nLa cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\n\nEmplacement de niveau supérieur. Le rayon de la Sphère augmente de 1,50 m par niveau d’emplacement au-delà du 4e.","classes":["bard","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"contact-avec-les-plans","name":"Contact avec les plans","level":5,"school":"divination","castingTime":"1 minute ou rituel","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"1 minute","concentration":false,"ritual":true,"description":"Vous contactez mentalement un demi-dieu, l’esprit d’un sage défunt ou quelque autre entité érudite d’un autre plan. Le contact avec une telle conscience extraplanaire peut vous anéantir l’esprit.\n\nÀ l’incantation du sort, effectuez un jet de sauvegarde d’Intelligence DD 15. En cas de sauvegarde réussie, vous pouvez poser jusqu’à cinq questions à l’entité. Vous devez les poser avant la fin du sort. Le MJ répond à chaque question par un seul mot, comme « oui », « non », « peut-être », « jamais », « inconséquent » ou « incertain » (si l’entité ne connaît pas la réponse). Si une réponse en un mot risque de s’avérer trompeuse, le MJ peut se fendre d’une courte phrase.\n\nEn cas d’échec, vous subissez 6d6 dégâts psychiques, ainsi que l’état Neutralisé jusqu’à ce que vous terminiez un Repos long. Le sort restauration suprême lancé sur vous met un terme à cet effet.","classes":["wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"contagion","name":"Contagion","level":5,"school":"necromancy","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"7 jours","concentration":false,"ritual":false,"description":"Votre contact transmet une maladie magique. La cible doit réussir un jet de sauvegarde de Constitution sous peine de subir 11d8 dégâts nécrotiques, ainsi que l’état Empoisonné.\n\nVous désignez également une caractéristique à l’incantation. Tant que la cible est Empoisonnée, elle subit le Désavantage aux jets de sauvegarde associés à la caractéristique retenue.\n\nLa cible réitère le jet de sauvegarde à la fin de chacun de ses tours jusqu’à ce qu’elle ait obtenu trois réussites ou trois échecs. Si la cible réussit trois de ces JS, le sort prend fin sur elle. Si elle rate trois de ces JS, le sort persiste sur elle pendant 7 jours.\n\nChaque fois que la cible Empoisonnée reçoit un effet censé mettre fin à son état Empoisonné, elle doit réussir un jet de sauvegarde de Constitution, sans quoi l’état Empoisonné ne prend pas fin.","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"contamination","name":"Contamination","level":6,"school":"necromancy","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous libérez une magie virulente sur une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 14d6 dégâts nécrotiques et son maximum de points de vie est réduit d’autant que les dégâts nécrotiques subis. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nCe sort ne peut réduire son maximum de points de vie en dessous de 1.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"contresort","name":"Contresort","level":3,"school":"abjuration","castingTime":"Réaction, que vous jouez en voyant dans un rayon de 18 m une créature lancer un sort avec une composante verbale, somatique ou matérielle","range":"18 m","components":{"verbal":false,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous tentez d’interrompre une créature en pleine incantation. La créature effectue un jet de sauvegarde de Constitution. En cas d’échec, son sort se dissipe sans effet et l’action, l’action Bonus ou la Réaction entreprise pour l’incantation est gaspillée. Si ce sort était lancé par un emplacement, celui-ci n’est pas dépensé.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"controle-de-l-eau","name":"Contrôle de l’eau","level":4,"school":"transmutation","castingTime":"action","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un mélange d’eau et de poussière"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Jusqu’à la fin du sort, vous contrôlez tout volume d’eau compris dans la zone que vous désignez, un Cube dont l’arête ne dépasse pas 30 m, en y appliquant l’un des effets suivants. Au prix de l’action Magie à vos tours suivants, vous pouvez répéter le même effet ou en choisir un autre.\n\nContrôle du courant. Vous réorientez le cours des eaux de la zone à votre guise, même si les flots doivent surmonter des obstacles, grimper aux murs ou couler dans une direction insolite. Les eaux s’écoulent selon vos instructions, mais une fois qu’elles quittent la zone, la nature reprend ses droits et le courant s’adapte au terrain. Les eaux continuent à couler dans la direction de votre choix jusqu’à la fin du sort ou jusqu’à ce que vous optiez pour un autre effet.\n\nCrue. Vous faites monter le niveau de toutes les eaux dormantes de la zone d’un maximum de 6 m. Si vous choisissez une zone comprise dans un grand plan d’eau, vous engendrez en fait une vague haute de 6 m qui part d’un côté de la zone et déferle vers l’autre avant de s’écraser. Tous les véhicules de taille TG ou inférieure pris sur son passage sont emportés de l’autre côté. Tous les véhicules de taille TG ou inférieure frappés par la vague ont 25 % de risque de chavirer. Le niveau de l’eau reste haut jusqu’à la fin du sort ou jusqu’à ce que vous optiez pour un autre effet. Si cet effet a produit une vague, celle-ci se répète au début de votre tour suivant tant que persiste l’effet de crue.\n\nSéparation des eaux. Vous scindez les eaux de la zone pour créer une tranchée. Cette fosse s’étend sur toute la zone du sort, les eaux séparées formant une paroi verticale de chaque côté. La tranchée reste en place jusqu’à la fin du sort ou jusqu’à ce que vous optiez pour un autre effet. Les eaux la remplissent ensuite progressivement en l’espace d’un round, jusqu’à retrouver leur niveau initial.\n\nTourbillon. Vous engendrez la création d’un tourbillon au centre de la zone, d’une surface minimale de 15 m de côté et d’une profondeur d’au moins 7,50 m. Le tourbillon persiste jusqu’à ce que vous optiez pour un autre effet ou que le sort prenne fin. Les remous sont larges de 1,50 m à leur base pour atteindre jusqu’à 15 m au sommet, pour une hauteur de 7,50 m. Toute créature immergée dans l’eau et située dans un rayon de 7,50 m du tourbillon est tirée de 3 m vers les remous. Lorsqu’une créature entre dans les remous pour la première fois d’un tour ou y termine son tour, elle effectue un jet de sauvegarde de Force. En cas d’échec, elle subit 2d8 dégâts contondants. En cas de réussite, la créature subit la moitié de ces dégâts. Une créature peut s’éloigner du tourbillon à la nage à condition de consacrer au préalable une action à s’en extraire et de réussir un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts.","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"controle-du-climat","name":"Contrôle du climat","level":8,"school":"transmutation","castingTime":"10 minutes","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de l’encens qui brûle"},"duration":"Concentration, jusqu’à 8 heures","concentration":true,"ritual":false,"description":"Vous prenez le contrôle du climat dans un rayon de 7,5 km pour toute la durée. Vous devez vous trouver en extérieur pour lancer ce sort, qui prend fin prématurément dès que vous êtes à l’intérieur.\n\nÀ l’incantation du sort, vous altérez les conditions climatiques du moment, déterminées par le MJ. Vous pouvez modifier les précipitations, la température et le vent. Les nouvelles conditions mettent 1d4 x 10 minutes à prendre effet. Après ce laps de temps, vous pouvez à nouveau altérer les conditions. Quand le sort prend fin, le temps revient progressivement à la normale.\n\nLorsque vous changez les conditions climatiques, identifiez celles du moment dans les tables qui suivent et changez-en le stade d’un cran, vers le haut ou le bas. Lorsque vous modifiez le vent, vous pouvez en changer la direction.\n\nPrécipitations Stade Conditions 1 Ciel dégagé 2 Quelques nuages 3 Ciel chargé ou brume au sol 4 Pluie, grêle ou neige 5 Pluie torrentielle, grêle battante ou blizzard Température Stade Conditions 1 Caniculaire 2 Chaud 3 Doux 4 Frais 5 Froid 6 Glacial Vent Stade Conditions 1 Calme 2 Vent modéré 3 Vent fort 4 Vent violent 5 Tempête","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"convocation-de-dragon","name":"Convocation de dragon","level":5,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un objet gravé d’une représentation de dragon, d’une valeur minimale de 500 po"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous invoquez un esprit draconique. Il se manifeste en un espace inoccupé que vous voyez à portée en reprenant le profil de l’esprit draconique. La créature disparaît quand le sort prend fin, mais également si elle tombe à 0 point de vie.\n\nLa créature constitue un allié pour vous et vos alliés. Au combat, la créature partage votre rang d’Initiative, mais elle joue son tour juste après vous. Elle obéit à vos instructions verbales (pas d’action requise de votre part). Sans ordre de votre part, elle entreprend l’action Esquive et consacre son déplacement à se mettre à l’abri du danger.\n\nEmplacement de niveau supérieur. Le niveau de l’emplacement s’applique chaque fois que le profil de jeu y fait référence.\n\nEsprit draconique Dragon de taille G, Neutre CA 14 + niveau du sort Pv 50 + 10 par niveau du sort au-delà du 5e Vitesse 9 m, nage 9 m, vol 18 m MOD JS MOD JS MOD JS For 19 +4 +4 Dex 14 +2 +2 Con 17 +3 +3 Int 10 +0 +0 Sag 14 +2 +2 Cha 14 +2 +2 Résistances acide, feu, froid, foudre, poison Immunités Charmé, Effrayé, Empoisonné Sens Vision aveugle 9 m, Vision dans le noir 18 m ; Perception passive 12 Langues draconique, comprend les langues que vous connaissez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) Traits Résistances partagées. Lorsque vous convoquez l’esprit, choisissez l’une de ses Résistances aux dégâts. Vous bénéficiez de la Résistance au type de dégâts choisi jusqu’à la fin du sort. Actions Attaques multiples. L’esprit effectue autant d’attaques de Saignée que la moitié du niveau de ce sort (arrondir à l’inférieur) et il recourt à Souffle. Saignée. Corps à corps : Bonus égal à votre modificateur d’attaque des sorts, allonge 3 m. Touché : 1d6 + 4 + le niveau du sort dégâts perforants. Souffle. JS Dextérité : DD égal à votre DD de sauvegarde des sorts, chaque créature dans un cône de 9 m. Échec : 2d6 dégâts d’un type auquel l’esprit a la Résistance (vous choisissez à l’incantation du sort). Réussite : 1/2 dégâts.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"convocations-instantanees","name":"Convocations instantanées","level":6,"school":"conjuration","castingTime":"1 minute ou rituel","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un saphir d’une valeur minimale de 1 000 po"},"duration":"jusqu’à dissipation","concentration":false,"ritual":true,"description":"Vous touchez le saphir de l’incantation et un objet d’un poids maximal de 5 kg et dont la dimension la plus grande n’excède pas 1,80 m. Le sort laisse une marque Invisible sur l’objet et inscrit invisiblement le nom de l’objet sur le saphir. Chaque fois que vous lancez ce sort, vous devez utiliser un saphir différent.\n\nPar la suite, vous pouvez entreprendre l’action Magie pour prononcer le nom de l’objet et broyer le saphir. L’objet apparaît aussitôt dans votre main, quelle que soit la distance qui vous en sépare, même s’il est sur un autre plan, puis le sort prend fin.\n\nSi une autre créature tient ou porte l’objet, broyer le saphir ne le transporte pas, mais vous savez en revanche qui est cette créature et où elle se trouve à l’instant même.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"coquille-antivie","name":"Coquille antivie","level":5,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Une aura rayonne depuis vous pour toute la durée, sous forme d’une Émanation de 3 m. L’aura empêche les créatures autres que les Artificiels et les Mortsvivants de la franchir ou même d’y passer quelque partie de leur anatomie.\n\nUne créature affectée peut en revanche lancer des sorts ou effectuer des attaques à distance (ou avec des armes à allonge) à travers la barrière. Si votre déplacement oblige une créature affectée à traverser la barrière, le sort prend fin.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"corde-enchantee","name":"Corde enchantée","level":2,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de la corde"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez une corde. Une extrémité de la corde se dresse dans les airs jusqu’à ce que toute la corde soit perpendiculaire au sol ou qu’elle atteigne un plafond. À son extrémité supérieure, un portail Invisible de 1,50 m sur 90 cm donne sur un espace extradimensionnel qui persiste jusqu’à la fin du sort.\n\nOn peut accéder à cet espace en grimpant au sommet de la corde qu’on peut haler dans l’espace ou laisser choir de l’ouverture. L’espace peut accueillir un maximum de huit créatures de taille M ou inférieure.\n\nLes attaques, sorts et autres effets ne peuvent franchir l’entrée de l’espace extradimensionnel, dans un sens comme dans l’autre, mais ses occupants voient ce qui se passe à l’extérieur. Tout ce qui se trouve à l’intérieur de l’espace tombe quand le sort prend fin.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"couleurs-dansantes","name":"Couleurs dansantes","level":1,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de sable coloré"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez une gerbe éblouissante de lumière colorée. Chaque créature prise dans un Cône de 4,50 m émanant de vous doit réussir un jet de sauvegarde de Constitution sous peine de subir l’état Aveuglé jusqu’à la fin de votre tour suivant.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"couteau-de-glace","name":"Couteau de glace","level":1,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":false,"somatic":true,"material":true,"materialText":"une goutte d’eau ou un morceau de glace"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous créez un fragment de glace que vous lancez sur une créature à portée. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 1d10 dégâts perforants.\n\nQue l’attaque touche ou rate, le fragment explose alors. La cible et toutes les créatures situées dans un rayon de 1,50 m d’elle doivent réussir un jet de sauvegarde de Dextérité, sous peine de subir 2d6 dégâts de froid\n\nEmplacement de niveau supérieur. Les dégâts de froid augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"creation","name":"Création","level":5,"school":"illusion","castingTime":"1 minute","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un pinceau"},"duration":"spéciale","concentration":false,"ritual":false,"description":"Vous extrayez des volutes de matière ombreuse issue de Gisombre pour créer un objet à portée. L’objet est soit en matière végétale (textile, corde, bois, etc.) soit en matière minérale (pierre, cristal, métal et autres). L’objet doit rentrer dans un Cube de 1,50 m et sa forme comme sa matière doivent correspondre à quelque chose que vous avez déjà vu.\n\nLa durée du sort dépend de la matière de l’objet, comme indiqué sur la table Matières. Si l’objet est composé de plusieurs matières, c’est la durée la plus courte qui s’applique. Recourir à un objet créé par ce sort comme composante matérielle d’un autre sort fait échouer celui-ci.\n\nMatières Matière Durée Matière végétale 24 heures Pierre ou cristal 12 heures Métal précieux 1 heure Gemme 10 minutes Adamantium ou mithral 1 minute\n\nEmplacement de niveau supérieur. L’arête du Cube augmente de 1,50 m par niveau d’emplacement au-delà du 5e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"creation-de-mort-vivant","name":"Création de mort-vivant","level":6,"school":"necromancy","castingTime":"1 minute","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un onyx noir d’une valeur minimale de 150 po pour chaque cadavre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous ne pouvez lancer ce sort que de nuit. Choisissez jusqu’à trois cadavres d’Humanoïdes de taille M ou P à portée. Chaque cadavre devient une goule sous votre contrôle (profil dans « Monstres »).\n\nPar une action Bonus à chacun de vos tours, vous pouvez donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 36 m de vous. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder un lieu donné. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Une fois qu’elle a reçu un ordre, la créature s’y soumet jusqu’à ce que la tâche soit accomplie.\n\nLa créature reste sous votre contrôle pendant 24 heures, après quoi elle cesse d’obéir aux ordres que vous lui avez donnés. Pour garder le contrôle du Mortvivant pendant 24 heures de plus, vous devez relancer ce sort sur lui avant la fin des 24 heures en cours. Relancer le sort ainsi réaffirme votre emprise sur un maximum de trois créatures que vous avez animées par ce sort, au lieu d’en animer de nouvelles.\n\nEmplacement de niveau supérieur. Avec un emplacement du 7e niveau, vous prenez ou prolongez le contrôle de quatre goules. Avec un emplacement du 8e niveau, vous prenez ou prolongez le contrôle de cinq goules, ou de deux blêmes ou nécrontes. Avec un emplacement du 9e niveau, vous prenez ou prolongez le contrôle de six goules, de trois blêmes ou nécrontes, ou de deux momies. Vous trouverez ces profils à la section « Monstres ».","classes":["cleric","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"creation-de-nourriture-et-d-eau","name":"Création de nourriture et d’eau","level":3,"school":"conjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous créez 22,5 kg de nourriture et 120 litres d’eau potable qui apparaissent au sol ou dans des récipients à portée, de quoi mettre à l’abri de la faim et de la soif. La nourriture est fade, mais nourrissante, avec l’aspect des aliments de votre choix, et l’eau est propre. La nourriture se gâte si elle n’est pas consommée dans les 24 heures.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"creation-ou-destruction-d-eau","name":"Création ou destruction d’eau","level":1,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un mélange d’eau et de sable"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous accomplissez l’une des tâches suivantes :\n\nCréation d’eau. Vous créez jusqu’à 40 litres d’eau propre dans un récipient ouvert à portée. Une autre option consiste à faire pleuvoir cette eau dans un Cube de 9 m à portée, ce qui éteint les flammes nues de la zone.\n\nDestruction d’eau. Vous détruisez jusqu’à 40 litres d’eau dans un récipient ouvert à portée. Au lieu de cela, vous pouvez chasser le brouillard dans un Cube de 9 m à portée.\n\nEmplacement de niveau supérieur. Vous créez ou détruisez 40 litres supplémentaires d’eau (ou l’arête du Cube augmente de 1,50 m) par niveau d’emplacement au-delà du 1.","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"croissance-d-epines","name":"Croissance d’épines","level":2,"school":"transmutation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"sept épines"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Le sol dans une Sphère de 6 m de rayon centrée sur un point à portée laisse émerger des pointes et épines coriaces. La zone devient un Terrain difficile pour toute la durée. Lorsqu’une créature pénètre dans la zone ou s’y déplace, elle subit 2d4 dégâts perforants par tranche de 1,50 m qu’elle y parcourt.\n\nLa transformation du sol paraît naturelle. Toute créature qui ne voit pas la zone au moment de l’incantation doit entreprendre l’action Observation et réussir un test de Sagesse (Perception ou Survie) assorti de votre DD de sauvegarde des sorts pour reconnaître le danger avant de fouler ce sol.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"croissance-vegetale","name":"Croissance végétale","level":3,"school":"transmutation","castingTime":"action (Embroussaillement) ou 8 heures (Fertilisation)","range":"45 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Ce sort gorge les plantes de vitalité. La durée d’incantation employée détermine l’effet du sort : Embroussaillement ou Fertilisation, ci-après.\n\nEmbroussaillement. Choisissez un point à portée. Toutes les plantes normales dans une Sphère d’un rayon de 30 m centré sur ce point grossissent et grandissent. Une créature qui se déplace dans la zone doit dépenser le quadruple de déplacement pour toute distance parcourue. Vous pouvez désigner une ou plusieurs zones de n’importe quelle taille dans la zone d’effet du sort pour qu’elles ne soient pas affectées.\n\nFertilisation. Toutes les plantes dans un rayon de 750 m d’un point à portée gagnent en fécondité pendant 365 jours. Ces plantes produisent le double des apports alimentaires normaux lors des récoltes. Elles ne peuvent tirer profit de croissance végétale qu’une fois par an.","classes":["bard","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"danse-irresistible","name":"Danse irrésistible","level":6,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez une créature que vous voyez à portée ; elle effectue un jet de sauvegarde de Sagesse. En cas de réussite, la cible entame une danse grotesque sur place en y consacrant tout son déplacement jusqu’à la fin de son tour suivant.\n\nEn cas d’échec, la cible subit l’état Charmé pour toute la durée. Ainsi Charmée, la cible danse grotesquement en y consacrant tout son déplacement sans quitter son espace, et elle a le Désavantage aux jets de sauvegarde de Dextérité et aux jets d’attaque, tandis que les autres créatures ont l’Avantage aux jets d’attaque contre elle.\n\nÀ chacun de ses tours, la cible peut consacrer une action à tenter de retrouver ses esprits et réitérer le JS ; elle met fin au sort sur elle-même en cas de réussite.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"deblocage","name":"Déblocage","level":2,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Choisissez un objet que vous voyez à portée. Il peut s’agir d’une porte, d’une boîte, d’un coffre, de menottes, d’un cadenas ou autre objet muni d’un système de fermeture, magique ou non.\n\nUne cible verrouillée par une serrure ordinaire, barrée ou coincée est aussitôt déverrouillée, débloquée ou décoincée. Si l’objet présente plusieurs verrous, un seul d’entre eux est débloqué. Si la cible est fermée par verrou magique, ce sort est réprimé pendant 10 minutes, durant lesquelles vous pouvez ouvrir et fermer l’objet.\n\nÀ l’incantation du sort, un cognement sonore audible à 90 m émane de la cible.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"dedale","name":"Dédale","level":8,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous bannissez une créature que vous voyez à portée dans un demi-plan labyrinthique. La cible y reste pour toute la durée, à moins qu’elle n’en trouve la sortie.\n\nLa cible peut entreprendre l’action Étude pour tenter de s’évader. Ce faisant, elle effectue un test d’Intelligence (Investigation) DD 20. En cas de réussite, elle s’évade et le sort prend fin.\n\nLorsque le sort prend fin, la cible réapparaît dans l’espace qu’elle avait quitté ou, si celui-ci n’est plus libre, dans l’espace inoccupé le plus proche.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"deguisement","name":"Déguisement","level":1,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous vous donnez un aspect différent jusqu’à la fin du sort ; vous pouvez ainsi altérer l’apparence de vos vêtements, de votre armure, de vos armes et autres biens portés. Vous pouvez paraître jusqu’à 30 cm plus grand ou plus petit, sembler plus léger ou plus lourd. Vous devez adopter une forme présentant la même répartition de membres que vous. Pour le reste, les détails de l’illusion vous appartiennent.\n\nLes changements apportés par le sort ne résistent pas à un examen physique. Exemple : si le sort ajoute un chapeau à votre accoutrement, ce couvre-chef n’est pas tangible, si bien que quiconque cherche à le toucher ne sentira sous ses doigts que de l’air.\n\nPour comprendre que vous êtes déguisé, une créature doit consacrer l’action Étude à vous examiner et réussir un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"delivrance-des-maledictions","name":"Délivrance des malédictions","level":3,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"À votre contact, toutes les malédictions qui affectent une créature ou un objet prennent fin. Si la cible est un objet magique maudit, la malédiction reste en place, mais le sort rompt l’Harmonisation du propriétaire avec l’objet, si bien que celui-ci peut s’en défaire ou s’en débarrasser.","classes":["cleric","wizard","warlock","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"demi-plan","name":"Demi-plan","level":8,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":false,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous créez une porte ombreuse de taille M sur une surface solide plate que vous voyez à portée. Cette porte peut s’ouvrir et se fermer, et ouvre sur un demi-plan : une salle vide dont chaque dimension est de 9 m, faite de bois ou de pierre (à votre convenance).\n\nQuand le sort prend fin, la porte disparaît et tous les objets encore dans le demi-plan y restent. Toute les créatures qui s’y trouvent encore y restent, sauf si celles qui décident d’être renvoyées à la disparition de la porte, qui se retrouvent dans les espaces inoccupés les plus proches de l’espace de la porte, avec l’état À terre.\n\nChaque fois que vous lancez ce sort, vous pouvez créer un nouveau demi-plan ou décider que la porte ombreuse ouvre sur un demi-plan que vous aviez engendré par une précédente incantation du même sort. Par ailleurs, si vous connaissez la nature et le contenu d’un demi-plan créé par ce sort, mais lancé par une autre créature, vous pouvez décider que votre porte ombreuse donne sur ce demi-plan.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"desintegration","name":"Désintégration","level":6,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une magnétite et de la poussière"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez un rayon vert vers une cible que vous voyez à portée. La cible peut être une créature, un objet non magique ou une création de force magique, telle que la paroi formée par mur de force.\n\nUne créature ciblée par ce sort effectue un jet de sauvegarde de Dextérité. En cas d’échec, elle subit 10d6 + 40 dégâts de force. Si ces dégâts la font tomber à 0 point de vie, elle est désintégrée en poussière grise avec tout objet non magique ce qu’elle porte. La cible ne peut être ramenée à la vie que par résurrection suprême ou souhait.\n\nCe sort désintègre automatiquement un objet de taille G ou inférieure non magique, de même qu’une création de force magique dans la limite de cette taille. Dans le cas d’une taille TG ou supérieure, la désintégration ne concerne qu’une portion équivalente à un Cube de 3 m.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 3d6 par niveau d’emplacement au-delà du 6e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"detection-de-l-invisibilite","name":"Détection de l’invisibilité","level":2,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de talc"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Pour toute la durée, vous voyez les créatures et objets dotés de l’état Invisible comme s’ils étaient visibles, et vous percevez le Plan Éthéré. Les créatures et objets qui s’y trouvent ont un aspect spectral.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"detection-de-la-magie","name":"Détection de la magie","level":1,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":true,"description":"Pour toute la durée, vous percevez la présence des effets magiques dans un rayon de 9 m. Si vous percevez de tels effets, vous pouvez entreprendre l’action Magie pour voir une faible aura autour de chaque créature et objet visibles et porteurs de magie de la zone, et vous apprenez l’école de magie correspondante dans le cas d’un effet produit par un sort.\n\nLe sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).","classes":["bard","cleric","druid","sorcerer","wizard","warlock","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"detection-des-pensees","name":"Détection des pensées","level":2,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"1 pièce de cuivre"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous activez l’un des effets ci-après. À vos tours suivants jusqu’à la fin du sort, vous pouvez activer l’un des deux effets au prix de l’action Magie.\n\nPerception des pensées. Vous percevez la présence de pensées dans un rayon de 9 m, si elles émanent de créatures maîtrisant une langue ou télépathes. Vous ne lisez pas les pensées, mais savez qu’une créature pensante est présente, le cas échéant. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).\n\nLecture des pensées. Dans un rayon de 9 m, ciblez une créature que vous voyez ou une créature que vous avez détectée avec l’option Perception des pensées. Vous savez ce qui occupe son esprit à l’instant présent. Si la cible ne connaît aucune langue et n’est pas télépathe, vous n’apprenez rien.\n\nAu prix de l’action Magie à votre tour suivant, vous pouvez tenter de sonder davantage l’esprit de la cible. Dans ce cas, la cible effectue un jet de sauvegarde de Sagesse. En cas d’échec, vous saisissez comment elle raisonne, vous percevez son état émotionnel et ce qui l’anime ou la tracasse (une angoisse, une passion ou une haine, par exemple). En cas de réussite, le sort prend fin. Dans les deux cas, la cible sait que vous sondez son esprit. De plus, à moins que vous reportiez votre attention sur les pensées d’une autre créature, la cible peut consacrer l’action de son tour à effectuer un test d’Intelligence (Arcanes) contre votre DD de sauvegarde des sorts ; en cas de réussite, le sort prend fin.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"detection-des-pieges","name":"Détection des pièges","level":2,"school":"divination","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous percevez la présence de tout piège à la fois à portée et dans votre champ de vision. Un piège, dans le cadre de ce sort, correspond à tout objet ou mécanisme conçu pour infliger des dégâts ou présenter un danger.\n\nDans ces conditions, ce sort peut percevoir le sort alarme, un glyphe de garde ou une fosse qui s’ouvre mécaniquement, mais il ne révèle pas l’usure d’un plancher, l’instabilité d’un plafond ou un gouffre naturel caché par l’environnement.\n\nLe sort se contente de révéler la présence d’un piège, pas son emplacement. Vous avez une notion de la nature du danger qu’il présente.","classes":["cleric","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"detection-du-mal-et-du-bien","name":"Détection du mal et du bien","level":1,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Pour toute la durée, vous percevez la position de toutes les créatures suivantes dans un rayon de 9 m : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Vous percevez également si le sort sanctification est actif dans la zone, et où. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"detection-du-poison-et-des-maladies","name":"Détection du poison et des maladies","level":1,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une feuille d’if"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":true,"description":"Pour toute la durée, vous percevez la position de tous les poisons, créatures venimeuses et vénéneuses, et maladies magiques dans un rayon de 9 m. Vous percevez dans chaque cas de quel genre de poison, créature ou maladie il s’agit. Le sort est bloqué par 30 cm de pierre, de terre ou de bois, par 2,5 cm de métal (une simple feuille dans le cas du plomb).","classes":["cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"discours-captivant","name":"Discours captivant","level":2,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous composez une formulation verbale fascinante qui contraint les créatures de votre choix, parmi celles que vous voyez à portée, à effectuer un jet de sauvegarde de Sagesse. Toute créature que vous ou vos compagnons êtes en train d’affronter réussit automatiquement ce JS.\n\nEn cas d’échec, la cible subit un malus de –10 aux tests de Sagesse (Perception) et en Perception passive jusqu’à la fin du sort.","classes":["bard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"disque-flottant","name":"Disque flottant","level":1,"school":"conjuration","castingTime":"action ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de mercure"},"duration":"1 heure","concentration":false,"ritual":true,"description":"Ce sort crée un plan horizontal et circulaire de force, de 90 cm de diamètre pour 2,5 cm d’épaisseur, qui flotte 90 cm au-dessus du sol en un espace inoccupé que vous voyez et choisissez à portée. Le disque persiste pour toute la durée et supporte 250 kg. Si on y pose un excédent de poids, le sort prend fin et tout ce qui se trouvait sur le disque tombe au sol.\n\nLe disque est immobile tant que vous restez dans un rayon de 6 m de lui. Si vous vous en écartez de plus de 6 m, le disque vous suit pour rester dans ce rayon. Il peut traverser un Terrain difficile, monter ou descendre des marches, une pente ou équivalent, mais ne peut pas franchir une dénivellation abrupte de 3 m ou plus. Le disque ne peut ainsi pas franchir une fosse profonde de 3 m, pas plus qu’il ne pourra en sortir s’il a été créé en son fond.\n\nSi vous vous éloignez de plus de 30 m du disque (parce qu’il n’a pu contourner un obstacle pour vous suivre, notamment), le sort prend fin.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"dissimulation-supreme","name":"Dissimulation suprême","level":7,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de gemme d’une valeur minimale de 5 000 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"D’un contact, vous isolez magiquement un objet ou une créature consentante. Pour toute la durée, la cible a l’état Invisible et les sorts de Divination ne peuvent pas la cibler, aucune magie ne peut la détecter ni l’observer à distance.\n\nSi la cible est une créature, elle sombre dans un état d’animation suspendue ; elle subit l’état Inconscient, ne vieillit pas et se passe de nourriture, d’eau et d’air.\n\nVous pouvez fixer une condition qui mettra un terme prématuré au sort. Vous êtes libre de choisir n’importe quelle condition, mais elle doit intervenir ou être visible dans un rayon de 1,5 km de la cible. Ce peut être « au bout de 1 000 ans » ou « lorsque la tarasque s’éveillera », par exemple.\n\nLe sort prend également fin si la cible subit des dégâts.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"dissipation-de-la-magie","name":"Dissipation de la magie","level":3,"school":"abjuration","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Choisissez une créature, un objet ou un effet magique à portée. Tout sort du 3e niveau ou inférieur affectant la cible prend fin. Pour chaque sort du 4e niveau ou supérieur affectant la cible, effectuez un test de caractéristique d’incantation (DD 10 plus le niveau du sort concerné). En cas de réussite, le sort prend fin.\n\nEmplacement de niveau supérieur. Vous mettez automatiquement un terme aux sorts qui affectent la cible et sont d’un niveau qui ne dépasse pas celui de votre emplacement de sort.","classes":["bard","cleric","druid","sorcerer","wizard","warlock","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"dissipation-du-mal-et-du-bien","name":"Dissipation du mal et du bien","level":5,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre d’argent et de fer"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Pour toute la durée, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants ont le Désavantage aux jets d’attaque contre vous.\n\nVous pouvez mettre un terme prématuré au sort en recourant à l’une des fonctions spéciales suivantes.\n\nAnnulation d’enchantement. Au prix de l’action Magie, vous touchez une créature possédée ou subissant l’état Charmé ou Effrayé par au moins une créature d’un type précité. La cible n’est plus possédée, Charmée ou Effrayée par cette autre créature.\n\nRenvoi. Au prix de l’action Magie, vous ciblez une créature que vous voyez dans un rayon de 1,50 m, d’un type précité. La cible doit réussir un jet de sauvegarde de Charisme sous peine d’être renvoyée dans son plan d’origine (si elle ne s’y trouve pas déjà). S’ils ne sont pas sur leur plan d’origine, les Morts-vivants sont envoyés en Gisombre et les Fées en Féerie.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"divination","name":"Divination","level":4,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"encens d’une valeur minimale de 25 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous recevez un présage d’une entité surnaturelle vous renseignant sur l’issue d’une opération que vous comptez mener dans les 7 jours. (Réponse courte ou signe).","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"domination-de-monstre","name":"Domination de monstre","level":8,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée. La cible a l’Avantage au JS si vous ou vos alliés êtes en train de l’affronter. Chaque fois que la cible subit des dégâts, elle réitère le JS et met un terme au sort sur elle-même en cas de réussite.\n\nUn lien télépathique persiste entre vous et la cible Charmée tant que vous êtes tous deux sur un même plan d’existence. À votre tour, vous pouvez profiter de ce lien pour donner des ordres à la cible (pas d’action requise), tels que « Attaque cette créature », « File là-bas » ou « Attrape cet objet ». La cible fait de son mieux pour vous obéir à son tour. Si la créature accomplit sa tâche et ne reçoit pas d’autre instruction de votre part, elle agit et se déplace à sa guise, en cherchant avant tout à se protéger. Vous pouvez aussi lui faire jouer une Réaction, au prix toutefois de votre propre Réaction.\n\nEmplacement de niveau supérieur. Votre Concentration peut durer jusqu’à 8 heures (9e niveau).","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"domination-de-personne","name":"Domination de personne","level":5,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un Humanoïde que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée. La cible a l’Avantage au JS si vous ou vos alliés êtes en train de l’affronter. Chaque fois que la cible subit des dégâts, elle réitère le JS et met un terme au sort sur elle-même en cas de réussite.\n\nUn lien télépathique persiste entre vous et la cible Charmée tant que vous êtes tous deux sur un même plan d’existence. À votre tour, vous pouvez profiter de ce lien pour donner des ordres à la cible (pas d’action requise), tels que « Attaque cette créature », « File là-bas » ou « Attrape cet objet ». La cible fait de son mieux pour vous obéir à son tour. Si la créature accomplit sa tâche et ne reçoit pas d’autre instruction de votre part, elle agit et se déplace à sa guise, en cherchant avant tout à se protéger. Vous pouvez aussi lui faire jouer une Réaction, au prix toutefois de votre propre Réaction.\n\nEmplacement de niveau supérieur. Votre Concentration peut durer jusqu’à 10 minutes (6e niveau), 1 heure (7e niveau) ou 8 heures (8e niveau).","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"doigt-de-mort","name":"Doigt de mort","level":7,"school":"necromancy","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous libérez des énergies négatives vers une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution et subit 7d8 + 30 dégâts nécrotiques en cas d’échec, la moitié en cas de réussite. Un Humanoïde tué par ce sort se relève au début de votre tour suivant comme zombi (cf. « Monstres ») obéissant à vos instructions verbales.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"domination-de-bete","name":"Domination de bête","level":4,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une Bête que vous voyez à portée doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée. La cible a l’Avantage au JS si vous ou vos alliés êtes en train de l’affronter. Chaque fois que la cible subit des dégâts, elle réitère le JS et met un terme au sort sur elle-même en cas de réussite.\n\nUn lien télépathique persiste entre vous et la cible Charmée tant que vous êtes tous deux sur un même plan d’existence. À votre tour, vous pouvez profiter de ce lien pour donner des ordres à la cible (pas d’action requise), tels que « Attaque cette créature », « File là-bas » ou « Attrape cet objet ». La cible fait de son mieux pour vous obéir à son tour. Si la créature accomplit sa tâche et ne reçoit pas d’autre instruction de votre part, elle agit et se déplace à sa guise, en cherchant avant tout à se protéger. Vous pouvez aussi lui faire jouer une Réaction, au prix toutefois de votre propre Réaction.\n\nEmplacement de niveau supérieur. Votre Concentration peut durer jusqu’à 10 minutes (5e niveau), 1 heure (6e niveau) ou 8 heures (7e niveau).","classes":["druid","sorcerer","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"don-des-langues","name":"Don des langues","level":3,"school":"divination","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une ziggourat miniature"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Ce sort octroie à la créature que vous touchez la faculté de comprendre toute langue parlée qu’elle entend et tout langage des signes qu’elle voit. De plus, lorsque la cible communique par signes ou par la voix, toute créature qui connaît au moins une langue comprend ce que la cible exprime à condition d’entendre ce qu’elle dit ou de voir sa gestuelle.","classes":["bard","cleric","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"double-illusoire","name":"Double illusoire","level":5,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":false,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous recevez l’état Invisible et, dans le même temps, votre double illusoire se présente à l’endroit où vous vous tenez. Ce double persiste pour toute la durée, mais l’invisibilité prend fin si vous effectuez un jet d’attaque, infligez des dégâts ou lancez un sort.\n\nAu prix de l’action Magie, vous pouvez déplacer votre double à concurrence du double de votre Vitesse et le faire bouger, parler et se comporter à votre guise. Il est intangible et invulnérable. Vous voyez et entendez comme si vous vous trouviez au même endroit que lui.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"doux-repos","name":"Doux repos","level":2,"school":"necromancy","castingTime":"action ou rituel","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"2 pièces de cuivre, que le sort détruit"},"duration":"10 jours","concentration":false,"ritual":true,"description":"Vous touchez physiquement un cadavre ou autre dépouille. Pour toute la durée, la cible est protégée contre la putréfaction et rien ne peut en faire un Mort-vivant. Ce sort prolonge également le délai au-delà duquel la cible ne pourra plus être ramenée d’entre les morts, les jours passés sous l’influence de ce sort n’étant pas décomptés dans le cadre de sorts tels que rappel à la vie.","classes":["cleric","wizard","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"eclair","name":"Éclair","level":3,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une touffe de fourrure et une tige de cristal"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un éclair foudroyant jaillit de vous sous la forme d’une Ligne de 30 m de long et 1,50 m de large, dans la direction de votre choix. Chaque créature prise dans la Ligne effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de foudre en cas d’échec, la moitié en cas de réussite. Emplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 3e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"eclat-du-soleil","name":"Éclat du soleil","level":8,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un morceau d’héliolite"},"duration":"instantanée","concentration":false,"ritual":false,"description":"La lumière du soleil brille soudain dans une Sphère de 18 m de rayon, centrée sur un point que vous choisissez à portée. Chaque créature prise dans la Sphère effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit 12d6 dégâts radiants, ainsi que l’état Aveuglé pendant 1 minute. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nUne créature Aveuglée par ce sort réitère le jet de sauvegarde de Constitution à la fin de chacun de ses tours et met un terme à l’effet sur elle-même en cas de réussite. Le sort dissipe dans la zone toutes les Ténèbres qui résultent d’un sort.","classes":["cleric","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"embruns-prismatiques","name":"Embruns prismatiques","level":7,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Huit rayons de lumière jaillissent de vous dans un Cône de 18 m. Chaque créature prise dans le Cône effectue un jet de sauvegarde de Dextérité. Pour chaque cible, lancez 1d8 pour déterminer le rayon de couleur qui l’affecte selon la table Rayons prismatiques.\n\n**Rayons prismatiques**\n\n**1 — Rouge.** Échec au JS : 12d6 dégâts de feu. JS réussi : 1/2 dégâts.\n\n**2 — Orange.** Échec au JS : 12d6 dégâts d’acide. JS réussi : 1/2 dégâts.\n\n**3 — Jaune.** Échec au JS : 12d6 dégâts de foudre. JS réussi : 1/2 dégâts.\n\n**4 — Vert.** Échec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts.\n\n**5 — Bleu.** Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts.\n\n**6 — Indigo.** Échec au JS : La cible subit l’état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l’état prend fin. Si elle rate trois fois le JS, elle subit l’état Pétrifié jusqu’à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n’ont pas besoin d’être consécutifs ; notez-les quelque part, jusqu’à ce que la cible atteigne un total de trois pour l’un ou l’autre.\n\n**7 — Violet.** Échec au JS : La cible subit l’état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d’échec, l’état prend fin, et la créature est téléportée dans un autre plan d’existence (choisi par le MJ).\n\n**8 — Spécial.** La cible est frappée par deux rayons. Lancez deux fois le dé, en rejouant tout 8.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"emprisonnement","name":"Emprisonnement","level":9,"school":"abjuration","castingTime":"1 minute","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une statuette à l’effigie de la cible d’une valeur minimale de 5 000 po"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous créez des entraves magiques pour retenir une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la cible n’est pas affectée et elle est immunisée contre ce sort pendant 24 heures. En cas d’échec, la cible est emprisonnée.\n\nTant qu’elle est emprisonnée, la cible se passe de respirer, de s’alimenter et de s’hydrater, et ne vieillit pas. Les sorts de Divination ne permettent pas de localiser ni de percevoir la cible emprisonnée, qui ne peut en outre pas user de téléportation.\n\nJusqu’à la fin du sort, la cible est aussi affectée par l’un des effets suivants (choisissez) :\n\nChaînes. Des chaînes fermement ancrées au sol retiennent la cible. La cible subit l’état Entravé et rien ne peut la déplacer.\n\nDétention miniature. La cible est réduite à une taille de 2,5 cm pour se retrouver bloquée dans une gemme indestructible ou un objet équivalent. La lumière traverse cette pierre (ce qui permet à la cible de voir à l’extérieur et aux autres créatures de voir à l’intérieur), mais rien d’autre ne peut y pénétrer.\n\nEnterrement. La cible est inhumée dans les entrailles de la terre, à l’intérieur d’un globe creux de force magique juste assez grand pour la contenir. Rien ne peut entrer dans le globe ni en sortir.\n\nLéthargie. La cible subit l’état Inconscient, et rien ne peut la réveiller.\n\nPrison isolée. La cible est bloquée dans un demi-plan protégé contre la téléportation et le voyage planaire. Vous choisissez si ce demi-plan est un labyrinthe, une cage, une tour ou autre structure confinée.\n\nMettre fin au sort. À l’incantation du sort, spécifiez un déclencheur qui y mettra un terme. Le déclencheur peut être aussi spécifique et sophistiqué que vous le souhaitez, mais le MJ doit convenir qu’il a une grande chance de se présenter dans la décennie à venir. Il peut aussi se traduire par une action perceptible, comme une offrande spécifique au temple de votre divinité, le sauvetage de votre grand amour ou l’élimination d’une menace donnée. Le sort dissipation de la magie ne peut mettre un terme au sort que s’il est lancé au 9e niveau et s’il cible soit la prison, soit la composante utilisée pour créer celle-ci.","classes":["wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"enchevetrement","name":"Enchevêtrement","level":1,"school":"conjuration","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Des plantes grimpantes émergent du sol dans un carré de 6 m de côté à portée. Pour toute la durée, cette végétation transforme le sol de la zone en Terrain difficile. Elle disparaît quand le sort prend fin.\n\nChaque créature autre que vous prise dans la zone à l’incantation du sort doit réussir un jet de sauvegarde de Force pour ne pas subir l’état Entravé jusqu’à la fin du sort.\n\nUne créature Entravée peut entreprendre une action pour effectuer un test de Force (Athlétisme) assorti de votre DD de sauvegarde des sorts. En cas de réussite, elle se libère des plantes grimpantes et n’est plus Entravée par cette végétation.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"ennemi-subconscient","name":"Ennemi subconscient","level":9,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous tentez de produire une terreur illusoire dans l’esprit d’autrui. Chaque créature que vous choisissez dans une Sphère de 9 m de rayon centrée sur un point à portée effectue un jet de sauvegarde de Sagesse. En cas d’échec, elle subit 10d10 dégâts psychiques, ainsi que l’état Effrayé pour toute la durée. En cas de réussite, elle subit uniquement la moitié de ces dégâts.\n\nUne cible Effrayée effectue un JS Sagesse à la fin de chacun de ses tours. En cas d’échec, elle subit 5d10 dégâts psychiques. En cas de réussite, le sort prend fin pour elle.","classes":["wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"entrave-planaire","name":"Entrave planaire","level":5,"school":"abjuration","castingTime":"1 heure","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un joyau d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Vous tentez de soumettre un Céleste, un Élémentaire, une Fée ou un Fiélon à votre service. La créature doit être à portée pendant toute l’incantation. (Le plus souvent, on commence par convoquer la créature au centre d’un cercle magique inversé pour l’y séquestrer pendant l’incantation du présent sort.) À la fin de l’incantation, la cible doit réussir un jet de sauvegarde de Charisme sous peine d’être liée à votre service pour toute la durée. Si la créature a été convoquée ou créée par un autre sort, la durée de celui-ci augmente pour correspondre à la durée de cette entrave planaire.\n\nUne créature ainsi liée à votre service obéit à vos instructions de son mieux. Vous pouvez lui ordonner de vous accompagner à l’aventure, de garder un site ou de livrer un messa
