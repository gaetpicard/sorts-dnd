ge. Si la créature est Hostile, elle cherche à détourner vos ordres à ses propres fins.\n\nSi la créature mène à bien toutes vos instructions avant la fin du sort, elle se transporte auprès de vous pour faire son rapport si vous êtes sur le même plan d’existence. Si vous vous trouvez sur un plan différent, elle repart vers le lieu où vous l’avez assujettie et y reste jusqu’à la fin du sort.","classes":["bard","cleric","druid","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"epee-arcanique","name":"Épée arcanique","level":7,"school":"evocation","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une épée miniature d’une valeur minimale de 250 po"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez une épée spectrale qui flotte dans les airs à portée. Elle persiste pour toute la durée.\n\nÀ l’apparition de l’épée, vous effectuez une attaque de sort au corps à corps contre une cible dans un rayon de 1,50 m de l’épée. Si l’attaque touche, la cible subit des dégâts de force égaux à 4d12 + votre modificateur de caractéristique d’incantation.\n\nÀ chacun de vos tours suivants, vous pouvez par une action Bonus déplacer l’épée d’un maximum de 9 m vers un point que vous voyez et réitérer l’attaque, contre la même cible ou une autre.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"epine-mentale","name":"Épine mentale","level":2,"school":"divination","castingTime":"action","range":"36 m","components":{"verbal":false,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous enfoncez une pointe d’énergie psionique dans l’esprit d’une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Sagesse et subit 3d8 dégâts psychiques en cas d’échec, la moitié en cas de réussite.\n\nEn cas d’échec, vous connaissez également la position de la cible tant que le sort persiste et que vous demeurez tous deux sur le même plan d’existence. Tant que vous savez par ce biais où se trouve la cible, elle ne peut être cachée vis-à-vis de vous et ne tire aucun bénéfice de l’état Invisible vis-àvis de vous.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 2e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"esprit-impenetrable","name":"Esprit impénétrable","level":8,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"24 heures","concentration":false,"ritual":false,"description":"Jusqu’à la fin du sort, une créature consentante que vous touchez physiquement bénéficie de l’Immunité contre les dégâts psychiques et l’état Charmé.\n\nLa cible n’est pas davantage affectée par tout ce qui permet de percevoir les émotions ou l’alignement, de lire les pensées ou de détecter magiquement sa position, et aucun sort (pas même souhait) ne peut affecter l’esprit de la cible, l’observer à distance ou se renseigner sur son compte.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"esprits-gardiens","name":"Esprits gardiens","level":3,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un parchemin de prière"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Des esprits protecteurs volètent autour de vous pour toute la durée, sous forme d’une Émanation de 4,50 m. Si vous êtes bon ou neutre, ces formes spectrales paraissent angéliques ou féeriques (à votre convenance). Si vous êtes mauvais, elles paraissent fiélonnes.\n\nÀ l’incantation du sort, vous pouvez désigner des créatures qui ne seront pas affectées par ces esprits. Toutes les autres créatures voient leur Vitesse réduite de moitié dans la zone ; de plus, lorsque l’Émanation pénètre dans l’espace d’une telle créature ou que celle-ci entre dans l’Émanation pour la première fois d’un tour ou y termine son propre tour, elle effectue un jet de sauvegarde de Sagesse. En cas d’échec, elle subit 3d8 dégâts radiants (si vous êtes bon ou neutre) ou 3d8 dégâts nécrotiques (si vous êtes mauvais). En cas de réussite, la créature subit la moitié de ces dégâts. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 3e.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"eveil","name":"Éveil","level":5,"school":"transmutation","castingTime":"8 heures","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une agate d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous consacrez le temps d’incantation à tracer des voies magiques à l’intérieur d’une gemme, puis touchez la cible. Celle-ci doit être une créature de type Bête ou Plante dotée d’une Intelligence inférieure à 4, ou une plante naturelle qui n’est pas une créature.\n\nLa cible reçoit une Intelligence de 10 et la faculté de parler une langue que vous connaissez. Si la cible est une plante naturelle, elle devient une créature de type Plante et reçoit la capacité de se déplacer sur ses racines, pédoncules, lianes ou autres appendices, et bénéficie de sens comparables à ceux d’un humain. Votre MJ choisit un profil adapté à la Plante éveillée, comme le profil de l’arbuste éveillé ou de l’arbre éveillé (cf. « Monstres »).\n\nLa cible éveillée subit l’état Charmé pendant 30 jours, sauf si vous-même ou l’un de vos compagnons lui infligez des dégâts. Quand cet état prend fin, la créature éveillée choisit l’attitude qu’elle adopte à votre égard.","classes":["bard","druid"],"source":"SRD 5.2.1"},{"canonicalId":"fabrication","name":"Fabrication","level":4,"school":"transmutation","castingTime":"10 minutes","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous convertissez des matières premières en produits finis. Vous pouvez ainsi fabriquer un pont de bois à partir d’un massif d’arbres, une corde à partir d’un tas de chanvre et des vêtements avec de la laine ou du lin en vrac.\n\nChoisissez des matières premières que vous voyez à portée. Vous pouvez fabriquer un objet de taille G ou inférieure (qui loge dans un Cube de 3 m ou huit Cubes contigus de 1,50 m), à condition de disposer de suffisamment de matières premières. Si vous optez pour du métal, de la pierre ou toute autre substance minérale, l’objet fabriqué ne peut toutefois pas dépasser une taille M (qui loge dans un Cube de 1,50 m). La facture des objets ainsi confectionnés est à la mesure de la qualité des matières premières.\n\nVous ne pouvez pas créer d’objet magique ni de créature avec ce sort. De même, vous ne pouvez pas créer d’objets dont la confection demande un savoir-faire exceptionnel, comme des armes ou des armures, sauf si vous disposez de la maîtrise des outils d’artisan correspondants.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"faconnage-de-la-pierre","name":"Façonnage de la pierre","level":4,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de la terre glaise"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous touchez physiquement un objet de pierre de taille M ou inférieure ou une section de pierre dont aucune dimension n’excède 1,50 m, pour les modeler à votre guise.\n\nVous pouvez ainsi façonner un gros rocher en arme, en statue ou en caisson, ou pratiquer un passage dans une paroi dont l’épaisseur ne dépasse pas 1,50 m. Vous pourriez aussi modeler une porte de pierre ou en refaçonner l’encadrement pour la condamner.\n\nL’objet confectionné peut être doté d’un maximum de deux charnières et d’un loquet, mais les éléments mécaniques plus sophistiqués sont proscrits.","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"faveur-divine","name":"Faveur divine","level":1,"school":"transmutation","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Jusqu’à la fin du sort, vos attaques avec une arme infligent 1d4 dégâts radiants supplémentaires quand elles touchent.","classes":["paladin"],"source":"SRD 5.2.1"},{"canonicalId":"festin-des-heros","name":"Festin des héros","level":6,"school":"conjuration","castingTime":"10 minutes","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un vase incrusté de gemmes d’une valeur minimale de 1 000 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous invoquez un festin qui se présente sur une surface dans un Cube inoccupé de 3 m, à côté de vous. Il faut 1 heure pour ingérer ce festin, tous les plats disparaissant à l’issue de cet intervalle. Les bénéfices ne se font pas sentir avant la fin de l’heure. Un maximum de douze créatures peuvent participer au banquet.\n\nUne créature qui a figuré parmi les convives reçoit plusieurs bénéfices, qui persistent pendant 24 heures. Elle bénéficie de la Résistance aux dégâts de poison et de l’Immunité contre les états Effrayé et Empoisonné. Son maximum de points de vie augmente en outre de 2d10 et elle reçoit ce même nombre de points de vie.","classes":["bard","cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"feuille-morte","name":"Feuille morte","level":1,"school":"transmutation","castingTime":"Réaction, que vous jouez quand vous ou une créature dans un rayon de 18 m chutez","range":"18 m","components":{"verbal":true,"somatic":false,"material":true,"materialText":"une petite plume ou un peu de duvet"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Choisissez jusqu’à cinq créatures qui chutent à portée. La vitesse de chute de chacune passe à 18 m par round jusqu’à la fin du sort. Si la créature atterrit avant la fin du sort, elle ne subit aucun dégât de chute et le sort prend fin en ce qui la concerne.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"flamme-eternelle","name":"Flamme éternelle","level":2,"school":"evocation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de rubis d’une valeur minimale de 50 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Une flamme jaillit d’un objet que vous touchez physiquement. L’effet produit une Lumière vive sur un rayon de 6 m et une Lumière faible sur 6 m de plus. La flamme paraît ordinaire, mais elle ne produit aucune chaleur et s’alimente d’elle-même. On peut recouvrir ou cacher la flamme, mais ni l’étouffer ni l’éteindre.","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"fleau-d-insectes","name":"Fléau d’insectes","level":5,"school":"conjuration","castingTime":"action","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un criquet"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Des nuées grouillantes de criquets emplissent une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée. La Sphère persiste pour toute la durée, et sa zone est à Visibilité réduite et constitue un Terrain difficile.\n\nChaque créature prise dans la nuée à son apparition effectue un jet de sauvegarde de Constitution, et subit 4d10 dégâts perforants en cas d’échec, la moitié en cas de réussite. Une créature effectue aussi ce JS lorsqu’elle pénètre dans la zone du sort pour la première fois d’un tour ou qu’elle y termine son tour. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 5e.","classes":["cleric","druid","sorcerer"],"source":"SRD 5.2.1"},{"canonicalId":"fleche-acide","name":"Flèche acide","level":2,"school":"evocation","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une feuille de rhubarbe en poudre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une flèche d’un vert chatoyant fuse vers une cible à portée avant de produire une gerbe d’acide. Effectuez une attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit aussitôt 4d4 dégâts d’acide, puis 2d4 dégâts d’acide à la fin de son tour suivant. Si l’attaque rate, la flèche asperge la cible d’acide en lui infligeant uniquement la moitié des dégâts initiaux.\n\nEmplacement de niveau supérieur. Les dégâts (initiaux et consécutifs) augmentent de 1d4 par niveau d’emplacement au-delà du 2e.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"fletrissement","name":"Flétrissement","level":4,"school":"necromancy","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une créature que vous voyez à portée effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d’échec, la moitié en cas de réussite. Une Plante rate automatiquement ce JS.\n\nAu lieu de cela, vous pouvez cibler une plante non magique qui n’est pas une créature, comme un arbre ou un arbuste. Elle n’effectue pas de JS, mais se flétrit et meurt.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 4e.","classes":["druid","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"flou","name":"Flou","level":2,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Votre corps devient flou. Pour toute la durée, les créatures ont le Désavantage aux jets d’attaque contre vous. Un assaillant qui vous perçoit par la Vision aveugle ou la Vision lucide est immunisé contre cet effet.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"force-fantasmagorique","name":"Force fantasmagorique","level":2,"school":"illusion","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de laine brute"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous tentez de concevoir une illusion dans l’esprit d’une créature que vous voyez à portée. La cible effectue un jet de sauvegarde d’Intelligence. Si elle le rate, vous créez un objet, une créature ou autre forme fantasmatique dont le volume n’excède pas un Cube de 3 m. Seule la cible le perçoit pour toute la durée. L’illusion fait intervenir l’ouïe, la perception de la température et d’autres sens de la créature.\n\nAu prix de l’action Étude, la cible peut examiner la manifestation en effectuant un test d’Intelligence (Investigation) contre le DD de sauvegarde du sort. En cas de réussite, elle perce l’illusion et le sort prend fin. Tant qu’elle est affectée par le sort, la cible considère ce qu’elle perçoit comme réel et tout ce qui est incohérent dans ses interactions avec l’illusion se justifie à son sens. Exemple : si une cible foule un pont fantasmatique enjambant un gouffre et survit à la chute, elle reste convaincue de l’existence du pont et attribue sa chute à autre chose.\n\nUne cible affectée peut même subir des dégâts de l’illusion si celle-ci représente une créature redoutable ou un danger autre. À chacun de vos tours, si la cible se trouve dans un rayon de 1,50 m de l’illusion ou dans sa zone, une telle force fantasmatique peut lui infliger 2d8 dégâts psychiques. Dans son esprit, les dégâts sont du type adapté à l’illusion.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"forme-etheree","name":"Forme éthérée","level":7,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"jusqu’à 8 heures","concentration":false,"ritual":false,"description":"Vous pénétrez dans les régions frontalières du Plan Éthéré, bordure où il chevauche votre plan actuel. Vous demeurez dans la Frontière éthérée pour toute la durée. Durant cet intervalle, vous pouvez vous déplacer dans n’importe quelle direction. Si vous vous déplacez vers le haut ou le bas, toute distance parcourue vous coûte le double. Vous percevez ce qui se passe sur le plan d’où vous venez, mais tout est nuances de gris et votre vision ne porte que sur 18 m.\n\nTant que vous êtes sur le Plan Éthéré, seuls les créatures, objets et effets de ce plan peuvent vous affecter, et réciproquement. Les créatures qui ne s’y trouvent pas ne vous perçoivent pas et ne peuvent interagir avec vous, à moins de disposer d’une aptitude qui leur en donne la possibilité.\n\nQuand le sort prend fin, vous retournez aussitôt sur votre plan de départ, à l’endroit équivalent à l’espace que vous occupez actuellement dans la Frontière éthérée. Si vous apparaissez dans un espace occupé, vous subissez un transfert dans l’espace inoccupé le plus proche, chaque tranche de 30 cm de ce transfert forcé vous infligeant 2 dégâts de force.\n\nCe sort prend fin sur-le-champ si vous le lancez tandis que vous êtes sur le Plan Éthéré ou un plan avec lequel il n’a pas de frontière, comme les Plans Extérieurs.\n\nEmplacement de niveau supérieur. Vous pouvez cibler un maximum de trois créatures consentantes (y compris vous) par niveau d’emplacement au-delà du 7e. Ces créatures doivent se trouver dans un rayon de 3 m de vous à l’incantation du sort.","classes":["bard","cleric","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"forme-gazeuse","name":"Forme gazeuse","level":3,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de gaze"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Pour toute la durée, une créature consentante que vous touchez se métamorphose, ainsi que tout ce qu’elle porte, en nuage de brume. Le sort prend fin si la cible tombe à 0 point de vie ou si elle entreprend l’action Magie pour y mettre fin sur elle-même.\n\nSous cette forme, la cible n’a qu’un seul mode de déplacement : une Vitesse de vol de 3 m, avec le vol stationnaire. Elle peut pénétrer dans l’espace d’une autre créature et l’occuper. La cible bénéficie de la Résistance aux dégâts contondants, perforants et tranchants, et de l’Immunité contre l’état À terre ; elle a aussi l’Avantage aux jets de sauvegarde de Force, Dextérité et Constitution. Elle peut se glisser dans les ouvertures les plus étroites, mais les liquides sont traités dans son cas comme des surfaces solides.\n\nLa cible ne peut ni parler ni manipuler d’objets, et il lui reste impossible de lâcher ou d’utiliser ce qu’elle portait, ou d’interagir avec cet équipement. La cible ne peut ni attaquer ni lancer de sorts.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 3e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"fou-rire","name":"Fou rire","level":1,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une tartelette et une plume"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une créature de votre choix parmi celles que vous voyez à portée effectue un jet de sauvegarde de Sagesse. En cas d’échec, elle subit les états À terre et Neutralisé pour toute la durée. Tout ce temps, elle est prise d’un fou rire si elle a la faculté de rire et ne peut se relever d’elle-même.\n\nÀ la fin de chacun de ses tours et chaque fois qu’elle subit des dégâts, la cible réitère le JS Sagesse. Elle a l’Avantage à ce JS s’il est déclenché par des dégâts. En cas de réussite, le sort prend fin.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"foulee-brumeuse","name":"Foulée brumeuse","level":2,"school":"conjuration","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une brume argentée vous enveloppe brièvement et vous vous téléportez d’un maximum de 9 m vers un espace inoccupé que vous voyez.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"fracassement","name":"Fracassement","level":2,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un fragment de mica"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un vacarme éclate en un point que vous choisissez à portée. Chaque créature prise dans une Sphère de 3 m de rayon centrée sur ce point effectue un jet de sauvegarde de Constitution et subit 3d8 dégâts de tonnerre en cas d’échec, la moitié en cas de réussite. Un Artificiel a le Désavantage à ce JS.\n\nUn objet non magique qui n’est porté par personne subit lui aussi les dégâts s’il est dans la zone d’effet du sort.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 2e.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"frappe-piegeuse","name":"Frappe piégeuse","level":1,"school":"conjuration","castingTime":"action Bonus, que vous entreprenez aussitôt après avoir touché une créature avec une arme","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Alors que vous touchez la cible, des plantes grimpantes se matérialisent sur elle et elle effectue un jet de sauvegarde de Force. Si la créature est de taille G ou supérieure, elle a l’Avantage au jet. En cas d’échec, elle subit l’état Entravé jusqu’à la fin du sort. En cas de réussite, les plantes disparaissent en se flétrissant et le sort prend fin.\n\nTant qu’elle est Entravée, la cible subit 1d6 dégâts perforants au début de chacun de ses tours. La cible ou une créature à portée d’allonge de celle-ci peut entreprendre une action pour effectuer un test de Force (Athlétisme) contre votre DD de sauvegarde des sorts. En cas de réussite, le sort prend fin.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["ranger"],"source":"SRD 5.2.1"},{"canonicalId":"fusion-dans-la-pierre","name":"Fusion dans la pierre","level":3,"school":"transmutation","castingTime":"action ou rituel","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"8 heures","concentration":false,"ritual":true,"description":"Vous pénétrez d’un pas dans un objet ou une surface de pierre suffisants pour accueillir l’intégralité de votre corps et fusionnez avec tout votre équipement dans cette masse minérale pour toute la durée. Pour ce faire, vous devez toucher physiquement la pierre. Votre présence n’est aucunement visible ni détectable par des moyens non magiques.\n\nTant que vous fusionnez avec la pierre, vous ne voyez pas ce qui se passe à l’extérieur et tous vos tests de Sagesse (Perception) visant à entendre les bruits extérieurs ont le Désavantage. Vous gardez la notion du temps et pouvez lancer des sorts sur vous-même tant que vous ne faites qu’un avec la pierre. Vous pouvez consacrer 1,50 m de votre déplacement à émerger de la pierre à l’endroit par lequel vous l’avez intégrée, ce qui met fin au sort. Pour le reste, vous ne pouvez pas vous déplacer.\n\nLes dommages physiques superficiels subis par la pierre ne vous font aucun mal, mais sa destruction partielle et toute altération de sa forme, si elles sont telles que vous n’y logez plus entièrement, vous éjectent de la pierre en vous infligeant 6d6 dégâts de force. La destruction totale de la pierre (ou sa transmutation dans une autre matière) vous éjecte aussi, en vous infligeant 50 dégâts de force. Lors de toute éjection, vous vous retrouvez avec l’état À terre dans l’espace inoccupé le plus proche de l’endroit par lequel vous aviez intégré la pierre.","classes":["cleric","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"gardien-de-la-foi","name":"Gardien de la foi","level":4,"school":"conjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"8 heures","concentration":false,"ritual":false,"description":"Un gardien spectral de taille G apparaît pour toute la durée et flotte en un espace inoccupé que vous voyez à portée. Le gardien, invulnérable, occupe cet espace et se présente sous une forme adaptée à votre divinité ou panthéon.\n\nTout ennemi qui se déplace dans un espace à 3 m ou moins du gardien pour la première fois d’un tour ou qui y commence son tour effectue un jet de sauvegarde de Dextérité et subit 20 dégâts radiants en cas d’échec, la moitié en cas de réussite.\n\nLe gardien disparaît après avoir infligé un total de 60 dégâts.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"glissement-de-terrain","name":"Glissement de terrain","level":6,"school":"transmutation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pelle miniature"},"duration":"Concentration, jusqu’à 2 heures","concentration":true,"ritual":false,"description":"Choisissez à portée une zone de terrain dont la longueur ne dépasse pas 12 m. Vous pouvez remodeler la terre, le sable ou l’argile de la zone à votre guise pour toute la durée. Vous pouvez accroître ou diminuer la hauteur de la zone, créer une tranchée ou en combler une, ériger un mur ou l’aplanir, ou former une colonne. Aucune de ces altérations ne peut excéder en taille la moitié de la dimension la plus grande de la zone. Exemple : si vous affectez une zone carrée de 12 m de côté, vous pouvez créer une colonne de 6 m, augmenter ou réduire la hauteur du carré de 6 m, creuser une tranchée profonde de 6 m, etc.\n\nCes modifications s’accomplissent en 10 minutes. Ces transformations ne s’opérant que lentement, les créatures situées dans la zone ne se font généralement pas piéger ni blesser par les mouvements de terrain. À la fin de chaque tranche de 10 minutes passées à vous concentrer sur le sort, vous pouvez choisir une nouvelle zone de terrain à portée pour l’affecter.\n\nCe sort ne peut pas manipuler la pierre naturelle ni les bâtiments en pierre. La roche et les édifices se contentent de s’adapter au terrain modifié. Si l’altération du terrain menace de rendre un édifice instable, il peut effectivement s’effondrer. De même, ce sort n’affecte pas directement le développement de la flore. La terre déplacée emporte avec elle les plantes qui l’occupent.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"globe-d-invulnerabilite","name":"Globe d’invulnérabilité","level":6,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une perle en verre"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une barrière immobile qui chatoie se matérialise sous forme d’une Émanation de 3 m qui persiste pour toute la durée. Tout sort du 5e niveau ou inférieur lancé depuis l’extérieur de la barrière ne peut affecter ce qui se trouve à l’intérieur.\n\nUn tel sort peut cibler les créatures et objets situés dans le globe, mais il reste sur eux sans effet. De même, la zone comprise dans la barrière est exclue des zones d’effet créées par de tels sorts.\n\nEmplacement de niveau supérieur. La barrière bloque les sorts d’un niveau de plus par niveau d’emplacement au-delà du 6e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"glyphe-de-garde","name":"Glyphe de garde","level":3,"school":"abjuration","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de diamant d’une valeur minimale de 200 po, que le sort détruit"},"duration":"jusqu’à dissipation ou activation","concentration":false,"ritual":false,"description":"Vous inscrivez un glyphe qui produira ultérieurement des effets magiques. Vous le tracez soit sur une surface (comme une table ou une section de sol), soit à l’intérieur d’un objet que l’on peut fermer (comme un livre ou un coffre) de manière à dissimuler le symbole. Le glyphe peut recouvrir une zone dont le diamètre ne dépasse pas 3 m. Si vous optez pour un objet, celui-ci doit rester à sa place ; si on le déplace de plus de 3 m de l’endroit où vous avez lancé le sort, le glyphe est rompu et le sort prend fin sans avoir été activé.\n\nLe glyphe est pratiquement imperceptible, au point qu’il faut réussir un test de Sagesse (Perception) assorti de votre DD de sauvegarde des sorts pour le remarquer. À l’inscription du glyphe, vous déterminez son déclencheur et décidez s’il s’agit d’une rune explosive ou d’un glyphe à sort (voir ci-après).\n\nDéclencheur. Vous décidez ce qui le déclenche à l’incantation du sort. Dans le cas des glyphes de surface, les déclencheurs courants sont les suivants : toucher le glyphe, le fouler, retirer un objet qui le recouvre ou s’approcher dans un certain rayon. Pour les glyphes inscrits dans un objet, les déclencheurs courants sont l’ouverture de l’objet et la vue du glyphe. Une fois le glyphe déclenché, le sort prend fin. Vous pouvez préciser le déclencheur afin que seules les créatures d’un type donné l’activent (le glyphe ne pourrait ainsi affecter que les Aberrations). Vous pouvez aussi définir les critères de créatures qui ne déclenchent pas le glyphe, comme le fait de prononcer un certain mot de passe.\n\nRune explosive. Quand il se déclenche, le glyphe produit une explosion d’énergies magiques sous forme d’une Sphère de 6 m de rayon centrée sur le glyphe. Chaque créature prise dans la zone effectue un jet de sauvegarde de Dextérité. Elle subit 5d8 dégâts d’acide, de feu, de foudre, de froid ou de tonnerre (type que vous choisissez en inscrivant le glyphe) en cas d’échec, la moitié en cas de réussite.\n\nGlyphe à sort. Vous pouvez charger le glyphe d’un sort du 3e niveau ou inférieur lors de l’incantation et de la création du glyphe. Le sort doit cibler une seule créature ou une zone. Le sort ainsi appliqué au glyphe n’a pas d’effet immédiat lorsque vous le lancez. C’est seulement lors du déclenchement du glyphe que le sort chargé prend effet. Si le sort a une cible, celle-ci devient la créature qui a provoqué le déclenchement du glyphe. Si le sort affecte une zone, celle-ci est centrée sur cette créature. Si le sort convoque une créature Hostile ou crée un objet nuisible ou un piège, l’élément concerné se matérialise aussi près que possible de l’intrus et l’attaque. Si le sort requiert normalement la Concentration, il persiste jusqu’à la fin de la durée maximale.\n\nEmplacement de niveau supérieur. Les dégâts d’une rune explosive augmentent de 1d8 par niveau d’emplacement au-delà du 3e. Si vous créez un glyphe à sort, vous pouvez y stocker un sort dont le niveau ne dépasse pas celui de l’emplacement utilisé pour votre glyphe de garde.","classes":["bard","cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"graisse","name":"Graisse","level":1,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de couenne de porc ou de beurre"},"duration":"1 minute","concentration":false,"ritual":false,"description":"Une graisse glissante non inflammable recouvre le sol sur un carré de 3 m de côté centré sur un point à portée, ce qui en fait un Terrain difficile pour toute la durée.\n\nÀ l’apparition de la graisse, toute créature se tenant debout dans cette zone doit réussir un jet de sauvegarde de Dextérité sous peine de subir l’état À terre. Une créature qui pénètre dans la zone ou qui y termine son tour doit également réussir ce JS sous peine de se retrouver À terre.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"grande-foulee","name":"Grande foulée","level":1,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de terre"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez une créature. La Vitesse de la cible augmente de 3 m jusqu’à la fin du sort. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","druid","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"guerison","name":"Guérison","level":6,"school":"abjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Choisissez une créature que vous voyez à portée. Une vague d’énergie positive baigne la créature, qui récupère 70 points de vie. Ce sort met également fin aux éventuels états Assourdi, Aveuglé et Empoisonné de la cible. Emplacement de niveau supérieur. Les soins augmentent de 10 par niveau d’emplacement au-delà du 6e.","classes":["cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"guerison-de-groupe","name":"Guérison de groupe","level":9,"school":"abjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez une vague d’énergie curative vers les créatures qui vous entourent. Vous restituez un maximum de 700 points de vie, répartis à votre guise entre les créatures de votre choix parmi celles que vous voyez à portée. Les créatures soignées par ce sort se débarrassent en outre des états Assourdi, Aveuglé et Empoisonné.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"hate","name":"Hâte","level":3,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un copeau de racine de réglisse"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez une créature consentante que vous voyez à portée. Jusqu’à la fin du sort, la cible voit sa Vitesse doubler, sa classe d’armure reçoit un bonus de +2, elle a l’Avantage aux jets de sauvegarde de Dextérité et bénéficie d’une action supplémentaire à chacun de ses tours. Cette action ne peut servir qu’à entreprendre l’action Attaque (une seule attaque d’arme), Désengagement, Furtivité, Pointe ou Utilisation.\n\nLorsque le sort prend fin, jusqu’à la fin de son tour suivant, la cible en proie à une vague de léthargie subit l’état Neutralisé et sa vitesse est de 0.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"heroisme","name":"Héroïsme","level":1,"school":"enchantment","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une créature consentante que vous touchez est investie de vaillance. Jusqu’à la fin du sort, la créature est immunisée contre l’état Effrayé et reçoit autant de points de vie temporaires que votre modificateur de caractéristique d’incantation au début de chacun de ses tours. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"identification","name":"Identification","level":1,"school":"divination","castingTime":"1 minute ou rituel","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une perle d’une valeur minimale de 100 po"},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous touchez physiquement un objet tout au long de l’incantation. S’il s’agit d’un objet magique ou imprégné de magie, vous en apprenez les propriétés et savez les utiliser ; vous savez également si l’Harmonisation est requise et de combien de charges l’objet dispose, le cas échéant.\n\nVous apprenez aussi quels sorts éventuels affectent l’objet. Si l’objet a été créé par un sort, vous apprenez lequel.\n\nSi au lieu d’un objet, vous touchez une créature pendant toute l’incantation, vous apprenez quels sorts éventuels l’affectent.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"illusion-programmee","name":"Illusion programmée","level":6,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de jade d’une valeur minimale de 25 po"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous créez l’illusion d’un objet, d’une créature ou d’un autre phénomène visible à portée, qui s’active lorsqu’un déclencheur spécifique se présente. L’illusion reste imperceptible jusque-là. Elle doit loger dans un Cube de 9 m et vous décidez à l’incantation du sort comment l’illusion se comporte et quels sons elle produit. Cette performance scénarisée peut durer jusqu’à 5 minutes.\n\nQuand le déclencheur se présente, l’illusion prend vie selon le scénario que vous avez décrit. Une fois qu’elle a terminé son numéro, l’illusion disparaît et reste en veilleuse pendant 10 minutes, après quoi on peut la réactiver. Les circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de la zone. Vous pourriez ainsi créer une illusion de vous-même apparaissant pour mettre autrui en garde contre l’ouverture d’une porte piégée.\n\nToute interaction physique avec l’image percera l’illusion, car elle n’est pas tangible. Une créature qui entreprend l’action Étude pour examiner l’image peut comprendre qu’il s’agit d’une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l’illusion voit à travers l’image, tout son produit par l’illusion sonnant par ailleurs creux à ses oreilles.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"image-majeure","name":"Image majeure","level":3,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de laine brute"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez l’image d’un objet, d’une créature ou autre phénomène visible dont la taille ne dépasse pas celle d’un Cube de 6 m. L’image apparaît en un endroit que vous voyez à portée et persiste pour toute la durée. Elle semble réelle, avec les sons, les odeurs et la température attendus, mais elle ne peut infliger de dégâts ni d’états.\n\nSi vous êtes à portée de l’illusion, vous pouvez entreprendre l’action Magie pour déplacer l’image vers un autre point à portée du sort. Lors de ce déplacement, vous pouvez modifier l’aspect de l’image afin que ses mouvements paraissent naturels. Exemple : si vous créez l’image d’une créature que vous faites déplacer, vous pouvez faire en sorte qu’elle donne l’impression de marcher. De même, vous pouvez lui faire produire des sons à votre guise et même la faire participer à une conversation.\n\nToute interaction physique avec l’image percera l’illusion, car elle n’est pas tangible. Une créature qui entreprend l’action Étude pour examiner l’image peut comprendre qu’il s’agit d’une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l’illusion voit au travers et ne perçoit que de manière amoindrie les propriétés sensorielles produites par l’image.\n\nEmplacement de niveau supérieur. Lancé par un emplacement du 4e niveau ou supérieur, le sort persiste jusqu’à dissipation sans besoin de Concentration.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"image-miroir","name":"Image miroir","level":2,"school":"illusion","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Trois répliques illusoires de vous-même apparaissent dans votre espace. Jusqu’à la fin du sort, les répliques se déplacent avec vous et reproduisent vos actions en changeant constamment de position, si bien qu’il est impossible de savoir quelle version est réelle.\n\nChaque fois qu’une créature vous touche avec une attaque avant la fin du sort, lancez un d6 pour chacune de vos répliques. Si au moins l’un de ces d6 obtient un résultat de 3 ou plus, c’est l’une des répliques qui est touchée à votre place et qui est détruite. Pour le reste, les dégâts et effets ne s’appliquent pas aux répliques. Le sort prend fin quand les trois répliques sont détruites.\n\nToute créature subissant l’état Aveuglé, ou dotée de la Vision aveugle ou de la Vision lucide, n’est pas affectée par ce sort.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"image-projetee","name":"Image projetée","level":7,"school":"illusion","castingTime":"action","range":"750 km","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une statuette à votre effigie d’une valeur minimale de 5 po"},"duration":"Concentration, jusqu’à 1 jour","concentration":true,"ritual":false,"description":"Vous créez une réplique illusoire de vous-même qui persiste pour toute la durée. Ce double peut apparaître en n’importe quel lieu à portée que vous avez déjà vu, quels que soient les obstacles qui vous en séparent. L’illusion présente votre aspect et sonne comme vous, mais elle est intangible. Si elle subit des dégâts, l’illusion disparaît et le sort prend fin.\n\nVous voyez et entendez comme si vous vous trouviez dans son espace. Au prix de l’action Magie, vous pouvez déplacer votre double d’un maximum de 18 m et le faire bouger, parler et se comporter à votre guise. Il reproduit à merveille votre façon d’être.\n\nToute interaction physique avec l’image percera l’illusion, car elle n’est pas tangible. Une créature qui entreprend l’action Étude pour examiner l’image peut comprendre qu’il s’agit d’une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l’illusion voit à travers l’image, tout son produit par l’illusion sonnant par ailleurs creux à ses oreilles.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"image-silencieuse","name":"Image silencieuse","level":1,"school":"illusion","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de laine brute"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez l’image d’un objet, d’une créature ou autre phénomène visible dont la taille ne dépasse pas celle d’un Cube de 4,50 m. L’image apparaît en un endroit à portée et persiste pour toute la durée. Elle est purement visuelle, dépourvue de son, d’odeur et de tout autre effet sensoriel.\n\nAu prix de l’action Magie, vous pouvez déplacer l’image en un point à portée. Lors de ce déplacement, vous pouvez modifier l’aspect de l’image afin que ses mouvements paraissent naturels. Exemple : si vous créez l’image d’une créature que vous faites se déplacer, vous pouvez faire en sorte qu’elle donne l’impression de marcher.\n\nToute interaction physique avec l’image percera l’illusion, car elle n’est pas tangible. Une créature qui entreprend l’action Étude pour examiner l’image peut comprendre qu’il s’agit d’une illusion en réussissant un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. Une créature qui perce l’illusion voit à travers l’image.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"immobilisation-de-monstre","name":"Immobilisation de monstre","level":5,"school":"enchantment","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un brin de fer"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Paralysé pour toute la durée du sort. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 5e.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"immobilisation-de-personne","name":"Immobilisation de personne","level":2,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un brin de fer"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez un Humanoïde que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Paralysé pour toute la durée du sort. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\n\nEmplacement de niveau supérieur. Vous pouvez cibler un Humanoïde supplémentaire par niveau d’emplacement au-delà du 2e.","classes":["bard","cleric","druid","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"imprecation","name":"Imprécation","level":1,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de sang"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un maximum de trois créatures de votre choix parmi celles que vous voyez à portée effectuent un jet de sauvegarde de Charisme. Chaque fois qu’une créature ayant raté ce JS effectue un jet d’attaque ou un jet de sauvegarde avant la fin du sort, elle soustrait 1d4 au résultat correspondant.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","cleric","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"injonction","name":"Injonction","level":1,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous adressez un simple mot de commande à une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de devoir s’y soumettre à son tour suivant.\n\nChoisissez votre ordre parmi les options suivantes :\n\nApproche. La cible se déplace dans votre direction par le chemin le plus court et direct, et termine son tour si elle se retrouve dans un rayon de 1,50 m de vous.\n\nFuis. La cible consacre son tour à s’éloigner de vous par le moyen le plus rapide.\n\nHalte. À son tour, la cible ne se déplace pas, et n’entreprend ni action ni action Bonus.\n\nLâche. La cible lâche ce qu’elle tient et termine son tour.\n\nRampe. La cible subit l’état À terre et termine son tour.\n\nEmplacement de niveau supérieur. Vous pouvez affecter une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"insecte-geant","name":"Insecte géant","level":4,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous convoquez une araignée, une guêpe ou un millepattes (choisissez à l’incantation du sort), en version géante. La créature se manifeste en un espace inoccupé que vous voyez à portée et reprend le profil de l’insecte géant. La forme retenue détermine certains détails du profil. La créature disparaît quand le sort prend fin, mais également si elle tombe à 0 point de vie.\n\nLa créature constitue un allié pour vous et vos alliés. Au combat, la créature partage votre rang d’Initiative, mais elle joue son tour juste après vous. Elle obéit à vos instructions verbales (pas d’action requise de votre part). Sans ordre de votre part, elle entreprend l’action Esquive et consacre son déplacement à se mettre à l’abri du danger.\n\nEmplacement de niveau supérieur. Le niveau de l’emplacement de sort s’applique chaque fois que le profil de jeu y fait référence.\n\nInsecte géant Bête de taille G, non alignée CA 11 + niveau du sort Pv 30 + 10 par niveau du sort au-delà du 4e Vitesse 12 m, escalade 12 m, vol 12 m (guêpe uniquement) MOD JS MOD JS MOD JS For 17 +3 +3 Dex 13 +1 +1 Con 15 +2 +2 Int 4 −3 −3 Sag 14 +2 +2 Cha 3 −4 −4 Sens Vision dans le noir 18 m ; Perception passive 12 Langues comprend les langues que vous parlez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) Traits Pattes d’araignée. L’insecte peut parcourir les parois les plus difficiles à escalader, y compris les plafonds, sans passer par un test de caractéristique. Actions Attaques multiples. L’insecte effectue autant d’attaques que la moitié du niveau de ce sort (arrondir à l’inférieur). Piqûre toxique. Corps à corps : bonus égal à votre modificateur d’attaque des sorts, allonge 3 m. Touché : 1d6 + 3 + niveau du sort dégâts perforants, plus 1d4 dégâts de poison. Jet de toile (araignée uniquement). À distance : bonus égal à votre modificateur d’attaque des sorts, portée 18 m. Touché : 1d10 + 3 + niveau du sort dégâts contondants, et la vitesse de la cible tombe à 0 jusqu’au début du tour suivant de l’insecte. Actions Bonus Crachat venimeux (mille-pattes uniquement). JS Constitution : votre DD de sauvegarde des sorts, une créature que l’insecte voit dans un rayon de 3 m. Échec : la cible subit l’état Empoisonné jusqu’au début du tour suivant de l’insecte.","classes":["druid"],"source":"SRD 5.2.1","summonedMonsters":["araignee-geante","guepe-geante","mille-pattes-geant"]},{"canonicalId":"interdiction","name":"Interdiction","level":6,"school":"abjuration","castingTime":"10 minutes ou rituel","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de rubis d’une valeur minimale de 1 000 po"},"duration":"1 jour","concentration":false,"ritual":true,"description":"Vous créez une barrière contre le voyage magique qui protège jusqu’à 3 600 m2 d’espace au sol, sur une hauteur de 9 m. Pour toute la durée, aucune créature ne peut se téléporter dans la zone ou y pénétrer par le biais d’un accès magique comme celui que crée le sort portail. Le sort proscrit tout voyage planaire dans la zone, ce qui empêche quiconque de s’y rendre depuis le Plan Astral, le Plan Éthéré, la Féerie ou la Gisombre, ou par le biais du sort changement de plan.\n\nDe plus, le sort inflige des dégâts aux types de créature que vous désignez à l’incantation. Choisissez un ou plusieurs types parmi les suivants : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Lorsqu’une créature désignée entre dans la zone pour la première fois d’un tour ou y termine son tour, elle subit 5d10 dégâts nécrotiques ou radiants (vous choisissez à l’incantation du sort).\n\nVous pouvez choisir un mot de passe à l’incantation du sort. Une créature qui prononce ce sésame en pénétrant dans la zone ne subit aucun dégât du sort.\n\nLa zone du sort ne peut pas chevaucher celle d’un autre sort d’interdiction. Si vous lancez chaque jour interdiction au même endroit pendant 30 jours, le sort persiste jusqu’à dissipation, les composantes matérielles étant détruites à la dernière incantation.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"inversion-de-la-gravite","name":"Inversion de la gravité","level":7,"school":"transmutation","castingTime":"action","range":"30 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une magnétite et de la limaille de fer"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Ce sort inverse la gravité dans un Cylindre de 15 m de rayon et 30 m de haut centré sur un point à portée. Tous les objets et créatures de la zone qui ne sont pas ancrés au sol « chutent » vers le haut pour atteindre le sommet du Cylindre.\n\nUne créature a droit à un jet de sauvegarde de Dextérité pour saisir un objet fixé à portée d’allonge et ainsi éviter la « chute ». Si un plafond ou un objet ancré se présente en travers de la chute, les objets et créatures qui tombent le heurtent comme ils le feraient lors d’une chute normale.\n\nLes objets et créatures qui atteignent le sommet du Cylindre sans rien heurter y restent en suspension pour toute la durée. À la fin du sort, les objets et créatures affectés retombent vers le bas.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"invisibilite","name":"Invisibilité","level":2,"school":"illusion","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un cil dans de la sève"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"La créature que vous touchez physiquement reçoit l’état Invisible jusqu’à la fin du sort. Le sort prend fin prématurément si la cible effectue un jet d’attaque, inflige des dégâts ou lance un sort. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 2e.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"invisibilite-supreme","name":"Invisibilité suprême","level":4,"school":"illusion","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"La créature que vous touchez physiquement reçoit l’état Invisible jusqu’à la fin du sort.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"invocation-d-animaux","name":"Invocation d’animaux","level":3,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez des esprits de la nature qui prennent la forme d’une « meute » de taille G d’animaux intangibles apparaissant en un espace inoccupé que vous voyez à portée. Cette meute persiste pour toute la durée et vous choisissez la forme animale des esprits (loups, serpents ou oiseaux, par exemple). Vous avez l’Avantage aux jets de sauvegarde de Force tant que vous êtes dans un rayon de 1,50 m de la meute.\n\nLorsque vous vous déplacez à votre tour, vous pouvez également déplacer la meute d’un maximum de 9 m jusqu’à un espace inoccupé que vous voyez. Chaque fois que la meute se déplace dans un rayon de 3 m d’une créature que vous voyez, ainsi que chaque fois qu’une créature que vous voyez pénètre dans un espace à 3 m ou moins de la meute ou y termine son tour, vous pouvez contraindre cette créature à un jet de sauvegarde de Dextérité. En cas d’échec, elle subit 3d10 dégâts tranchants. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 3e.","classes":["druid","ranger"],"source":"SRD 5.2.1","summonedMonsters":["loup","serpent-venimeux","aigle"]},{"canonicalId":"invocation-d-elementaire","name":"Invocation d’élémentaire","level":5,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez un esprit intangible de taille G issu des Plans Élémentaires, qui apparaît en un espace inoccupé à portée. Choisissez l’élément de l’esprit, qui définit son type de dégâts : air (foudre), eau (froid), feu (feu) ou terre (tonnerre). L’esprit persiste pour toute la durée.\n\nChaque fois qu’une créature que vous voyez pénètre dans l’espace de l’esprit ou commence son tour dans un rayon de 1,50 m de celui-ci, vous pouvez la contraindre à un jet de sauvegarde de Dextérité si l’esprit n’a pas de créature Entravée. En cas d’échec, la cible subit 8d8 dégâts du type associé à l’esprit, ainsi que l’état Entravé jusqu’à la fin du sort.\n\nAu début de chacun de ses tours, la cible Entravée réitère le JS. En cas d’échec, elle subit 4d8 dégâts du type de l’esprit. En cas de réussite, elle n’est plus Entravée par l’esprit.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 5e.","classes":["druid","wizard"],"source":"SRD 5.2.1","summonedMonsters":["elementaire-de-l-air","elementaire-de-l-eau","elementaire-de-la-terre","elementaire-du-feu"]},{"canonicalId":"invocation-d-elementaires-mineurs","name":"Invocation d’élémentaires mineurs","level":4,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez des esprits issus des Plans Élémentaires qui volètent autour de vous pour toute la durée, sous forme d’une Émanation de 4,50 m. Jusqu’à la fin du sort, toute attaque que vous effectuez inflige 2d8 dégâts supplémentaires lorsque vous touchez une créature prise dans l’Émanation. Ces dégâts sont d’acide, de feu, de foudre ou de froid (vous choisissez en effectuant l’attaque).\n\nDe plus, le sol dans l’Émanation constitue un Terrain difficile pour vos ennemis.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 4e.","classes":["druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"invocation-d-etres-sylvestres","name":"Invocation d’êtres sylvestres","level":4,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez des esprits de la nature qui volètent autour de vous pour toute la durée, sous forme d’une Émanation de 3 m.\n\nChaque fois que l’Émanation pénètre dans l’espace d’une créature que vous voyez, ainsi que chaque fois qu’une créature que vous voyez pénètre dans l’Émanation ou y termine son tour, vous pouvez la contraindre à un jet de sauvegarde de Sagesse. Elle subit 5d8 dégâts de force en cas d’échec, la moitié en cas de réussite. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nDe plus, pour toute la durée du sort, vous pouvez entreprendre l’action Désengagement par une action Bonus.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 4e.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"invocation-de-celeste","name":"Invocation de céleste","level":7,"school":"conjuration","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez un esprit des Plans Supérieurs, qui se manifeste telle une colonne de lumière ; un Cylindre de 3 m de rayon et 12 m de haut, centré sur un point à portée. Pour chaque créature que vous voyez dans le Cylindre, choisissez par laquelle des lumières suivantes elle est baignée :\n\nLumière calcinante. La cible effectue un jet de sauvegarde de Dextérité, et subit 6d12 dégâts radiants en cas d’échec, la moitié en cas de réussite.\n\nLumière guérisseuse. La cible récupère autant de points de vie que 4d12 + votre modificateur de caractéristique d’incantation.\n\nJusqu’à la fin du sort, le Cylindre est empli d’une Lumière vive et, quand vous vous déplacez à votre tour, vous pouvez également déplacer le Cylindre d’un maximum de 9 m. Chaque fois que le Cylindre se déplace dans l’espace d’une créature que vous voyez, ainsi que chaque fois qu’une créature que vous voyez pénètre dans le Cylindre ou y termine son tour, vous pouvez la baigner de l’une des lumières. Une même créature ne peut être affectée par ce sort plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les soins et les dégâts augmentent de 1d12 par niveau d’emplacement au-delà du 7e.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"invocation-de-fee","name":"Invocation de fée","level":6,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous invoquez un esprit de taille M issu de Féerie, en un espace inoccupé que vous voyez à portée. L’esprit persiste pour toute la durée, avec l’aspect de la Fée de votre choix.\n\nQuand l’esprit apparaît, vous pouvez effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l’esprit. Si l’attaque touche, la cible subit des dégâts psychiques égaux à 3d12 plus votre modificateur de caractéristique d’incantation, et subit l’état Effrayé jusqu’au début de votre tour suivant, l’esprit et vousmême étant considérés comme source de sa frayeur.\n\nPar une action Bonus à vos tours suivants, vous pouvez téléporter l’esprit en un espace inoccupé que vous voyez dans un rayon de 9 m de l’espace que vous lui faites quitter et effectuer l’attaque contre une créature située à 1,50 m ou moins de lui.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d12 par niveau d’emplacement au-delà du 6e.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"lame-de-feu","name":"Lame de feu","level":2,"school":"evocation","castingTime":"action Bonus","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une feuille d’amarante"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous faites apparaître une lame ardente dans votre main libre. La lame est comparable en taille et forme à un cimeterre. Elle persiste pour toute la durée. Si vous la lâchez, la lame disparaît, mais vous pouvez la faire réapparaître par une action Bonus.\n\nAu prix de l’action Magie, vous pouvez effectuer une attaque de sort avec la lame enflammée. Si l’attaque touche, la cible subit des dégâts de feu : 3d6 plus votre modificateur de caractéristique d’incantation.\n\nLa lame ardente projette une Lumière vive sur un rayon de 3 m, et une Lumière faible sur 3 m de plus.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 2e.","classes":["druid","sorcerer"],"source":"SRD 5.2.1"},{"canonicalId":"lenteur","name":"Lenteur","level":3,"school":"transmutation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de mélasse"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous altérez le temps autour d’un maximum de six créatures de votre choix dans un Cube de 12 m à portée. Chaque cible doit réussir un jet de sauvegarde de Sagesse sous peine d’être affectée par ce sort pour toute la durée.\n\nUne cible affectée voit sa Vitesse réduite de moitié, subit un malus de –2 à la CA et aux jets de sauvegarde de Dextérité, et ne peut pas jouer de Réactions. À ses tours, elle peut entreprendre une action ou une action Bonus, mais pas les deux, et elle ne peut effectuer qu’une attaque dans le cadre de l’action Attaque.\n\nSi elle lance un sort avec une composante somatique, il y a 25 % de chances que le sort échoue en raison de la torpeur de sa gestuelle.\n\nUne cible affectée réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"levitation","name":"Lévitation","level":2,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un ressort métallique"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Une créature ou un objet de votre choix que vous voyez à portée monte verticalement d’un maximum de 6 m et y reste, en suspension, pour toute la durée. Le sort peut faire léviter un objet dont le poids n’excède pas 250 kg. Une créature non consentante qui réussit un jet de sauvegarde de Constitution n’est pas affectée.\n\nLa cible ne peut se déplacer qu’en prenant appui sur des objets et surfaces fixes à portée (murs, plafonds, etc.), comme si elle escaladait. À votre tour, vous pouvez modifier l’altitude de la cible d’un maximum de 6 m vers le haut ou vers le bas. Si vous êtes la cible, vous pouvez vous déplacer ainsi dans le cadre de votre déplacement. Sans cela, vous devez entreprendre l’action Magie pour déplacer la cible, qui doit rester à portée du sort.\n\nLorsque le sort prend fin, la cible redescend en flottant vers le sol si elle est toujours dans les airs.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"liberte-de-mouvement","name":"Liberté de mouvement","level":4,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une bandelette de cuir"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez une créature consentante. Pour toute la durée, les déplacements de la cible ne sont pas affectés par le Terrain difficile, et les sorts et effets magiques ne peuvent ni réduire sa Vitesse, ni lui infliger l’état Paralysé ou Entravé. La cible dispose aussi d’une Vitesse de nage égale à sa Vitesse.\n\nDe plus, la cible peut consacrer 1,50 m de son déplacement à s’extraire automatiquement d’entraves non magiques, comme des menottes ou l’étreinte d’une créature qui lui impose l’état Agrippé.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 4e.","classes":["bard","cleric","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"lien-de-protection","name":"Lien de protection","level":2,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"deux bagues de platine d’une valeur de 50 po chacune, que la cible et vous devez porter pour toute la durée"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature consentante pour forger un lien magique entre elle et vous jusqu’à la fin du sort. Tant que la cible se trouve dans un rayon de 18 m de vous, elle reçoit un bonus de +1 à la CA et aux jets de sauvegarde, et bénéficie de la Résistance à tous les dégâts.\n\nPar ailleurs, chaque fois qu’elle subit des dégâts, vous en subissez autant.\n\nLe sort prend fin si vous tombez à 0 point de vie ou si la cible et vous vous retrouvez distants de plus de 18 m. Il prend également fin s’il est relancé sur l’une des deux créatures ainsi liées.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"lien-telepathique","name":"Lien télépathique","level":5,"school":"divination","castingTime":"action ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"deux oeufs"},"duration":"1 heure","concentration":false,"ritual":true,"description":"Vous forgez un lien télépathique entre un maximum de huit créatures consentantes que vous choisissez à portée, chacune se retrouvant en relation psychique avec toutes les autres pour toute la durée. Les créatures incapables de communiquer par le biais d’une langue ne sont pas affectées par ce sort.\n\nJusqu’à la fin du sort, les cibles peuvent communiquer par télépathie via le lien psychique, qu’elles parlent ou non une même langue. La communication, possible quelle que soit la distance, ne s’étend toutefois pas d’un plan d’existence à l’autre.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"localisation-d-animaux-ou-de-plantes","name":"Localisation d’animaux ou de plantes","level":2,"school":"divination","castingTime":"action ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une touffe de poils de limier"},"duration":"instantanée","concentration":false,"ritual":true,"description":"Décrivez ou nommez une sorte de créature de type Bête ou Plante, ou une plante non magique. Vous savez alors dans quelle direction et à quelle distance se trouve, le cas échéant, la créature ou la plante de cette sorte la plus proche dans un rayon de 7,5 km.","classes":["bard","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"localisation-d-objet","name":"Localisation d’objet","level":2,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une brindille fourchue"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Décrivez ou nommez un objet qui vous est familier. Vous percevez dans quelle direction l’objet se trouve, à condition qu’il soit situé dans un rayon de 300 m. Si l’objet est en mouvement, vous savez dans quelle direction il se déplace.\n\nLe sort peut localiser un objet donné que vous connaissez, à condition que vous l’ayez déjà vu de près (9 m ou moins). Une autre option vous permet de localiser l’objet d’une certaine catégorie le plus proche, en mentionnant par exemple un certain genre de vêtement, de bijou, de meuble, d’outil ou d’arme.\n\nCe sort ne trouve pas l’objet si la moindre épaisseur de plomb vous en sépare.","classes":["bard","cleric","druid","wizard","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"localisation-de-creature","name":"Localisation de créature","level":4,"school":"divination","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une touffe de poils de limier"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Décrivez ou nommez une créature qui vous est familière. Vous percevez dans quelle direction la créature se trouve, à condition qu’elle soit située dans un rayon de 300 m. Si la créature se déplace, vous savez dans quelle direction.\n\nLe sort peut localiser une créature donnée que vous connaissez ou la créature d’une certaine catégorie (un humain ou une licorne, par exemple) la plus proche, à condition que vous ayez déjà vu une telle créature de près (9 m ou moins).\n\nSi la créature décrite ou nommée se trouve sous une forme différente, parce qu’elle est sous les effets du sort métamorphose ou pétrification par exemple, le sort ne parvient pas à la localiser. Ce sort ne trouve pas davantage la créature si la moindre épaisseur de plomb vous sépare d’elle.","classes":["bard","cleric","druid","wizard","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"lueur-d-espoir","name":"Lueur d’espoir","level":3,"school":"abjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez autant de créatures que vous le souhaitez à portée. Pour toute la durée, chaque cible a l’Avantage aux jets de sauvegarde de Sagesse et JS contre la mort, et récupère le maximum possible de points de vie chaque fois qu’on la soigne.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"lueurs-feeriques","name":"Lueurs féeriques","level":1,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Le contour des objets compris dans un Cube de 6 m à portée luit de bleu, de vert ou de violet, à votre convenance. Chaque créature prise dans le Cube est elle aussi nimbée si elle rate un jet de sauvegarde de Dextérité.\n\nPour toute la durée, les objets et les créatures affectées projettent une Lumière faible sur un rayon de 3 m, et ne peuvent bénéficier de l’état Invisible. Les jets d’attaque contre une créature ou un objet affectés ont l’Avantage si l’assaillant voit la cible.","classes":["bard","druid"],"source":"SRD 5.2.1"},{"canonicalId":"lumiere-du-jour","name":"Lumière du jour","level":3,"school":"evocation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Pour toute la durée, la lumière du soleil rayonne depuis un point à portée en emplissant une Sphère de 18 m de rayon. La Sphère constitue une zone de Lumière vive et produit une Lumière faible sur 18 m de plus.\n\nAu lieu de cela, vous pouvez lancer le sort sur un objet porté par personne, de manière à ce que les rayons du soleil emplissent une Émanation de 18 m centrée sur l’objet. Il suffit de recouvrir cet objet d’une surface opaque, comme une gamelle ou un heaume, pour bloquer la lumière du soleil.\n\nSi tout ou partie de ce sort chevauche la zone de Ténèbres créée par un sort du 3e niveau ou inférieur, cet autre sort est dissipé.","classes":["cleric","druid","sorcerer","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"main-arcanique","name":"Main arcanique","level":5,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une coquille d’oeuf et un gant"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez une main de taille G faite d’énergies magiques chatoyantes. Elle apparaît dans un espace inoccupé que vous voyez à portée. La main persiste pendant toute la durée et se déplace sous votre contrôle, en reproduisant les mouvements de votre propre main. La main est un objet doté d’une CA de 20 et de points de vie égaux à votre maximum de points de vie. S’il tombe à 0 point de vie, le sort prend fin. La main n’occupe pas son espace.\n\nÀ l’incantation du sort, ainsi que par une action Bonus à vos tours suivants, vous pouvez déplacer la main d’un maximum de 18 m puis lui faire produire l’un des effets suivants :\n\nMain agrippeuse. La main tente d’agripper une créature de taille TG ou inférieure située dans un rayon de 1,50 m d’elle. La cible doit réussir un jet de sauvegarde de Dextérité sous peine de subir l’état Agrippé, le DD d’évasion étant égal à votre DD de sauvegarde des sorts. Tant que la main agrippe la cible, vous pouvez entreprendre une action Bonus pour que la main la broie et lui inflige des dégâts contondants égaux à 4d6 plus votre modificateur de caractéristique d’incantation.\n\nMain impérieuse. La main tente de pousser une créature de taille TG ou inférieure située dans un rayon de 1,50 m d’elle. La cible doit réussir un jet de sauvegarde de Force, sans quoi la main la repousse d’un maximum de 1,50 m, plus 1,50 m multiplié par votre modificateur de caractéristique d’incantation. La main se déplace avec la cible pour rester dans un rayon de 1,50 m d’elle.\n\nMain interposée. La main vous octroie un Abri partiel contre les attaques et effets émanant de son espace ou qui le traversent. De plus, son espace est considéré comme un Terrain difficile pour vos ennemis.\n\nPoing serré. La main frappe une cible dans un rayon de 1,50 m d’elle. Effectuez une attaque de sort au corps à corps. Si l’attaque touche, la cible subit 5d8 dégâts de force.\n\nEmplacement de niveau supérieur. Les dégâts de l’option poing serré augmentent de 2d8 et ceux de main agrippeuse de 2d6 par niveau d’emplacement au-delà du 5e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mains-brulantes","name":"Mains brûlantes","level":1,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une fine nappe de flammes jaillit de vous. Chaque créature prise dans un Cône de 4,50 m effectue un jet de sauvegarde de Dextérité et subit 3d6 dégâts de feu en cas d’échec, la moitié en cas de réussite. Les objets inflammables pris dans le Cône s’embrasent s’ils ne sont portés par personne. Emplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"malediction","name":"Malédiction","level":3,"school":"necromancy","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous touchez physiquement une créature, qui doit réussir un jet de sauvegarde de Sagesse sous peine d’être maudite pour toute la durée. Jusqu’à la fin de la malédiction, la cible subit l’un des effets suivants, à votre convenance :\n\n• Choisissez une caractéristique. La cible a le Désavantage aux tests de caractéristique et jets de sauvegarde associés à cette caractéristique.\n\n• La cible a le Désavantage aux jets d’attaque contre vous.\n\n• Au combat, la cible doit réussir un jet de sauvegarde de Sagesse au début de chacun de ses tours sous peine de devoir entreprendre l’action Esquive à ce tour.\n\n• Si vous infligez des dégâts à la cible par un jet d’attaque ou un sort, elle subit 1d8 dégâts nécrotiques supplémentaires.\n\nEmplacement de niveau supérieur. Si vous lancez ce sort par un emplacement du 4e niveau, vous pouvez maintenir votre Concentration un maximum de 10 minutes. Avec un emplacement du 5e niveau ou supérieur, le sort ne requiert pas de Concentration et la durée passe à 8 heures (5e et 6e niveau) ou 24 heures (7e et 8e niveau). Avec un emplacement du 9e niveau, la durée passe à « jusqu’à dissipation ».","classes":["bard","cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"malefice","name":"Maléfice","level":1,"school":"enchantment","castingTime":"action Bonus","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un oeil pétrifié de triton"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous maudissez une créature que vous voyez à portée. Jusqu’à la fin du sort, vous infligez 1d6 dégâts nécrotiques supplémentaires à la cible chaque fois que vous la touchez avec un jet d’attaque.\n\nVous désignez également une caractéristique à l’incantation. La cible subit le Désavantage aux tests de caractéristique associés à la caractéristique en question.\n\nSi la cible tombe à 0 point de vie a
