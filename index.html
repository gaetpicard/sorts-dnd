vant la fin du sort, vous pouvez désigner une nouvelle cible à l’un de vos tours suivants, par une action Bonus.\n\nEmplacement de niveau supérieur. Votre Concentration peut durer jusqu’à 8 heures (emplacement du 3e ou 4e niveau) ou 24 heures (5e niveau ou supérieur).","classes":["warlock"],"source":"SRD 5.2.1"},{"canonicalId":"manoir-somptueux","name":"Manoir somptueux","level":7,"school":"conjuration","castingTime":"1 minute","range":"90 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une porte miniature d’une valeur minimale de 15 po"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Vous invoquez une porte chatoyante à portée, qui persiste pour toute la durée. La porte, large de 1,50 m et haute de 3 m, ouvre sur une demeure extradimensionnelle. Vous et toute créature que vous désignez à l’incantation du sort pouvez pénétrer dans cette demeure tant que la porte reste ouverte. Vous pouvez l’ouvrir ou la refermer (pas d’action requise) si vous vous trouvez dans un rayon de 9 m d’elle. Tant qu’elle est fermée, on ne peut pas la percevoir.\n\nPar-delà la porte, un magnifique vestibule se dévoile, ouvrant sur de nombreuses pièces. L’atmosphère y est propre, douce et agréable. La configuration des étages est laissée à votre discrétion, mais l’espace total ne peut excéder l’équivalent de 50 Cubes contigus de 3 m. La demeure est meublée et décorée selon vos désirs. Elle renferme suffisamment de nourriture pour servir un banquet composé de neuf plats pour 100 convives. Les meubles et autres objets créés par ce sort se dissipent en fumée si on les sort du manoir.\n\n100 serviteurs quasi transparents accueillent les invités. Vous décidez de l’aspect visuel de ces domestiques et de leur livrée. Invulnérables, ils obéissent à vos ordres. Les serviteurs peuvent accomplir toute tâche à la portée d’un humain, mais ils ne peuvent attaquer ni entreprendre d’action qui pourrait nuire directement à une autre créature. Ils peuvent donc aller chercher des objets, nettoyer, réparer, repasser les vêtements, allumer un feu, servir à manger et à boire, etc. Les domestiques ne peuvent pas quitter la demeure.\n\nQuand le sort prend fin, tous les objets et créatures qui occupent son espace extradimensionnel sont renvoyés dans les espaces inoccupés les plus proches de l’entrée.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"marche-sur-l-onde","name":"Marche sur l’onde","level":3,"school":"transmutation","castingTime":"action ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un morceau de liège"},"duration":"1 heure","concentration":false,"ritual":true,"description":"Ce sort octroie la faculté de se déplacer sur n’importe quelle surface liquide (eau, acide, boue, neige, sables mouvants et même lave) comme s’il s’agissait d’une surface solide ne présentant aucun risque (sur de la lave, les créatures s’exposent tout de même aux dégâts que peut engendrer la chaleur).\n\nUn maximum de dix créatures consentantes que vous choisissez à portée reçoivent cette faculté pour toute la durée.\n\nUne cible affectée peut entreprendre une action Bonus pour s’immerger dans le liquide alors qu’elle est à sa surface, ou vice-versa, mais une cible qui tombe dans le liquide en traverse la surface et se retrouve immergée.","classes":["cleric","druid","sorcerer","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"marque-du-chasseur","name":"Marque du chasseur","level":1,"school":"divination","castingTime":"action Bonus","range":"27 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous désignez magiquement une créature que vous voyez à portée comme votre proie. Jusqu’à la fin du sort, vous infligez 1d6 dégâts de force à la cible chaque fois que vous la touchez avec un jet d’attaque. Vous avez aussi l’Avantage aux tests de Sagesse (Perception ou Survie) visant à la trouver.\n\nSi la cible tombe à 0 point de vie avant la fin du sort, vous pouvez par une action Bonus déplacer la marque vers une autre créature que vous voyez à portée.\n\nEmplacement de niveau supérieur. Votre Concentration peut durer jusqu’à 8 heures (emplacement du 3e ou 4e niveau) ou 24 heures (5e niveau ou supérieur).","classes":["ranger"],"source":"SRD 5.2.1"},{"canonicalId":"mauvais-oeil","name":"Mauvais oeil","level":6,"school":"necromancy","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Pour toute la durée, vos yeux sont d’un noir d’encre. Une créature que vous choisissez parmi celles que vous voyez dans un rayon de 18 m doit réussir un jet de sauvegarde de Sagesse pour ne pas être affectée par l’un des effets suivants de votre choix, pour toute la durée. À chacun de vos tours jusqu’à la fin du sort, vous pouvez entreprendre l’action Magie à cibler une autre créature, sans toutefois pouvoir choisir une créature qui a réussi son JS contre cette incantation du sort.\n\nEndormie. La cible subit l’état Inconscient. Elle reprend conscience si elle subit des dégâts ou si une autre créature consacre une action à la secouer.\n\nNauséeuse. La cible subit l’état Empoisonné.\n\nPaniquée. La cible subit l’état Effrayé. Ainsi Effrayée, la cible doit à chacun de ses tours entreprendre l’action Pointe et s’éloigner de vous par le chemin le plus sûr et le plus court. Si la cible atteint un espace distant de plus de 18 m de vous d’où elle ne vous voit plus, cet effet prend fin.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"messager-animal","name":"Messager animal","level":2,"school":"enchantment","castingTime":"action ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de nourriture"},"duration":"24 heures","concentration":false,"ritual":true,"description":"La Bête de taille TP de votre choix parmi celles que vous voyez à portée doit réussir un jet de sauvegarde de Charisme, sans quoi elle s’efforce de livrer le message que vous lui confiez (si son facteur de puissance n’est pas 0, elle réussit automatiquement).\n\nVous spécifiez un lieu que vous avez déjà visité et un destinataire qui correspond à une description générale, tel que « une personne vêtue de l’uniforme du guet » ou « un nain roux coiffé d’un chapeau pointu. » Vous lui communiquez de plus un message limité à vingt-cinq mots.\n\nLa Bête voyage vers le lieu spécifié tant que le sort est actif, ce qui lui permet de parcourir 75 km en 24 heures dans le cas d’un animal volant, 37,5 km sinon. Quand la Bête arrive à destination, elle livre votre message à la créature décrite, en imitant votre manière de communiquer. Si elle ne parvient pas à destination avant la fin du sort, le message est perdu et la Bête revient à l’endroit de l’incantation.\n\nEmplacement de niveau supérieur. La durée augmente de 48 heures par niveau d’emplacement au-delà du 2e.","classes":["bard","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"metal-brulant","name":"Métal brûlant","level":2,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un bout de fer et une flamme"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Choisissez un objet manufacturé en métal, tel qu’une arme, ou une armure métallique intermédiaire ou lourde, que vous voyez à portée. Vous faites chauffer l’objet au rouge incandescent.\n\nToute créature en contact physique avec l’objet subit 2d8 dégâts de feu à l’incantation du sort. Jusqu’à la fin du sort, vous pouvez appliquer de nouveau ces dégâts par une action Bonus à chacun de vos tours suivants, à condition que l’objet soit à portée.\n\nUne créature qui tient un tel objet ou en est vêtue et qui subit les dégâts correspondants doit réussir un jet de sauvegarde de Constitution sous peine de lâcher l’objet (si elle en a la possibilité). Si elle ne peut pas le lâcher, elle a le Désavantage à ses jets d’attaque et tests de caractéristique jusqu’au début de votre tour suivant.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 2e.","classes":["bard","druid"],"source":"SRD 5.2.1"},{"canonicalId":"metamorphose","name":"Métamorphose","level":4,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une chrysalide"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous tentez de transformer en Bête une créature que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine d’être métamorphosée en Bête pour toute la durée. Cette forme est une Bête de votre choix dont le facteur de puissance est inférieur ou égal à celui de la cible (ou à son niveau, si elle n’a pas de facteur de puissance).\n\nLe profil de la cible est remplacé par celui de la Bête retenue, si ce n’est que la cible conserve son alignement, sa personnalité, son type de créature, ses points de vie et ses dés de vie. La section « Animaux » de « Monstres » propose un échantillon de profils de Bêtes. La cible reçoit autant de points de vie temporaires que les points de vie de sa forme de Bête. Ces points de vie temporaires disparaissent s’il lui en reste à la fin du sort. Le sort prend fin prématurément sur la cible s’il ne lui reste plus de points de vie temporaires.\n\nLa cible est limitée dans les actions qu’elle peut entreprendre par l’anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L’équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit.","classes":["bard","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"metamorphose-animale","name":"Métamorphose animale","level":8,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"24 heures","concentration":false,"ritual":false,"description":"Choisissez autant de créatures consentantes que vous souhaitez, parmi celles que vous voyez à portée. Chaque cible se transforme en Bête de taille G ou inférieure de votre choix, dont le facteur de puissance ne dépasse pas 4. Vous pouvez opter pour une forme différente pour chaque cible. Aux tours suivants, vous pouvez entreprendre l’action Magie pour de nouveau transformer les cibles.\n\nLe profil de jeu de chaque cible est remplacé par celui de la Bête choisie, à l’exception de son type de créature, de ses points de vie et dés de vie, de sa faculté de communication, de son alignement et de ses valeurs d’Intelligence, Sagesse et Charisme, qui restent les siens. Les actions de la cible sont limitées par l’anatomie de la Bête retenue et elle ne peut pas lancer de sorts. L’équipement porté par la cible se fond dans sa nouvelle forme, sachant qu’elle ne peut pas recourir à cet équipement tant qu’elle reste sous cette forme.\n\nLa cible reçoit autant de points de vie temporaires que les points de vie de la première forme adoptée. Ces points de vie temporaires disparaissent s’il en reste à la fin du sort. La transformation persiste pour toute la durée, sauf si la cible y met un terme par une action Bonus.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"metamorphose-supreme","name":"Métamorphose suprême","level":9,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de mercure, un bon morceau de gomme arabique et une volute de fumée"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Choisissez une créature ou un objet non magique que vous voyez à portée. La créature se métamorphose en une autre créature ou en objet non magique, ou l’objet se transforme en créature (sachant qu’il ne peut pas au départ être porté par une autre créature). La transformation persiste pour toute la durée, sauf si la cible meurt ou est détruite. Toutefois, si vous maintenez votre Concentration pour la totalité de la durée du sort, celui-ci persiste jusqu’à dissipation. Une créature non consentante peut effectuer un jet de sauvegarde de Sagesse. En cas de réussite, elle n’est pas affectée par le sort.\n\nCréature en créature. Si vous transformez une créature en autre sorte de créature, vous choisissez sa nouvelle forme à votre guise, mais le facteur de puissance de celle-ci ne doit pas dépasser celui de la cible (ou son niveau). Le profil de la cible est remplacé par celui de la nouvelle forme, si ce n’est qu’elle conserve ses points de vie, ses dés de vie, son alignement et sa personnalité. La cible reçoit autant de points de vie temporaires que les points de vie de la nouvelle forme. Ces points de vie temporaires disparaissent s’il en reste à la fin du sort. La cible est limitée dans les actions qu’elle peut entreprendre par l’anatomie de sa nouvelle forme, et elle ne peut ni parler ni lancer de sorts. L’équipement porté par la cible se fond dans sa nouvelle forme. La créature ne peut pas utiliser son équipement ni en bénéficier de quelque manière que ce soit.\n\nObjet en créature. Vous pouvez transformer un objet en la créature de votre choix, à condition que la catégorie de taille de celle-ci ne dépasse pas celle de l’objet et que son facteur de puissance n’excède pas 9. La créature est Amicale envers vous et vos compagnons. Au combat, elle joue ses tours juste après les vôtres et se soumet à vos instructions. Si le sort persiste plus d’une heure, vous perdez le contrôle de la créature. Elle est susceptible de rester Amicale à votre égard selon la manière dont vous l’avez traitée.\n\nCréature en objet. Si vous transformez une créature en objet, elle adopte sa nouvelle forme en fusionnant avec tout ce qu’elle porte, à condition que la taille de l’objet n’excède pas celle de la créature. Le profil de la créature devient celui de l’objet et la créature ne garde a posteriori (si le sort prend fin et qu’elle retrouve sa forme normale) aucun souvenir du temps passé sous cette forme.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"mirage","name":"Mirage","level":7,"school":"illusion","castingTime":"10 minutes","range":"champ de vision","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 jours","concentration":false,"ritual":false,"description":"Vous faites en sorte que l’environnement d’une zone carrée de 1,5 km de côté apparaisse différemment sur tous les plans sensoriels. Ainsi, un champ ou une route pourrait se présenter comme un marais, une colline, une crevasse glaciaire ou quelque autre environnement accidenté ou infranchissable. Une mare pourrait apparaître comme une jolie prairie, un précipice comme une pente douce et un ravin comme une route large et dégagée. De même, vous pouvez altérer l’aspect des bâtiments ou en ajouter là où il n’y en a pas.\n\nLe sort ne permet pas de déguiser ni de cacher des créatures, ni d’en ajouter. L’illusion comprend des éléments auditifs, visuels, tactiles et olfactifs, si bien qu’un sol dégagé peut être transformé en Terrain difficile (et vice versa) ou gêner les déplacements dans la zone.\n\nTout élément du terrain illusoire (pierre ou branche, par exemple) retiré de la zone du sort disparaît aussitôt.\n\nLes créatures dotées de la Vision lucide percent l’illusion et perçoivent le véritable environnement. Tous les autres éléments de l’illusion restent toutefois en place, si bien qu’une telle créature, consciente de l’illusion, peut toujours interagir physiquement avec ces éléments.","classes":["bard","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"modification-d-apparence","name":"Modification d’apparence","level":2,"school":"transmutation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous altérez votre forme physique. Choisissez l’une des options suivantes. Les effets persistent pour toute la durée, durant laquelle vous pouvez entreprendre l’action Magie pour changer d’option.\n\nAdaptation aquatique. Vous vous dotez de branchies et vos doigts deviennent palmés. Vous recevez une Vitesse de nage égale à votre Vitesse et pouvez respirer sous l’eau.\n\nArmes naturelles. Vous vous dotez de griffes (dégâts tranchants), de crocs (perforants), de cornes (perforants) ou de sabots (contondants). Lorsque vous recourez à votre attaque à mains nues pour infliger des dégâts avec ces nouveaux appendices, ils infligent 1d6 dégâts quand ils touchent, du type indiqué entre parenthèses, et vous ajoutez votre modificateur de caractéristique d’incantation aux jets d’attaque et de dégâts, au lieu de recourir à la Force.\n\nChangement d’aspect. Vous transformez votre aspect. Vous décidez de votre apparence, notamment de votre taille, votre poids, les traits de votre visage, le timbre de votre voix, la longueur de vos cheveux, votre teint et autres attributs. Vous pouvez vous faire passer pour un membre d’une autre espèce, mais cela n’influe pas sur votre profil de jeu. Vous ne pouvez pas prendre l’aspect d’une créature dont la catégorie de taille est différente de la vôtre et votre structure corporelle doit rester la même ; si vous êtes bipède, vous ne pouvez pas profiter de ce sort pour devenir quadrupède, par exemple. Pour toute la durée du sort, vous pouvez entreprendre l’action Magie pour changer à nouveau votre aspect de cette manière.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"modification-de-memoire","name":"Modification de mémoire","level":5,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous tentez de remodeler les souvenirs d’une autre créature. Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Si vous êtes en train de l’affronter, elle a l’Avantage au JS. En cas d’échec, la cible subit l’état Charmé pour toute la durée. Ainsi Charmée, la cible subit aussi l’état Neutralisé et n’a pas conscience de son environnement, mais elle vous entend toujours. Si elle subit des dégâts ou est la cible d’un autre sort, cette modification de mémoire prend fin et nul souvenir n’est altéré.\n\nTant que persiste ce charme, vous pouvez influer sur un souvenir de la cible ayant eu lieu au cours des 24 dernières heures et ne s’étalant pas sur plus de 10 minutes. Vous pouvez effacer toute mémoire de l’événement, permettre au contraire à la cible de se souvenir parfaitement de l’épisode dans les moindres détails, altérer certains éléments qui y sont liés dans son esprit ou créer de toutes pièces le souvenir d’un autre événement. Vous devez parler à la cible pour lui décrire en quoi sa mémoire est modifiée, sachant qu’elle doit comprendre la langue employée pour que le souvenir s’enracine. Son esprit se charge de combler les lacunes de votre description.\n\nSi le sort prend fin avant que vous ayez fini de décrire les souvenirs modifiés, la mémoire de la créature n’est pas altérée. Sinon, l’altération prend effet quand le sort se termine. Sa mémoire modifiée, la créature ne va pas forcément se comporter différemment, surtout si ces souvenirs vont à l’encontre de ses penchants naturels, de son alignement ou de ses croyances. Si le souvenir implanté est absurde, comme un épisode dans lequel la créature se serait baignée dans l’acide en y prenant plaisir, il sera simplement perçu comme un mauvais rêve. Le MJ peut décider qu’un souvenir modifié est trop contraire à la raison pour affecter la créature. Le sort délivrance des malédictions ou restauration suprême lancé sur la cible lui rend sa mémoire d’origine.\n\nEmplacement de niveau supérieur. Vous pouvez altérer le souvenir d’un événement qui remonte à un maximum de 7 jours (emplacement du 6e niveau), 30 jours (7e), 365 jours (8e) ou à tout moment de son passé (9e).","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"monture-fantome","name":"Monture fantôme","level":3,"school":"illusion","castingTime":"1 minute ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":true,"description":"Une créature chevaline quasi réelle de taille G se manifeste au sol en un espace inoccupé que vous choisissez à portée. Vous décidez de son apparence, sachant qu’elle est équipée d’une selle, de mors et d’une bride. Tout l’équipement créé par le sort disparaît dans une bouffée de fumée si on l’éloigne de plus de 3 m de la monture.\n\nPour toute la durée, vous ou une créature que vous désignez pouvez chevaucher la monture. La monture reprend le profil du cheval de selle (cf. « Monstres »), si ce n’est que sa Vitesse est de 30 m et qu’elle peut couvrir 19,5 km en une heure.\n\nQuand le sort prend fin, la monture s’efface progressivement en laissant à son cavalier 1 minute pour en descendre. Le sort prend fin prématurément si la monture subit le moindre dégât.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-guerison","name":"Mot de guérison","level":1,"school":"abjuration","castingTime":"action Bonus","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La créature de votre choix parmi celles que vous voyez à portée récupère des points de vie : 2d4 + votre modificateur de caractéristique d’incantation. Emplacement de niveau supérieur. Les soins augmentent de 2d4 par niveau d’emplacement au-delà du 1.","classes":["bard","cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-guerison-de-groupe","name":"Mot de guérison de groupe","level":3,"school":"abjuration","castingTime":"action Bonus","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un maximum de six créatures de votre choix parmi celles que vous voyez à portée récupèrent des points de vie : 2d4 + votre modificateur de caractéristique d’incantation. Emplacement de niveau supérieur. Les soins augmentent de 1d4 par niveau d’emplacement au-delà du 3e.","classes":["bard","cleric"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-pouvoir-etourdissant","name":"Mot de pouvoir étourdissant","level":8,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous assaillez l’esprit d’une créature que vous voyez à portée. Si la cible choisie est dotée de 150 points de vie ou moins, elle subit l’état Étourdi. Dans le cas contraire, sa Vitesse tombe à 0 jusqu’au début de votre tour suivant. La cible Étourdie effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours et met un terme à cet état en cas de réussite.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-pouvoir-guerisseur","name":"Mot de pouvoir guérisseur","level":9,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une vague d’énergies de guérison baigne une créature que vous voyez à portée. La cible récupère tous ses points de vie. Si la créature a l’état Charmé, Effrayé, Empoisonné, Étourdi ou Paralysé, cet état prend fin. Si la créature a l’état À terre, elle peut jouer sa Réaction pour se relever.","classes":["bard","cleric"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-pouvoir-mortel","name":"Mot de pouvoir mortel","level":9,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La mort s’impose à une créature que vous voyez à portée. Si la cible choisie est dotée de 100 points de vie ou moins, elle meurt. Dans le cas contraire, elle subit 12d12 dégâts psychiques.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"mot-de-retour","name":"Mot de retour","level":6,"school":"conjuration","castingTime":"action","range":"1,50 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous-même et un maximum de cinq créatures consentantes situées dans un rayon de 1,50 m vous téléportez en un sanctuaire désigné à l’avance. Vous et les créatures téléportées apparaissez dans les espaces inoccupés les plus proches du point désigné quand vous avez préparé votre sanctuaire (voir plus loin).\n\nSi vous lancez ce sort sans avoir préparé de sanctuaire, il est sans effet. Le sanctuaire se désigne au préalable en lançant ce sort en un lieu, tel qu’un temple.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"motif-hypnotique","name":"Motif hypnotique","level":3,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":false,"somatic":true,"material":true,"materialText":"une pincée de confettis"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez un motif animé de couleurs occupant un Cube de 9 m à portée. Le motif apparaît un instant et disparaît aussitôt.\n\nChaque créature prise dans la zone, si elle voit le motif, doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée du sort. Tant qu’elle est ainsi Charmée, la créature subit l’état Neutralisé et sa Vitesse est de 0.\n\nLe sort prend fin pour une créature affectée si elle subit des dégâts ou si quelqu’un d’autre consacre une action à la sortir de son hébétude.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"mur-d-epines","name":"Mur d’épines","level":6,"school":"conjuration","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une poignée d’épines"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez un mur fait d’un enchevêtrement végétal hérissé d’épines acérées. Le mur apparaît à portée sur une surface solide et persiste pour toute la durée. Vous pouvez ainsi ériger un mur dont l’épaisseur n’excède pas 1,50 m ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et haut de 3 m ou moins, et un mur circulaire dont le diamètre et la hauteur ne dépassent pas 6 m. Le mur bloque le champ de vision.\n\nQuand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts perforants en cas d’échec, la moitié en cas de réussite.\n\nUne créature peut se déplacer à travers ces ronces, mais l’opération est lente et douloureuse. Toute distance parcourue à travers le mur lui coûte le quadruple en termes de déplacement. De plus, la première fois d’un tour qu’une créature pénètre dans la haie ou qu’elle y termine son propre tour, elle effectue un jet de sauvegarde de Dextérité et subit 7d8 dégâts tranchants en cas d’échec, la moitié en cas de réussite. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nEmplacement de niveau supérieur. Les dégâts des deux types augmentent de 1d8 par niveau d’emplacement au-delà du 6e.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"mur-de-feu","name":"Mur de feu","level":4,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un morceau de charbon"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez un mur de flammes sur une surface solide à portée. Vous pouvez ainsi ériger un mur dont la hauteur n’excède pas 6 m et l’épaisseur 30 cm ; pour le reste, vous avez le choix entre un mur droit long d’un maximum de 18 m et un mur circulaire dont le diamètre ne dépasse pas 6 m. Ce mur opaque persiste pour toute la durée.\n\nQuand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Dextérité et subit 5d8 dégâts de feu en cas d’échec, la moitié en cas de réussite.\n\nL’un des côtés du mur que vous choisissez à l’incantation du sort inflige 5d8 dégâts de feu à toute créature qui termine son tour à 3 m ou moins de ce côté ou dans le mur. Une créature qui pénètre dans le mur pour la première fois d’un tour ou qui y termine son tour subit ces mêmes dégâts. L’autre côté du mur n’inflige pas de dégâts.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 4e.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mur-de-force","name":"Mur de force","level":5,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un éclat de verre"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Un mur de force invisible se matérialise en un point que vous choisissez à portée. Le mur se présente dans l’orientation de votre choix, horizontal ou vertical, voire complètement de biais. Il peut rester en suspension ou reposer sur une surface solide.\n\nVous pouvez le façonner en dôme hémisphérique ou en globe d’un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 6 mm et persiste pour toute la durée.\n\nSi le mur traverse l’espace d’une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez.\n\nRien ne peut franchir physiquement le mur. Il est immunisé contre tous les dégâts et insensible à dissipation de la magie. Le sort désintégration détruit en revanche le mur instantanément. Ce mur s’étend en outre sur le Plan Éthéré, ce qui empêche le voyage éthéré le traversant.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mur-de-glace","name":"Mur de glace","level":6,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un morceau de quartz"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez un mur de glace sur une surface solide à portée. Vous pouvez le façonner en dôme hémisphérique ou en globe d’un rayon maximal de 3 m, ou en faire une surface plane composée de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Quelle que soit sa forme, le mur est épais de 30 cm et persiste pour toute la durée.\n\nSi le mur traverse l’espace d’une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez et effectue un jet de sauvegarde de Dextérité ; elle subit 10d6 dégâts de froid en cas d’échec, la moitié en cas de réussite.\n\nLe mur est un objet que l’on peut endommager, ce qui permet d’y ouvrir une brèche. Doté d’une CA de 12 et de 30 points de vie par section de 3 m de côté, il bénéficie de l’Immunité contre les dégâts de froid, de poison et psychiques, et subit la Vulnérabilité aux dégâts de feu. Une section de 3 m de côté réduite à 0 point de vie est détruite et laisse une nappe d’air glacial dans l’espace qu’elle occupait. Une créature qui traverse une telle nappe pour la première fois d’un tour effectue un jet de sauvegarde de Constitution et subit 5d6 dégâts de froid en cas d’échec, la moitié en cas de réussite.\n\nEmplacement de niveau supérieur. Les dégâts infligés par le mur à son apparition augmentent de 2d6 et ceux de la nappe d’air glacial de 1d6 par niveau d’emplacement au-delà du 6e.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mur-de-pierre","name":"Mur de pierre","level":5,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un cube de granit"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Un mur non magique de pierre solide se matérialise en un point que vous choisissez à portée. Le mur, épais de 15 cm, se compose de dix pans de 3 m sur 3. Chaque pan doit être contigu avec un autre. Une autre option consiste à créer des pans de 3 m sur 6, épais de seulement 7,5 cm. Si le mur traverse l’espace d’une créature à son apparition, la créature est repoussée du côté du mur que vous choisissez. Si une créature est censée se retrouver cernée par le mur de tous les côtés (ou par le mur et une autre surface solide), elle a droit à un jet de sauvegarde de Dextérité. En cas de réussite, elle peut jouer sa Réaction pour se déplacer dans les limites de sa Vitesse de manière à ne plus être séquestrée par le mur.\n\nLe mur peut prendre toute forme de votre choix, mais il ne peut pas occuper le même espace que des créatures ou des objets. Il n’a pas besoin d’être vertical ni de reposer sur des fondations robustes. Il doit en revanche fusionner avec de la pierre existante, qui doit pouvoir le soutenir. Vous pouvez ainsi recourir à ce sort pour créer un pont qui enjambe un gouffre, ou un plan incliné. Si le pont ainsi créé dépasse 6 m de long, vous devez réduire de moitié la taille de chaque pan de façon à l’étayer. Vous pouvez grossièrement façonner le mur pour produire des remparts ou créneaux.\n\nLe mur est un objet de pierre que l’on peut endommager, ce qui permet d’y ouvrir une brèche. Chaque pan présente une CA de 15 et dispose de 30 points de vie par tranche de 2,5 cm d’épaisseur, et bénéficie de l’Immunité contre les dégâts psychiques et de poison. Un pan réduit à 0 point de vie est détruit, ce qui peut en outre provoquer l’effondrement de pans contigus, à l’appréciation du MJ. Si vous maintenez la Concentration sur ce sort jusqu’au terme de sa durée maximale, le mur devient permanent, sans possibilité de le dissiper. Sans cela, il disparaît quand le sort prend fin.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"mur-de-vent","name":"Mur de vent","level":3,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un éventail et une plume"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un mur de vent fort se dresse depuis le sol en un point que vous choisissez à portée. Vous pouvez ainsi ériger un mur dont la hauteur n’excède pas 4,50 m, la longueur 15 m et l’épaisseur 30 cm. Vous pouvez lui donner la forme de votre choix tant que le mur reste au contact du sol tout du long. Le mur persiste pour toute la durée.\n\nQuand le mur apparaît, chaque créature prise dans sa zone effectue un jet de sauvegarde de Force et subit 4d8 dégâts contondants en cas d’échec, la moitié en cas de réussite.\n\nLe vent fort repousse le brouillard, la fumée et autres gaz et vapeurs. Les créatures et objets volants de taille P ou inférieure ne peuvent pas traverser le mur. Les matériaux légers et libres s’envolent verticalement au contact du mur. Flèches, carreaux d’arbalète et autres projectiles ordinaires tirés sur des cibles situées derrière le mur sont déviés vers le haut et ratent automatiquement. (Les rochers lancés par des Géants et des engins de siège, et les projectiles du même acabit ne sont pas affectés.) Les créatures sous forme gazeuse ne peuvent pas le traverser.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"mur-prismatique","name":"Mur prismatique","level":9,"school":"abjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Un plan multicolore de lueurs chatoyantes s’érige sous forme d’un mur vertical opaque centré sur un point à portée, avec les dimensions maximales suivantes : longueur 27 m, hauteur 9 m et épaisseur 2,5 cm. Vous pouvez au lieu de cela lui donner la forme d’un globe d’un diamètre maximal de 9 m, centré sur un point à portée. Le mur persiste pour toute la durée. Si vous positionnez le mur en un espace occupé par une créature, le sort prend aussitôt fin sans effet.\n\nLe mur produit une Lumière vive sur une distance de 30 m et une Lumière faible sur 30 m de plus. Vous et les créatures que vous désignez à l’incantation du sort pouvez sans risque traverser le mur et rester à proximité. Si une autre créature qui voit le mur s’approche dans un rayon de 6 m de sa zone ou y commence son tour, elle doit réussir un jet de sauvegarde de Constitution sous peine de subir l’état Aveuglé pendant 1 minute.\n\nLe mur est constitué de sept couches, chacune d’une couleur différente. Lorsqu’une créature tente de pénétrer le mur ou de le traverser, elle le fait couche après couche jusqu’à toutes les avoir franchies. Chaque couche contraint la créature à un jet de sauvegarde de Dextérité pour éviter d’être affectée par les propriétés de la couche, décrites dans la table Couches prismatiques.\n\nOn peut détruire le mur (CA 10), couche par couche, de la rouge à la violette, par des moyens propres à chaque couche. Quand une couche est détruite, elle disparaît pour toute la durée. Un champ antimagie reste sans effet sur le mur, tandis que dissipation de la magie n’affecte que la couche violette.\n\nCouches prismatiques Ordre Effets 1 Rouge. Échec au JS : 12d6 dégâts de feu. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques à distance non magiques ne peuvent traverser cette couche, détruite si elle subit au moins 25 dégâts de froid. 2 Orange. Échec au JS : 12d6 dégâts d’acide. JS réussi : 1/2 dégâts. Effets supplémentaires : les attaques à distance magiques ne peuvent traverser cette couche, détruite par un vent fort (comme celui produit par bourrasque). 3 Jaune. Échec au JS : 12d6 dégâts de foudre. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche est détruite si elle subit au moins 60 dégâts de force. Ordre Effets 4 Verte. Échec au JS : 12d6 dégâts de poison. JS réussi : 1/2 dégâts. Effets supplémentaires : le sort passe-muraille, ou un autre sort de niveau supérieur ou égal capable d’ouvrir un portail sur une surface solide, détruit cette couche. 5 Bleue. Échec au JS : 12d6 dégâts de froid. JS réussi : 1/2 dégâts. Effets supplémentaires : la couche est détruite si elle subit au moins 25 dégâts de feu. 6 Indigo. Échec au JS : la cible subit l’état Entravé et effectue un jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois, l’état prend fin. Si elle rate trois fois le JS, elle subit l’état Pétrifié jusqu’à en être libérée par un effet tel que restauration suprême. Ces réussites et échecs n’ont pas besoin d’être consécutifs ; notez-les quelque part, jusqu’à ce que la cible atteigne un total de trois pour l’un ou l’autre. Effets supplémentaires : les sorts ne peuvent pas traverser cette couche, détruite par la Lumière vive du sort lumière du jour. 7 Violette. Échec au JS : la cible subit l’état Aveuglé et effectue un jet de sauvegarde de Sagesse au début de votre tour suivant. En cas de réussite, l’état prend fin. En cas d’échec, l’état prend fin, et la créature est téléportée dans un autre plan d’existence (choisi par le MJ). Effets supplémentaires : dissipation de la magie détruit cette couche.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"murmures-dissonants","name":"Murmures dissonants","level":1,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une créature que vous choisissez parmi celles que vous voyez à portée perçoit intérieurement une mélodie discordante. La cible effectue un jet de sauvegarde de Sagesse. Elle subit 3d6 dégâts psychiques en cas d’échec et doit aussitôt jouer sa Réaction si disponible pour s’éloigner de vous autant qu’elle le peut, par le chemin le plus sûr. En cas de réussite, la cible subit uniquement la moitié de ces dégâts.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 1.","classes":["bard"],"source":"SRD 5.2.1"},{"canonicalId":"mythes-et-legendes","name":"Mythes et légendes","level":5,"school":"divination","castingTime":"10 minutes","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de l’encens d’une valeur minimale de 250 po, que le sort détruit, et quatre lamelles d’ivoire d’une valeur minimale de 50 po chacune"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Nommez ou décrivez un élément notoire : personne, lieu ou objet. Le sort vous fait prendre brièvement conscience d’un fait important (décrit par le MJ) concernant l’élément mentionné. Cette bribe de savoir peut consister en des détails essentiels, des révélations cocasses, voire quelque secret toujours resté méconnu.\n\nPlus vous en savez déjà sur l’élément, plus précises et détaillées seront les informations transmises. Les détails révélés sont justes, mais sont parfois formulés de manière imagée ou par le biais de vers (à l’appréciation du MJ).\n\nSi l’élément retenu n’est pas véritablement notoire, vous n’entendez que quelques notes tristes de trombone et le sort prend fin.","classes":["bard","cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"nappe-de-brouillard","name":"Nappe de brouillard","level":1,"school":"conjuration","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous créez une Sphère de 6 m de rayon constituée de brouillard, centrée sur un point à portée. La Sphère présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu’un vent fort (comme celui engendré par bourrasque) la disperse. Emplacement de niveau supérieur. Le rayon du brouillard augmente de 6 m par niveau d’emplacement au-delà du 1.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"nuage-incendiaire","name":"Nuage incendiaire","level":8,"school":"conjuration","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un nuage tourbillonnant de fumée se manifeste, chargé de flammèches, sous forme d’une Sphère de 6 m de rayon centrée sur un point à portée. La zone du nuage présente une Visibilité nulle. Elle persiste pour toute la durée, à moins qu’un vent fort (comme celui engendré par bourrasque) la disperse.\n\nChaque créature prise dans le nuage à son apparition effectue un jet de sauvegarde de Dextérité et subit 10d8 dégâts de feu en cas d’échec, la moitié en cas de réussite. Toute créature qui voit la Sphère se déplacer dans son espace, ou qui pénètre dans la Sphère ou y termine son tour, est également soumise à ce JS. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"nuage-nauseabond","name":"Nuage nauséabond","level":3,"school":"conjuration","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un oeuf pourri"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez une Sphère d’un rayon de 6 m remplie de vapeurs nauséeuses jaunes, centrée sur un point à portée. Le nuage présente une Visibilité nulle. Le nuage flotte sur place pour toute la durée, à moins qu’un vent fort (comme celui engendré par bourrasque) le disperse.\n\nChaque créature qui commence son tour dans la Sphère doit réussir un jet de sauvegarde de Constitution sous peine de subir l’état Empoisonné jusqu’à la fin du tour en cours. Ainsi Empoisonnée, la créature ne peut pas entreprendre d’action ni d’action Bonus.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"nuee-de-meteores","name":"Nuée de météores","level":9,"school":"evocation","castingTime":"action","range":"1,5 km","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Des orbes embrasés s’abattent au sol en quatre points différents que vous voyez à portée. Toute créature prise dans une Sphère d’un rayon de 12 m centrée sur l’un des quatre points effectue un jet de sauvegarde de Dextérité. Une créature subit 20d6 dégâts de feu et 20d6 dégâts contondants en cas d’échec, la moitié en cas de réussite.\n\nUne créature prise dans les zones de plus d’une Sphère ardente n’est affectée qu’une fois. Un objet non magique qui n’est porté par personne subit lui aussi les dégâts s’il est dans la zone d’effet du sort, et il s’embrase s’il est inflammable.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"oeil-du-mage","name":"OEil du mage","level":4,"school":"divination","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une touffe de poils de chauve-souris"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous créez un oeil invulnérable et Invisible à portée, qui flotte dans les airs pour toute la durée. Vous recevez mentalement des informations visuelles transmises par l’oeil, qui voit dans toutes les directions. Il dispose en outre de la Vision dans le noir sur 9 m.\n\nPar une action Bonus, vous pouvez déplacer l’oeil d’un maximum de 9 m dans la direction de votre choix. Un obstacle solide bloque les déplacements de l’oeil, mais celui-ci peut se glisser dans un interstice d’une largeur minimale de 2,5 cm.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"orbe-chromatique","name":"Orbe chromatique","level":1,"school":"evocation","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 50 po"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez un orbe d’énergie sur une cible à portée. Choisissez une énergie entre acide, feu, foudre, froid, poison et tonnerre pour composer l’orbe, puis effectuez un jet d’attaque de sort à distance contre la cible. Si l’attaque touche, la cible subit 3d8 dégâts du type retenu.\n\nSi vous obtenez le même nombre sur au moins deux des d8, l’orbe rebondit vers une autre cible de votre choix dans un rayon de 9 m de la cible. Effectuez un jet d’attaque contre la nouvelle cible et un nouveau jet de dégâts. L’orbe ne rebondit pas une deuxième fois, sauf si vous avez lancé le sort par un emplacement du 2e niveau ou supérieur.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 1. L’orbe est susceptible de rebondir autant de fois que le niveau de l’emplacement dépensé, une même créature ne pouvant être ciblée qu’une fois par incantation du sort.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"orientation","name":"Orientation","level":6,"school":"divination","castingTime":"1 minute","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"des accessoires de divination, comme des cartes ou des runes, d’une valeur minimale de 100 po"},"duration":"Concentration, jusqu’à 1 jour","concentration":true,"ritual":false,"description":"Vous trouvez magiquement le chemin le plus direct jusqu’à un lieu que vous nommez. Vous devez connaître cet endroit et le sort échoue si le lieu nommé est sur un autre plan d’existence, est une destination mobile (comme une forteresse en mouvement) ou un endroit générique (comme « l’antre d’un dragon vert »).\n\nPour toute la durée et tant que vous êtes sur le même plan d’existence que la destination, vous savez quelle distance vous en sépare et dans quelle direction elle se trouve. Chaque fois que vous avez le choix entre plusieurs itinéraires, vous savez automatiquement lequel est le plus direct.","classes":["bard","cleric","druid"],"source":"SRD 5.2.1"},{"canonicalId":"parole-divine","name":"Parole divine","level":7,"school":"evocation","castingTime":"action Bonus","range":"9 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous prononcez une parole porteuse de la puissance des Plans Supérieurs. Chaque créature que vous choisissez à portée effectue un jet de sauvegarde de Charisme. En cas d’échec, une cible dotée de 50 points de vie ou moins subit un effet qui dépend de ses points de vie actuels, comme indiqué sur la table Effets de parole divine.\n\nQuels que soient ses points de vie actuels, une cible Céleste, Élémentaire, Fée ou Fiélon qui rate son JS est renvoyée d’office dans son plan d’origine (s’il ne s’y trouve pas déjà) et ne peut revenir sur votre plan actuel pendant 24 heures, sauf par le biais du sort souhait.\n\nEffets de parole divine Points de vie Effet 0–20 La cible meurt. 21–30 La cible subit les états Assourdi, Aveuglé et Étourdi pendant 1 heure. 31–40 La cible subit les états Assourdi et Aveuglé pendant 10 minutes. 41–50 La cible subit l’état Assourdi pendant 1 minute.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"passage-par-les-arbres","name":"Passage par les arbres","level":5,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous recevez la faculté d’entrer dans un arbre et de vous y déplacer pour atteindre un autre arbre du même type distant d’un maximum de 150 m. Les deux arbres doivent être vivants et d’une catégorie de taille supérieure ou égale à la vôtre. Entrer dans un arbre nécessite d’y consacrer 1,50 m de déplacement.\n\nVous prenez aussitôt conscience de la position de tous les autres arbres de la même essence dans un rayon de 150 m et, lors du déplacement qui vous permet de pénétrer dans l’arbre, vous avez alors le choix entre passer dans l’un de ces arbres ou ressortir par celui dans lequel vous venez d’entrer. Si vous consacrez 1,50 m de déplacement supplémentaire, vous apparaissez à l’endroit de votre choix dans un rayon de 1,50 m de l’arbre de destination. S’il ne vous reste aucun déplacement, vous réapparaissez dans un rayon de 1,50 m de l’arbre de départ.\n\nVous ne pouvez utiliser cette faculté de transport qu’une seule fois à chacun de vos tours. Vous devez terminer chaque tour à l’extérieur d’un arbre.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"passage-sans-trace","name":"Passage sans trace","level":2,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"les cendres d’une feuille de gui calcinée"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous projetez pour toute la durée une aura de camouflage sous forme d’une Émanation de 9 m. Pour toute la durée, chaque créature que vous désignez dans un rayon de 9 m (y compris vous) bénéficie d’un bonus de +10 aux tests de Dextérité (Discrétion) et ne laisse pas de traces.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"passe-muraille","name":"Passe-muraille","level":5,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de graines de sésame"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Un passage se forme en un point que vous voyez sur une surface de bois, de plâtre ou de pierre (comme un mur, un plafond ou un sol) à portée, et persiste pour toute la durée. Vous choisissez les dimensions de l’ouverture : jusqu’à 1,50 m de large, 2,40 m de haut et 6 m de profondeur. Le passage n’engendre aucune instabilité dans la structure qui l’entoure.\n\nLorsque le passage disparaît, tous les objets et créatures qui s’y trouvent encore sont éjectés sans heurt dans les espaces inoccupés les plus proches de la surface affectée.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"pattes-d-araignee","name":"Pattes d’araignée","level":2,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de bitume et une araignée"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Jusqu’à la fin du sort, une créature consentante que vous touchez reçoit la capacité de se déplacer dans toutes les directions le long des surfaces verticales, ainsi que sur les plafonds, tout en gardant les mains libres. La cible acquiert en outre une Vitesse d’escalade égale à sa Vitesse.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 2e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"peau-d-ecorce","name":"Peau d’écorce","level":2,"school":"transmutation","castingTime":"action Bonus","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une poignée d’écorce"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez une créature consentante. Jusqu’à la fin du sort, la peau de la cible adopte un aspect d’écorce et sa classe d’armure passe à 17 si elle est inférieure à cette valeur.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"peau-de-pierre","name":"Peau de pierre","level":4,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de diamant d’une valeur minimale de 100 po, que le sort détruit"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Jusqu’à la fin du sort, une créature consentante que vous touchez physiquement a la Résistance aux dégâts contondants, perforants et tranchants.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"petite-hutte","name":"Petite hutte","level":3,"school":"evocation","castingTime":"1 minute ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une bille de cristal"},"duration":"8 heures","concentration":false,"ritual":true,"description":"Une Émanation de 3 m se manifeste autour de vous, mais reste sur place pour toute la durée. Le sort échoue à l’incantation si l’Émanation ne suffit pas à englober toutes les créatures de sa zone.\n\nLes créatures et objets situés dans l’Émanation à l’incantation peuvent s’y déplacer librement, y entrer et en sortir. Tous les autres objets et créatures ne peuvent le traverser. Les sorts du 3e niveau et inférieur ne peuvent franchir l’Émanation et leurs effets ne peuvent la chevaucher.\n\nL’atmosphère à l’intérieur de l’Émanation est sèche et agréable, quel que soit le temps à l’extérieur. Jusqu’à la fin du sort, vous pouvez rendre l’intérieur faiblement éclairé ou enténébré, sur commande (pas d’action requise). L’Émanation est opaque depuis l’extérieur, de la couleur de votre choix, mais elle est transparente depuis l’intérieur.\n\nLe sort prend fin prématurément si vous quittez l’Émanation ou si vous le lancez à nouveau.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"petrification","name":"Pétrification","level":6,"school":"transmutation","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une plume de cockatrice"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous tentez de transformer en pierre une créature que vous voyez à portée. La cible effectue un jet de sauvegarde de Constitution. En cas d’échec, elle subit l’état Entravé pour toute la durée. En cas de réussite, sa vitesse tombe à 0 jusqu’au début de votre tour suivant. Les Artificiels réussissent automatiquement ce JS.\n\nUne créature ainsi Entravée réitère le jet de sauvegarde de Constitution à la fin de chacun de ses tours. Si elle se sauvegarde trois fois contre le sort, celui-ci prend fin. Si elle rate son JS trois fois, elle se transforme en pierre et reste soumise à l’état Pétrifié pour toute la durée. Ces réussites et échecs n’ont pas besoin d’être consécutifs ; notez-les quelque part, jusqu’à ce que la cible atteigne un total de trois pour l’un ou l’autre.\n\nSi vous maintenez votre Concentration sur ce sort pendant toute la durée possible, la cible est Pétrifiée jusqu’à ce que l’état soit éliminé par restauration suprême ou une magie équivalente.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"portail","name":"Portail","level":9,"school":"conjuration","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 5 000 po"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous invoquez un portail reliant un espace inoccupé que vous voyez à portée à un lieu précis sur un autre plan d’existence. Le portail se présente comme une ouverture circulaire dont le diamètre peut aller de 1,50 m à 6 m. Vous l’orientez dans la direction de votre choix. Le portail persiste pour toute la durée, sa destination étant visible par l’ouverture.\n\nLe portail est doté d’une face avant et d’une face arrière, sur chaque plan où il apparaît. Emprunter le portail n’est possible que si on le franchit par sa face avant. Tout ce qui le franchit ainsi est aussitôt transporté sur l’autre plan, pour apparaître dans l’espace inoccupé le plus proche du portail.\n\nLes divinités et autres souverains planaires peuvent empêcher les portails engendrés par ce sort de s’ouvrir en leur présence, voire où que ce soit en leur domaine.\n\nÀ l’incantation du sort, vous pouvez prononcer le nom d’une créature donnée (un pseudonyme, un titre ou un surnom ne suffisent pas). Si cette créature se trouve sur un plan autre que celui que vous occupez, le portail s’ouvre à proximité de la créature nommée et la transporte jusqu’à l’espace inoccupé le plus proche du portail, sur votre plan. Vous n’avez nulle emprise particulière sur la créature, qui est libre d’agir à l’appréciation du MJ. Elle peut ainsi s’en aller, vous attaquer ou vous aider.","classes":["cleric","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"porte-dimensionnelle","name":"Porte dimensionnelle","level":4,"school":"conjuration","castingTime":"action","range":"150 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous vous téléportez en un lieu à portée. Vous arrivez précisément à l’endroit désiré. Il peut s’agir d’un lieu que vous voyez, que vous visualisez ou dont vous pouvez spécifier la distance et la direction, comme « 60 m directement en contrebas » ou « en montant vers le nord-ouest à 45 degrés sur 90 m ».\n\nVous pouvez aussi téléporter une créature consentante. Celle-ci doit se trouver dans un rayon de 1,50 m de vous quand vous vous téléportez, et réapparaît dans un rayon de 1,50 m de votre espace de destination.\n\nSi le sort est censé vous transporter (ou l’autre créature) en un lieu déjà occupé par une créature ou complètement obstrué par un ou plusieurs objets, vous et toute créature qui vous accompagne subissez chacun 4d6 dégâts de force et le sort ne vous téléporte pas.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"possession","name":"Possession","level":6,"school":"necromancy","castingTime":"1 minute","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"gemme, cristal ou reliquaire d’une valeur minimale de 500 po"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Votre corps sombre en catatonie tandis que votre âme le quitte pour pénétrer dans le récipient ayant servi de composante matérielle au sort. Tant que votre âme occupe ce contenant, vous restez conscient de l’environnement comme si vous occupiez l’espace du récipient. Vous ne pouvez pas vous déplacer ni jouer de Réactions. La seule action que vous puissiez entreprendre consiste à projeter votre âme à une distance maximale de 30 m du récipient, soit en reprenant possession de votre corps (ce qui met un terme au sort), soit en tentant de posséder un autre corps Humanoïde.\n\nVous pouvez tenter de posséder tout Humanoïde dans un rayon de 30 m de vous, à condition de le voir (les créatures protégées par le sort cercle magique ou protection contre le mal et le bien ne peuvent pas être possédées). La cible effectue un jet de sauvegarde de Charisme. En cas d’échec, votre âme se transporte dans le corps de la cible et l’âme de celle-ci se retrouve séquestrée dans le récipient. En cas de réussite, la cible résiste à votre tentative de possession et vous devez attendre 24 heures pour essayer à nouveau de la posséder.\n\nUne fois que vous possédez le corps d’une créature, vous la contrôlez. Vos points de vie et dés de vie, vos valeurs de Force, Dextérité et Constitution, votre Vitesse et vos sens sont remplacés par ceux de la créature. Vous conservez pour le reste votre profil. De son côté, l’âme de la créature possédée peut percevoir l’environnement depuis le récipient en usant de ses propres sens, mais elle ne peut pas se déplacer et subit l’état Neutralisé. Tant que vous possédez un corps, vous pouvez entreprendre l’action Magie pour quitter le corps hôte et retourner dans le récipient si celui-ci se trouve dans un rayon de 30 m, l’âme de la créature hôte retrouvant alors son corps.\n\nSi le corps hôte meurt alors que vous le possédez, la créature meurt et vous effectuez un jet de sauvegarde de Charisme contre votre propre DD de sauvegarde des sorts. En cas de réussite, vous retournez dans le récipient si celui-ci se trouve dans un rayon de 30 m. Dans le cas contraire, vous mourez. Si le contenant est détruit ou si le sort prend fin, votre âme retrouve votre corps. Si votre corps est distant de plus de 30 m de vous ou s’il est « mort », vous mourez. Si l’âme d’une autre créature occupe le récipient lorsqu’il est détruit, l’âme de celle-ci retrouve son corps s’il est vivant et dans un rayon de 30 m d’elle. Sans cela, la créature meurt. Le récipient est détruit quand le sort prend fin.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"premeditation","name":"Préméditation","level":6,"school":"abjuration","castingTime":"10 minutes","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une statuette en ivoire incrustée de gemmes, à votre image, d’une valeur minimale de 1 500 po"},"duration":"10 jours","concentration":false,"ritual":false,"description":"Choisissez un sort du 5e niveau ou inférieur que vous pouvez lancer, dont le temps d’incantation est d’une action et qui peut vous cibler. Vous lancez le sort concerné, qu’on appellera « sort prémédité », dans le cadre de l’incantation de préméditation, et acquittez les emplacements des deux sorts. Le sort prémédité n’agit toutefois pas aussitôt. Au lieu de cela, il ne prendra effet que lorsqu’un déclencheur précis se présentera. Vous décrivez ce déclencheur à l’incantation des deux sorts.\n\nExemple : une préméditation lancée en conjonction avec respiration aquatique pourrait stipuler que respiration aquatique prendra effet lorsque vous serez englouti par les eaux ou un liquide comparable.\n\nLe sort prémédité prend effet aussitôt après que les conditions sont réunies pour la première fois, que vous le vouliez ou non, puis la préméditation prend fin. Le sort prémédité ne prend effet que sur vous, même s’il est susceptible d’avoir d’autres cibles en temps normal.\n\nVous ne pouvez recourir qu’à un sort de préméditation à la fois. Si vous relancez ce sort, la préméditation qui vous affectait déjà prend fin. La préméditation prend également fin si sa composante matérielle n’est plus sur vous.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"premonition","name":"Prémonition","level":9,"school":"divination","castingTime":"1 minute","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une plume de colibri"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature consentante pour lui octroyer la faculté d’entrevoir l’avenir immédiat. Pour toute la durée, la cible a l’Avantage aux Tests d20 et les autres créatures subissent le Désavantage aux jets d’attaque contre elle. Le sort prend fin prématurément si vous le relancez.","classes":["bard","druid","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"priere-de-guerison","name":"Prière de guérison","level":2,"school":"abjuration","castingTime":"10 minutes","range":"9 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Un maximum de cinq créatures que vous choisissez parmi celles qui restent à portée pendant toute l’incantation reçoivent les bénéfices d’un Repos court et récupèrent chacune 2d8 points de vie. Une créature qui profite de ce sort doit terminer un Repos long pour pouvoir en profiter à nouveau. Emplacement de niveau supérieur. Les soins augmentent de 1d8 par niveau d’emplacement au-delà du 2e.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"projectile-magique","name":"Projectile magique","level":1,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous créez trois traits de force magique et scintillante. Chaque projectile heurte une créature de votre choix parmi celles que vous voyez à portée. Un projectile inflige 1d4 + 1 dégâts de force à sa cible. Les traits frappent tous simultanément, sachant que vous pouvez viser une seule créature ou plusieurs.\n\nEmplacement de niveau supérieur. Le sort produit un trait supplémentaire par niveau d’emplacement au-delà du 1.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"projection-astrale","name":"Projection astrale","level":9,"school":"necromancy","castingTime":"1 heure","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"pour chaque cible affectée, une hyacinthe d’une valeur minimale de 1 000 po et un lingot d’argent ouvragé d’une valeur minimale de 100 po, composantes que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":false,"description":"Vous et un maximum de huit créatures consentantes à portée projetez vos corps astraux dans le Plan Astral (le sort prend aussitôt fin si vous occupez déjà ce plan). Le corps abandonné par chaque cible reçoit l’état Inconscient, dans un état d’animation suspendue ; il n’a pas besoin de s’alimenter ni de respirer et ne vieillit pas.\n\nLe corps astral d’une cible ressemble en tout point à sa forme mortelle et reprend son profil de jeu, ainsi que ses biens. La différence principale réside dans l’ajout d’une cordelette d’argent qui part d’un point entre les omoplates de la forme astrale. Ce lien n’est plus visible au bout de 30 cm. Si la cordelette est sectionnée, ce qui ne peut arriver que lorsqu’un effet le mentionne spécifiquement, le corps de la cible et la forme astrale meurent aussitôt.\n\nLa forme astrale d’une cible peut voyager dans le Plan Astral. Dès qu’une forme astrale quitte ce plan, le corps de la cible et ses biens remontent le long de la corde argentée, et la cible reprend possession de son corps sur le nouveau plan. Tous les dégâts et effets qui s’appliquent à une forme astrale ne concernent aucunement le corps physique de la cible, et réciproquement.\n\nSi le corps d’origine d’une cible ou sa forme astrale tombe à 0 point de vie, le sort prend fin pour elle. Le sort prend fin pour toutes les cibles si vous consacrez l’action Magie à le révoquer. Quand le sort prend fin pour une cible qui n’est pas morte, celle-ci réapparaît dans son corps et émerge de son animation suspendue.","classes":["cleric","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"protection-contre-l-energie","name":"Protection contre l’énergie","level":3,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Pour toute la durée, la créature consentante que vous touchez bénéficie de la Résistance à un type de dégâts de votre choix entre : acide, feu, foudre, froid et tonnerre.","classes":["cleric","druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"protection-contre-la-mort","name":"Protection contre la mort","level":4,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous touchez une créature pour la préserver de la mort. La première fois que la cible est censée tomber à 0 point de vie avant la fin du sort, elle se retrouve en fait à 1 point de vie, puis le sort prend fin.\n\nSi ce sort est toujours actif alors que la cible est soumise à un effet censé la tuer sur le coup sans lui infliger de dégâts, cet effet est annulé en ce qui la concerne, et le sort prend fin.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"protection-contre-le-mal-et-le-bien","name":"Protection contre le mal et le bien","level":1,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une flasque d’eau bénite d’une valeur minimale de 25 po, que le sort détruit"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Jusqu’à la fin du sort, une créature consentante que vous touchez physiquement est protégée contre les créatures des types suivants : Aberrations, Célestes, Élémentaires, Fées, Fiélons et Morts-vivants.\n\nCette protection octroie plusieurs bénéfices. Les créatures concernées ont le Désavantage aux jets d’attaque contre la cible. Elles ne peuvent pas posséder la cible, ni lui infliger les états Charmé et Effrayé. Si la cible est déjà Charmée, Effrayée ou possédée par une telle créature, elle a l’Avantage aux nouveaux jets de sauvegarde contre l’effet correspondant.","classes":["cleric","druid","wizard","warlock","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"protection-contre-le-poison","name":"Protection contre le poison","level":2,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez physiquement une créature pour mettre fin sur elle à l’état Empoisonné. Pour toute la durée, la cible a l’Avantage aux jets de sauvegarde pour éviter l’état Empoisonné ou y mettre fin, et bénéficie de la Résistance aux dégâts de poison.","classes":["cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"protections-et-sceaux","name":"Protections et sceaux","level":6,"school":"abjuration","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"sceptre en argent d’une valeur minimale de 10 po"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Vous créez une barrière qui protège un espace au sol d’une surface maximale de 225 mètres carrés. La zone protégée peut atteindre 6 m de haut et se présenter comme une zone carrée de 15 m de côté, cent carrés de 1,50 m de côté ou vingt-cinq carrés contigus de 3 m de côté. À l’incantation du sort, vous pouvez spécifier quels individus ne seront pas affectés par les effets du sort. Vous pouvez également définir un mot de passe immunisant contre ces effets l’individu qui le prononce dans un rayon de 1,50 m de la zone protégée.\n\nLe sort crée les effets ci-après au sein de la zone protégée. Dissipation de la magie n’a en soi aucun effet sur protections et sceaux, mais chacun des effets suivants peut être dissipé. Si ces quatre effets sont dissipés, protections et sceaux prend fin. Si vous lancez quotidiennement ce sort sur la même zone pendant 365 jours, il y persiste jusqu’à ce que tous ses effets soient dissipés.\n\nCouloirs. La brume envahit les couloirs protégés, dans lesquels la Visibilité devient nulle. De plus, à chaque intersection ou embranchement qui présente un choix de direction, toute créature autre que vous a 50 % de chances de croire qu’elle a pris une direction autre que celle qu’elle a réellement empruntée, voire radicalement opposée.\n\nEscaliers. Tous les escaliers de la zone protégée sont envahis de filandres de la première à la dernière marche (équivalent du sort toile d’araignée). Tant que persiste le sort protections et sceaux, cette masse filandreuse se reconstitue en 10 minutes si on la détruit.\n\nPortes. Toutes les portes de la zone protégée sont magiquement verrouillées, comme si elles étaient condamnées par le sort verrou magique. De plus, vous pouvez assortir un maximum de dix portes d’une illusion afin qu’elles passent pour de simples pans de mur.\n\nAutres effets du sort. Appliquez l’un des effets magiques suivants à la zone protégée :\n\n• Lumières dansantes dans quatre couloirs, avec une séquence simple que les lumières répètent tant que persiste protections et sceaux\n\n• Bouche magique en deux endroits\n\n• Nuage nauséabond en deux endroits (les vapeurs se reconstituent en 10 minutes si dispersées tant que persiste protections et sceaux)\n\n• Bourrasque dans un couloir (le vent y souffle de manière continue tant que le sort persiste)\n\n• Suggestion dans un carré de 1,50 m de côté ; toute créature qui pénètre dans ce carré reçoit mentalement la suggestion","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"purification-de-la-nourriture-et-de-l-eau","name":"Purification de la nourriture et de l’eau","level":1,"school":"transmutation","castingTime":"action ou rituel","range":"3 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous purgez de tout poison et pourriture les aliments et boissons non magiques dans une Sphère de 1,50 m de rayon centrée sur un point à portée.","classes":["cleric","druid","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"quete","name":"Quête","level":5,"school":"enchantment","castingTime":"1 minute","range":"18 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"30 jours","concentration":false,"ritual":false,"description":"Vous intimez un ordre verbal à une créature que vous voyez à portée, pour la contraindre à accomplir une tâche ou l’empêcher d’exécuter certains actes que vous définissez. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée du sort. Elle réussit automatiquement ce JS si elle n’est pas en mesure de comprendre votre ordre.\n\nTant que la créature est ainsi Charmée, elle subit 5d10 dégâts psychiques quand elle se conduit directement à l’encontre de vos instructions. Elle ne peut pas subir ces dégâts plus d’une fois par jour.\n\nVous pouvez donner n’importe quel ordre, en dehors d’une tâche dont l’issue serait forcément fatale à la cible. Si l’instruction intimée est suicidaire, le sort prend fin.\n\nLes sorts délivrance des malédictions, restauration suprême et souhait mettent chacun fin à ce sort.\n\nEmplacement de niveau supérieur. Avec un emplacement du 7e ou 8e niveau, la durée est de 365 jours. Avec un emplacement du 9e niveau, le sort persiste jusqu’à ce qu’un des sorts cités plus haut y mette fin.","classes":["bard","cleric","druid","wizard","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"rappel-a-la-vie","name":"Rappel à la vie","level":5,"school":"necromancy","castingTime":"1 heure","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un diamant d’une valeur minimale de 500 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":false,"description":"D’un contact, vous ramenez à la vie une créature qui n’était pas un Mort-vivant quand elle est morte et dont la mort remonte à un maximum de 10 jours. La créature est ramenée à la vie avec 1 point de vie. Ce sort neutralise également tous les poisons qui affectaient la créature au moment de mourir.\n\nCe sort referme toutes les blessures mortelles, mais ne fait pas repousser l’anatomie manquante. Si la créature a perdu une partie de son anatomie ou des organes essentiels à sa survie ; sa tête par exemple, le sort échoue automatiquement.\n\nRevenir d’entre les morts demeure une épreuve. La cible subit un malus de –4 aux Tests d20. Chaque fois qu’elle termine un Repos long, ce malus diminue de 1, jusqu’à ce qu’il tombe à 0.","classes":["bard","cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-affaiblissant","name":"Rayon affaiblissant","level":2,"school":"necromancy","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un rayon débilitant jaillit de vous vers une créature à portée. La cible effectue un jet de sauvegarde de Constitution.\n\nEn cas de réussite, la cible a le Désavantage à son prochain jet d’attaque intervenant avant le début de votre tour suivant.\n\nEn cas d’échec, elle a le Désavantage à tous ses Tests d20 basés sur la Force, pour toute la durée. Tout du long, elle soustrait aussi 1d8 à tous ses jets de dégâts. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort en cas de réussite.","classes":["wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-ardent","name":"Rayon ardent","level":2,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez trois rayons de flammes. Vous pouvez cibler une seule cible à portée ou bien plusieurs. Effectuez une attaque de sort à distance pour chaque rayon. Une attaque qui touche sa cible lui inflige 2d6 dégâts de feu. Emplacement de niveau supérieur. Vous produisez un rayon supplémentaire par niveau d’emplacement au-delà du 2e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"rayon-de-lune","name":"Rayon de lune","level":2,"school":"evocation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une feuille de cocculus"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un large rayon de lueur argentée ténue plonge sous forme d’un Cylindre de 1,50
