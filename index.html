  .ec-evocation    { --ec: #e8734a; }
  .ec-illusion     { --ec: #8b7ce8; }
  .ec-necromancy   { --ec: #6aa84f; }
  .ec-transmutation{ --ec: #e0b357; }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 0 env(safe-area-inset-bottom, 0px);
    background: var(--fond);
    color: var(--texte);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  img { max-width: 100%; }
  [hidden] { display: none !important; }

  /* ---------- Bandeau ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    background: rgba(13, 11, 18, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--bord);
    transition: transform .22s ease;
    will-change: transform;
  }

  /* Le bandeau s'efface quand on descend dans la liste et revient dès qu'on
     remonte : une cinquantaine de pixels rendus au texte des sorts. */
  header.masque { transform: translateY(-100%); }

  .titre-ligne {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  h1 .sceau { color: var(--accent); }

  .compteur {
    font-size: 13px;
    color: var(--texte-faible);
    font-variant-numeric: tabular-nums;
  }

  .compteur b { color: var(--or); font-weight: 600; }

  .rangee-recherche { display: flex; gap: 8px; }

  #recherche {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-creux);
    color: var(--texte);
    font-size: 15px;
  }

  #recherche:focus { outline: 2px solid var(--accent-fonce); outline-offset: 1px; }
  #recherche::placeholder { color: var(--texte-faible); }

  /* ---------- Filtres ---------- */

  .btn {
    padding: 7px 12px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-creux);
    color: var(--texte-doux);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }

  .btn:hover { border-color: var(--accent-fonce); color: var(--texte); }

  #bascule-filtres { white-space: nowrap; }
  #bascule-filtres[aria-expanded="true"] { background: var(--accent-fonce); color: #fff; border-color: var(--accent-fonce); }

  #filtres {
    margin-top: 12px;
    display: grid;
    gap: 14px;
  }

  .groupe > .intitule {
    font-size: 11px;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: var(--texte-faible);
    margin-bottom: 6px;
  }

  .puces { display: flex; flex-wrap: wrap; gap: 6px; }

  .puce {
    padding: 5px 11px;
    border: 1px solid var(--bord);
    border-radius: 999px;
    background: var(--fond-creux);
    color: var(--texte-doux);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }

  .puce:hover { border-color: var(--accent-fonce); color: var(--texte); }

  .puce[aria-pressed="true"] {
    background: var(--accent-fonce);
    border-color: var(--accent);
    color: #fff;
  }

  /* Les écoles prennent leur propre couleur quand elles sont actives. */
  .puce.ecole[aria-pressed="true"] {
    background: color-mix(in srgb, var(--ec) 30%, transparent);
    border-color: var(--ec);
    color: #fff;
  }

  .puce .pastille {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ec);
    margin-right: 6px;
    vertical-align: 1px;
  }

  .rangee-outils {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  select {
    padding: 7px 10px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-creux);
    color: var(--texte);
    font: inherit;
    font-size: 13px;
  }

  /* Sur Windows, la liste déroulante ouverte est rendue par le système :
     sans couleur explicite sur les options, elle sort en texte clair sur
     fond clair, donc illisible. */
  select option { background: #211c2d; color: #ece8f4; }

  #raz { margin-left: auto; }
  #raz[disabled] { opacity: .35; cursor: default; }

  /* ---------- Liste ---------- */

  main { padding: 14px 16px 40px; }

  .sort {
    border: 1px solid var(--bord);
    border-left: 3px solid var(--ec, var(--bord));
    border-radius: var(--rayon);
    background: var(--fond-carte);
    margin-bottom: 8px;
    overflow: hidden;
  }

  .sort-entete {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 13px;
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .sort-entete:hover { background: rgba(185, 139, 255, 0.06); }
  .sort-entete:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .niveau {
    flex: none;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: color-mix(in srgb, var(--ec) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--ec) 45%, transparent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .niveau.mineur { font-size: 15px; }

  .sort-titre { flex: 1; min-width: 0; }

  .sort-nom {
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .sort-sous {
    font-size: 12.5px;
    color: var(--texte-doux);
    margin-top: 2px;
  }

  .etiq {
    font-size: 10.5px;
    letter-spacing: .5px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid;
    font-weight: 600;
    white-space: nowrap;
  }

  .etiq.conc  { color: #ffd479; border-color: #7a5c14; background: #2a2010; }
  .etiq.rit   { color: #8fd7ff; border-color: #17536e; background: #0f2331; }
  .etiq.comp  { color: var(--texte-faible); border-color: var(--bord); background: var(--fond-creux); font-weight: 500; }

  .chevron { flex: none; color: var(--texte-faible); transition: transform .15s; margin-top: 6px; }
  .sort-entete[aria-expanded="true"] .chevron { transform: rotate(90deg); }

  .sort-corps {
    padding: 0 13px 14px;
    border-top: 1px solid var(--bord);
    margin-top: -1px;
  }

  .fiche {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 12px;
    margin: 12px 0 14px;
    font-size: 13.5px;
  }

  .fiche dt { color: var(--texte-faible); }
  .fiche dd { margin: 0; }

  .description p { margin: 0 0 .75em; }
  .description p:last-child { margin-bottom: 0; }

  .classes {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--bord);
    font-size: 12.5px;
    color: var(--texte-doux);
  }

  .vide {
    text-align: center;
    padding: 50px 16px;
    color: var(--texte-faible);
  }

  footer {
    padding: 22px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--bord);
    color: var(--texte-faible);
    font-size: 12px;
    line-height: 1.7;
  }

  footer a { color: var(--texte-doux); }

  /* Écrans larges : deux colonnes de cartes, on gagne beaucoup au défilement. */
  @media (min-width: 1100px) {
    .liste { columns: 2; column-gap: 10px; }
    .sort { break-inside: avoid; }
    .sort.ouvert { column-span: all; }
  }

  /* ---------- Doigt plutôt que souris ----------
     Sous le doigt, une pastille de 26 px se rate une fois sur trois. On vise
     les 44 px recommandés, et on supprime le voile gris du tap Android. */
  @media (pointer: coarse) {
    .puce      { padding: 10px 15px; font-size: 14px; }
    .btn       { padding: 11px 15px; font-size: 14px; }
    select     { padding: 11px 12px; font-size: 14px; }
    #recherche { padding: 12px; font-size: 16px; }  /* 16 px : iOS/Android ne zooment pas */
    .sort-entete { padding: 14px 13px; }
    .niveau    { width: 38px; height: 38px; }
  }

  button, .puce, .sort-entete, a {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ---------- Téléphone ---------- */
  @media (max-width: 560px) {
    header { padding-left: 12px; padding-right: 12px; }
    h1 { font-size: 16px; }
    h1 .suffixe { display: none; }       /* « — hors ligne » : de la place perdue */
    main { padding: 12px 10px 40px; }
    .sort-corps { padding-left: 12px; padding-right: 12px; }
    .groupe > .intitule { margin-bottom: 5px; }
    #filtres { gap: 12px; max-height: 58vh; overflow-y: auto; }
    .rangee-outils select, .rangee-outils #raz { flex: 1 1 100%; }
    #raz { margin-left: 0; }
  }

  /* En dessous, la fiche technique en deux colonnes écrase les valeurs
     longues (le composant matériel fait parfois deux lignes) : on empile. */
  @media (max-width: 480px) {
    .fiche { grid-template-columns: 1fr; gap: 0; }
    .fiche dt {
      margin-top: 9px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .fiche dt:first-child { margin-top: 0; }
  }

  /* ---------- Mes sorts ---------- */

  .onglets { display: flex; gap: 6px; margin-top: 10px; }

  .onglet {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-creux);
    color: var(--texte-doux);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }

  .onglet:hover { border-color: var(--accent-fonce); color: var(--texte); }

  .onglet[aria-selected="true"] {
    background: var(--accent-fonce);
    border-color: var(--accent);
    color: #fff;
  }

  .onglet .nb {
    display: inline-block;
    min-width: 20px;
    padding: 0 5px;
    margin-left: 5px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .28);
    color: var(--or);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .onglet[aria-selected="true"] .nb { color: #fff; }

  /* L'étoile est un bouton à part : elle ne peut pas être imbriquée dans
     l'en-tête, qui est déjà un bouton. D'où la rangée qui les aligne. */
  .sort-haut { display: flex; align-items: flex-start; }
  .sort-haut .sort-entete { flex: 1; min-width: 0; }

  .etoile {
    flex: none;
    width: 42px;
    align-self: stretch;
    padding: 11px 0 0;
    border: 0;
    background: none;
    color: var(--texte-faible);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: color .12s;
  }

  .etoile:hover { color: var(--or); }
  .etoile[aria-pressed="true"] { color: var(--or); }
  .etoile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }

  /* Barre repliée par défaut : sur un téléphone, chaque ligne gagnée en
     haut de liste est une carte de sort visible en plus. */
  .barre-mes {
    margin-bottom: 10px;
    border: 1px dashed var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-carte);
    font-size: 13px;
    color: var(--texte-doux);
  }

  .barre-tete {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: none;
    border: 0;
    border-radius: var(--rayon);
    color: inherit;
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .barre-tete:hover { color: var(--texte); }
  .barre-tete:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .barre-tete .marque { color: var(--or); }
  .barre-tete .chevron { margin: 0 0 0 auto; }
  .barre-tete[aria-expanded="true"] .chevron { transform: rotate(90deg); }

  .barre-outils {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 2px 12px 10px;
  }

  .barre-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  /* Intertitres de regroupement (niveau ou école) dans « Mes sorts ». */
  .section-titre {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 0 7px;
    font-size: 11px;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: var(--texte-doux);
  }

  .section-titre:first-child { margin-top: 0; }
  .section-titre .trait { flex: 1; height: 1px; background: var(--bord); }
  .section-titre .nb { color: var(--texte-faible); letter-spacing: 0; }
  .section-titre .pastille {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ec, var(--bord));
  }

  /* ---------- Export / import ---------- */

  .echange {
    margin-bottom: 10px;
    padding: 12px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-carte);
    font-size: 13px;
    color: var(--texte-doux);
  }

  .echange p { margin: 0 0 9px; }

  .echange textarea {
    width: 100%;
    min-height: 84px;
    padding: 9px 10px;
    border: 1px solid var(--bord);
    border-radius: var(--rayon);
    background: var(--fond-creux);
    color: var(--texte);
    font: 12px/1.45 ui-monospace, "Consolas", monospace;
    resize: vertical;
    word-break: break-all;
  }

  .echange textarea:focus { outline: 2px solid var(--accent-fonce); outline-offset: 1px; }

  .echange-boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
  .echange .msg { margin: 9px 0 0; color: var(--or); min-height: 1.4em; }
  .echange .fermer { margin-left: auto; }

  @media (pointer: coarse) {
    .onglet { padding: 11px 10px; font-size: 14px; }
    .etoile { width: 48px; font-size: 22px; padding-top: 14px; }
    .barre-tete { padding: 10px 12px; font-size: 14px; }
  }

  @media (min-width: 1100px) {
    .section-titre { column-span: all; }
  }

  @media (max-width: 560px) {
    .barre-outils select { flex: 1 1 100%; }
    .barre-actions { margin-left: 0; width: 100%; }
    .barre-actions .btn { flex: 1; }
    .echange .fermer { margin-left: 0; }
  }

  /* ---------- Retour en haut ---------- */
  #haut {
    position: fixed;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--bord);
    background: rgba(33, 28, 45, 0.94);
    color: var(--texte);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s;
    z-index: 20;
  }

  #haut.visible { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="titre-ligne">
    <h1><span class="sceau">✦</span> Sorts D&amp;D 5e <span class="suffixe" style="color:var(--texte-faible);font-weight:400">— hors ligne</span></h1>
    <span class="compteur" id="compteur"></span>
  </div>
  <div class="rangee-recherche">
    <input id="recherche" type="search" placeholder="Chercher un nom, un effet…" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="btn" id="bascule-filtres" aria-expanded="false" aria-controls="filtres">Filtres</button>
  </div>
  <div class="onglets" id="onglets" role="tablist"></div>
  <div id="filtres" hidden></div>
</header>

<main>
  <div class="barre-mes" id="barre-mes" hidden></div>
  <div class="echange" id="echange" hidden></div>
  <div class="liste" id="liste"></div>
  <p class="vide" id="vide" hidden>Aucun sort ne correspond à ces critères.</p>
</main>

<button id="haut" type="button" aria-label="Revenir en haut de la liste">↑</button>

<footer>
  <p>
    <b>339 sorts</b> du <b>SRD 5.2.1</b>, publié par Wizards of the Coast sous licence
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC&nbsp;BY&nbsp;4.0</a>.
    Traduction française relevée sur <a href="https://dd2024.fr/" target="_blank" rel="noopener">dd2024.fr</a>.
  </p>
  <p>Copie personnelle, fonctionne sans connexion. <span id="etat-hors-ligne"></span></p>
</footer>

window.SPELLS = [{"canonicalId":"agrandissement-rapetissement","name":"Agrandissement / Rapetissement","level":2,"school":"transmutation","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de poudre de fer"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Pour toute la durée, le sort agrandit ou rapetisse une créature ou un objet que vous voyez à portée (voir l’effet retenu ci-après). Dans le cas d’un objet, il ne doit être porté par personne. Si la cible est une créature non consentante, elle effectue un jet de sauvegarde de Constitution. En cas de réussite, le sort est sans effet.\n\nTout ce que porte une créature ciblée change également de taille. Tout objet qu’elle lâche retrouve aussitôt sa taille normale. Les armes lancées et les projectiles retrouvent aussi leur taille dès qu’ils ont touché ou raté leur cible.\n\nAgrandissement. La taille de la cible augmente d’une catégorie ; de taille M à G, par exemple. La cible a l’Avantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme agrandie ou à mains nues infligent 1d4 dégâts supplémentaires quand elles touchent.\n\nRapetissement. La taille de la cible diminue d’une catégorie ; de taille M à P, par exemple. La cible subit le Désavantage aux tests de Force et aux jets de sauvegarde de Force. Les attaques que la cible effectue avec une arme rapetissée ou à mains nues infligent 1d4 dégâts de moins quand elles touchent (minimum de 1 dégât).","classes":["bard","druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"aide","name":"Aide","level":2,"school":"abjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une bandelette de tissu blanc"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Choisissez jusqu’à trois créatures à portée. Le maximum de points de vie de chaque cible et ses points de vie actuels augmentent de 5 pour toute la durée. Emplacement de niveau supérieur. Les points de vie de chaque cible augmentent de 5 de plus par niveau d’emplacement au-delà du 2e.","classes":["bard","cleric","druid","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"alarme","name":"Alarme","level":1,"school":"abjuration","castingTime":"1 minute ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une cloche et du fil d’argent"},"duration":"8 heures","concentration":false,"ritual":true,"description":"Vous disposez une alarme contre les intrus. Choisissez une porte, une fenêtre ou une zone à portée dont la taille n’excède pas un Cube de 6 m. Jusqu’à la fin du sort, vous êtes alerté chaque fois qu’une créature touche la zone protégée ou y pénètre.\n\nÀ l’incantation du sort, vous pouvez désigner des créatures qui ne déclencheront pas l’alarme. Vous choisissez également si l’alarme est mentale ou sonore :\n\nAlarme mentale. L’alarme vous alerte par un signal psychique, à condition que vous soyez dans un rayon de 1,5 km de la zone protégée. Si vous dormez, ce signal vous réveille.\n\nAlarme sonore. L’alarme produit le même son qu’une clochette, pendant 10 secondes, audible sur un rayon de 18 m de la zone protégée.","classes":["wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"alienation","name":"Aliénation","level":8,"school":"enchantment","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"l’anneau seul d’un trousseau de clefs"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous assaillez l’esprit d’une créature que vous voyez à portée. La cible effectue un jet de sauvegarde d’Intelligence. En cas d’échec, elle subit 10d12 dégâts psychiques et ne peut pas lancer de sort ni entreprendre l’action Magie.\n\nÀ l’issue de chaque tranche de 30 jours, la cible réitère le JS et met un terme à l’effet en cas de réussite. Les sorts guérison, restauration suprême et souhait mettent également chacun fin à l’effet.\n\nEn cas de réussite, la cible subit uniquement la moitié de ces dégâts.","classes":["bard","druid","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"allie-planaire","name":"Allié planaire","level":6,"school":"conjuration","castingTime":"10 minutes","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous implorez l’assistance d’une entité d’outre-monde. L’être doit vous être familier : un dieu, un prince démon ou toute autre entité de puissance cosmique. Il dépêche un Céleste, un Élémentaire ou un Fiélon parmi ses fidèles pour vous porter assistance, et la créature désignée se matérialise dans un espace inoccupé à portée. Si vous connaissez un nom spécifique de créature, vous pouvez le prononcer à l’incantation du sort pour la solliciter nommément, mais rien ne vous garantit qu’une autre ne sera pas envoyée à sa place (à la discrétion du MJ).\n\nQuand la créature se présente, rien ne la contraint à se comporter d’une manière ou d’une autre. Vous pouvez lui demander d’accomplir un service en contrepartie d’autre chose, mais elle n’est pas tenue d’y consentir. La tâche requise peut aller du simple (fais-nous franchir ce gouffre par les airs ou épaule-nous dans un combat) au plus complexe (espionne nos ennemis ou protège-nous durant notre incursion dans ce donjon). Pour pouvoir négocier les services de la créature, vous devez être en mesure de communiquer avec elle.\n\nLa contrepartie peut prendre diverses formes. Un Céleste pourra requérir une coquette donation d’or ou d’objets magiques à quelque temple allié, tandis qu’un Fiélon exigera par exemple un sacrifice de sang ou le don d’un trésor. Certaines créatures accepteront de vous rendre service en échange d’une quête que vous devrez entreprendre. On peut considérer qu’une tâche qui se mesure en minutes correspond à une rétribution de 100 po par minute. Une tâche qui s’exprime en heures, à 1 000 po de l’heure. Une tâche qui s’étale sur plusieurs jours (jusqu’à un maximum de 10), à 10 000 po par jour. Le MJ peut ajuster ces contreparties selon les circonstances dans lesquelles vous lancez le sort. Si la tâche est en adéquation avec l’éthique de la créature, le paiement pourrait être réduit de moitié, voire dispensé. Les tâches sans risque voient généralement la rétribution réduite de moitié, tandis que les plus dangereuses entraînent des dons bien plus importants. Les créatures n’ont pas pour habitude d’accepter les missions qui s’annoncent suicidaires.\n\nUne fois la tâche accomplie par la créature ou la durée convenue pour le service écoulée, la créature retourne sur son plan d’origine après vous avoir fait son rapport dans la mesure du possible. Si vous ne pouvez convenir d’une rémunération pour les services de la créature, elle repart sans attendre sur son plan d’origine.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"amelioration-de-caracteristique","name":"Amélioration de caractéristique","level":2,"school":"transmutation","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une plume ou une touffe de fourrure"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous touchez physiquement une créature et choisissez entre Force, Dextérité, Intelligence, Sagesse et Charisme. Pour toute la durée, la cible a l’Avantage aux tests de caractéristique associés à la caractéristique retenue.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 2e. Vous pouvez opter pour une caractéristique différente pour chaque cible.","classes":["bard","cleric","druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"amitie-avec-les-animaux","name":"Amitié avec les animaux","level":1,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de nourriture"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Ciblez une Bête que vous voyez à portée. La cible doit réussir un jet de sauvegarde de Sagesse sous peine de subir l’état Charmé pour toute la durée du sort. Si vous ou l’un de vos alliés infligez des dégâts à la cible, le sort prend fin. Emplacement de niveau supérieur. Vous pouvez affecter une Bête supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"animation-des-morts","name":"Animation des morts","level":3,"school":"necromancy","castingTime":"1 minute","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une goutte de sang, un morceau de chair et une pincée de poudre d’os"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Choisissez un tas d’os ou un cadavre à portée, tiré d’un Humanoïde de taille M ou P. La cible devient un Mortvivant : un squelette si vous avez opté pour des os ou un zombi si vous avez choisi un cadavre (profil de la créature à « Monstres »).\n\nÀ chacun de vos tours, vous pouvez consacrer une action Bonus à donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 18 m. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Vous décidez quelle action la créature va entreprendre et où elle se déplacera à son tour suivant, ou pouvez vous contenter de donner une instruction générale, comme garder une salle ou un couloir. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Une fois qu’elle a reçu un ordre, la créature s’y soumet jusqu’à ce que la tâche soit accomplie.\n\nLa créature reste sous votre contrôle pendant 24 heures, après quoi elle cesse d’obéir aux ordres que vous lui avez donnés. Pour en garder le contrôle pendant 24 heures de plus, vous devez relancer ce sort sur lui avant la fin des 24 heures en cours. Relancer le sort ainsi réaffirme votre emprise sur un maximum de quatre créatures que vous avez animées par ce sort, au lieu d’en animer une nouvelle.\n\nEmplacement de niveau supérieur. Vous prenez ou prolongez le contrôle de deux Morts-vivants supplémentaires par niveau d’emplacement au-delà du 3e. Chacune de ces créatures doit être issue d’un tas d’os ou cadavre différent.","classes":["cleric","wizard"],"source":"SRD 5.2.1","summonedMonsters":["squelette","zombi"]},{"canonicalId":"animation-des-objets","name":"Animation des objets","level":5,"school":"transmutation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Les objets s’animent selon vos ordres. Choisissez des objets non magiques à portée qui ne sont portés par personne, ne sont fixés à aucune surface et ne sont pas de taille Gig. Le maximum d’objets que vous pouvez animer est égal à votre modificateur de caractéristique d’incantation ; dans ce cadre, une cible de taille M ou inférieure compte pour un objet, une cible de taille G pour deux et une cible de taille TG pour trois. Chaque cible s’anime, se dote de pattes et devient un Artificiel reprenant le profil de l’objet animé ; la créature reste sous votre contrôle jusqu’à la fin du sort ou qu’elle tombe à 0 point de vie.\n\nChaque créature ainsi créée constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d’Initiative, mais elle joue son tour juste après vous. Jusqu’à la fin du sort, vous pouvez par une action Bonus donner des ordres mentaux à toute créature que vous avez créée par ce sort et qui se trouve dans un rayon de 150 m. Vous pouvez ainsi contrôler plusieurs créatures, en les choisissant, à condition de leur intimer le même ordre. Sans instruction de votre part, la créature entreprend l’action Esquive et ne se déplace que pour éviter les dangers. Quand la créature tombe à 0 point de vie, elle retrouve sa forme de départ, tous les dégâts excédentaires étant répercutés sur celle-ci.\n\nEmplacement de niveau supérieur. Les dégâts de Coup de la créature augmentent de 1d4 (taille M ou inférieure), 1d6 (taille G) ou 1d12 (taille TG) par niveau d’emplacement au-delà du 5e.\n\nObjet animé Artificiel de taille TG ou inférieure, non aligné CA 15 Pv 10 (taille M ou inférieure), 20 (G), 40 (TG) Vitesse 9 m MOD JS MOD JS MOD JS For 16 +3 +3 Dex 10 +0 +0 Con 10 +0 +0 Int 3 −4 −4 Sag 3 −4 −4 Cha 1 −5 −5 Immunités poison, psychiques ; Charmé, Effrayé, Empoisonné, Épuisement, Paralysé Sens Vision aveugle 9 m ; Perception passive 6 Langues comprend les langues que vous parlez FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) Actions Coup. Corps à corps : bonus égal à votre modificateur d’attaque des sorts, allonge 1,50 m. Touché : dégâts de force égaux à 1d4 + 3 (taille M ou inférieure), 2d6 + 3 + votre modificateur de caractéristique d’incantation (G), ou 2d12 + 3 + votre modificateur de caractéristique d’incantation (TG).","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"antidetection","name":"Antidétection","level":3,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une pincée de poudre de diamant d’une valeur minimale de 25 po, que le sort détruit"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Pour toute la durée, vous cachez aux sorts de Divination une cible que vous touchez. La cible doit être une créature consentante, ou un lieu ou objet dont aucune dimension n’excède 3 m. Elle ne peut alors être ciblée par quelque sort de Divination que ce soit, ni perçue par des capteurs de scrutation magique.","classes":["bard","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"apaisement-des-emotions","name":"Apaisement des émotions","level":2,"school":"enchantment","castingTime":"action","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Chaque Humanoïde pris dans une Sphère de 6 m de rayon centrée sur un point que vous choisissez à portée doit réussir un jet de sauvegarde de Charisme, sous peine d’être affecté par l’un des effets suivants (choisissez pour chaque créature) :\n\n• La créature est immunisée contre les états Charmé et Effrayé jusqu’à la fin du sort. Si la créature était déjà Charmée ou Effrayée, ces états sont réprimés pour toute la durée.\n\n• Vous pouvez choisir des créatures envers lesquelles la cible est Hostile ; celle-ci devient indifférente à leur égard. Cette indifférence prend fin si la cible subit des dégâts ou est témoin de dégâts subis par ses alliés.\n\nQuand le sort prend fin, l’attitude de la créature revient à la normale.","classes":["bard","cleric"],"source":"SRD 5.2.1"},{"canonicalId":"apparence-trompeuse","name":"Apparence trompeuse","level":5,"school":"illusion","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous modifiez de manière illusoire l’aspect des créatures de votre choix parmi celles que vous voyez à portée. Une créature non consentante peut effectuer un jet de sauvegarde de Charisme. En cas de réussite, elle n’est pas affectée par le sort. Vous pouvez donner le même aspect à chaque cible ou varier les illusions.\n\nLe sort altère l’aspect du corps des cibles comme de leur équipement. Vous pouvez aussi les faire paraître plus grandes ou plus petites, individuellement, à concurrence de 30 cm, et les faire passer pour plus lourdes ou plus légères. Le nouvel aspect de chaque cible doit présenter la même configuration de membres que la sienne, mais les détails de l’illusion sont pour le reste laissés à votre guise. Le sort persiste pour toute la durée.\n\nLes changements apportés par le sort ne résistent pas à un examen physique. Exemple : si le sort ajoute un chapeau à l’accoutrement d’une créature, ce couvre-chef n’est pas tangible. Une créature peut entreprendre l’action Étude pour examiner une cible et effectuer un test d’Intelligence (Investigation) assorti de votre DD de sauvegarde des sorts. En cas de réussite, elle se rend compte que la cible est déguisée.","classes":["bard","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"appel-de-destrier","name":"Appel de destrier","level":2,"school":"conjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous convoquez un être d’outre-monde qui se présente comme une monture fidèle en un espace inoccupé que vous choisissez à portée. Cette créature reprend le profil de la monture d’outre-monde. Si vous disposez déjà d’une telle monture par le biais de ce sort, elle est remplacée par la nouvelle.\n\nVous choisissez l’aspect de votre monture, un animal que l’on peut monter de taille G, comme un cheval, un chameau, un loup sanguinaire ou un grand cervidé. Chaque fois que vous lancez le sort, choisissez le type de créature de la monture : Céleste, Fée ou Fiélon, qui détermine certains traits du profil.\n\nCombat. La monture constitue un allié pour vous et vos alliés. Au combat, elle partage votre rang d’Initiative et se gère comme une monture contrôlée lorsque vous la chevauchez (comme décrit dans les règles du combat monté). Si vous subissez l’état Neutralisé, la monture joue son tour juste après vous et agit de manière autonome en veillant à vous protéger.\n\nDisparition de la monture. La monture disparaît si elle tombe à 0 point de vie ou si vous mourez. À sa disparition, elle laisse derrière elle tout ce qu’elle portait. Si vous relancez ce sort, vous décidez si vous convoquez la monture disparue ou une autre.\n\nEmplacement de niveau supérieur. Le niveau de l’emplacement de sort s’applique chaque fois que le profil de jeu y fait référence.\n\nMonture d’outre-monde Céleste, Fée ou Fiélon (à votre convenance) de taille G, Neutre CA 10 + 1 par niveau du sort Pv 5 + 10 par niveau du sort (la monture dispose d’un nombre de DV [d10] égal au niveau du sort) Vitesse 18 m, vol 18 m (sort du 4e niveau ou plus) MOD JS MOD JS MOD JS For 18 +4 +4 Dex 12 +1 +1 Con 14 +2 +2 Int 6 −2 −2 Sag 12 +1 +1 Cha 8 −1 −1 Sens Perception passive 11 Langues télépathie 1,5 km (fonctionne uniquement avec vous) FP aucun (PX 0 ; BM égal à votre bonus de maîtrise) Traits Lien vital. Lorsque vous récupérez des points de vie par un sort du 1 niveau ou supérieur, la monture en récupère autant si vous vous trouvez à 1,50 m ou moins d’elle. Actions Coup d’outre-monde. Corps à corps : bonus égal à votre modificateur d’attaque des sorts, allonge 1,50 m. Touché : 1d8 plus le niveau du sort dégâts radiants (Céleste), psychiques (Fée) ou nécrotiques (Fiélon). Actions Bonus Contact guérisseur (Céleste uniquement ; recharge après un Repos long). Une créature dans un rayon de 1,50 m de la monture récupère un nombre de points de vie égal à 2d8 + le niveau du sort. Foulée féerique (Fée uniquement ; recharge après un Repos long). La monture se téléporte avec son cavalier en un espace inoccupé de votre choix dans un rayon de 18 m. Regard fiélon (Fiélon uniquement ; recharge après un Repos long). JS Sagesse : votre DD de sauvegarde des sorts, une créature dans un rayon de 18 m que la monture voit. Échec : la cible subit l’état Effrayé jusqu’à la fin de votre tour suivant.","classes":["paladin"],"source":"SRD 5.2.1","summonedMonsters":["cheval-de-selle","chameau","loup-sanguinaire","grand-cervide"]},{"canonicalId":"appel-de-familier","name":"Appel de familier","level":1,"school":"conjuration","castingTime":"1 heure ou rituel","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"de l’encens qui brûle d’une valeur minimale de 10 po, que le sort détruit"},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous recevez les services d’un familier, esprit qui prend la forme animale de votre choix : Araignée, belette, chat, chauve-souris, chouette, corbeau, faucon, grenouille, lézard, pieuvre, rat ou autre Bête dont le facteur de puissance est de 0. Le familier se présente en un espace inoccupé à portée, avec le profil de jeu de la forme retenue (cf. « Monstres »), si ce n’est qu’il s’agit d’un Céleste, d’une Fée ou d’un Fiélon (à votre convenance) et non d’une Bête. Votre familier agit indépendamment de vous, mais il obéit à vos instructions.\n\nLien télépathique. Tant que votre familier se trouve dans un rayon de 30 m de vous, vous pouvez communiquer avec lui par télépathie. De plus, par une action Bonus, vous pouvez voir par ses yeux et entendre par son ouïe jusqu’au début de votre tour suivant, en bénéficiant de ses éventuels sens spéciaux. Enfin, si vous lancez un sort dont la portée est « contact », votre familier peut appliquer ce contact. Il doit se trouver dans un rayon de 30 m de vous et doit jouer sa Réaction pour appliquer le contact lors de l’incantation.\n\nCombat. Le familier est votre allié, ainsi que celui de vos alliés. Il joue sa propre Initiative et agit à son tour. Un familier ne peut pas attaquer, mais il peut entreprendre normalement d’autres actions.\n\nDisparition du familier. Quand le familier tombe à 0 point de vie, il disparaît. Il réapparaît si vous relancez ce sort. Au prix de l’action Magie, vous pouvez provisoirement révoquer le familier dans une niche dimensionnelle. Vous pouvez également le révoquer à tout jamais. Au prix de l’action Magie, tant qu’il est provisoirement révoqué, vous pouvez le faire réapparaître en un espace inoccupé dans un rayon de 9 m de vous. Quand le familier tombe à 0 point de vie ou disparaît dans une niche dimensionnelle, il laisse tout ce qu’il porte sur lui dans son espace.\n\nUn seul familier. Vous ne pouvez pas disposer de plus d’un familier à la fois. Si vous lancez ce sort alors que vous disposez déjà d’un familier, ce dernier adopte en fait une nouvelle forme adaptée.","classes":["wizard"],"source":"SRD 5.2.1","summonedMonsters":["araignee","belette","chat","chauve-souris","chouette","corbeau","faucon","grenouille","lezard","pieuvre","rat"]},{"canonicalId":"appel-de-la-foudre","name":"Appel de la foudre","level":3,"school":"conjuration","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Un nuage menaçant se présente en un point que vous voyez à portée et qui vous surplombe directement. Il prend la forme d’un Cylindre haut de 3 m pour un rayon de 18 m.\n\nÀ l’incantation du sort, choisissez un point que vous voyez sous le nuage. Un trait de foudre jaillit du nuage vers ce point. Chaque créature située dans un rayon de 1,50 m de ce point effectue un jet de sauvegarde de Dextérité et subit 3d10 dégâts de foudre en cas d’échec, la moitié en cas de réussite.\n\nJusqu’à la fin du sort, vous pouvez entreprendre l’action Magie pour invoquer chaque fois un nouvel éclair, en ciblant le même point ou un autre.\n\nSi vous êtes en extérieur et en conditions orageuses à l’incantation du sort, il vous donne le contrôle de l’orage en cours au lieu d’en créer un. Dans de telles conditions, les dégâts du sort augmentent de 1d10.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 3e.","classes":["druid"],"source":"SRD 5.2.1"},{"canonicalId":"arme-magique","name":"Arme magique","level":2,"school":"transmutation","castingTime":"action Bonus","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous touchez une arme non magique. Jusqu’à la fin du sort, l’arme devient magique, dotée d’un bonus de +1 aux jets d’attaque et aux jets de dégâts. Le sort prend fin prématurément si vous le relancez. Emplacement de niveau supérieur. Le bonus passe à +2 avec un emplacement du 3e, 4e ou 5e niveau. Il passe à +3 avec un emplacement du 6e niveau ou supérieur.","classes":["sorcerer","wizard","paladin","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"arme-spirituelle","name":"Arme spirituelle","level":2,"school":"evocation","castingTime":"action Bonus","range":"18 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous créez une arme spectrale et flottante à l’image de l’arme de votre choix, qui persiste pour toute la durée. L’arme apparaît à portée dans l’espace de votre choix et vous pouvez aussitôt effectuer une attaque de sort au corps à corps contre une créature située dans un rayon de 1,50 m de l’arme. Si l’attaque touche, la cible subit des dégâts de force égaux à 1d8 + votre modificateur de caractéristique d’incantation.\n\nPar une action Bonus à chaque tour consécutif, vous pouvez déplacer l’arme d’un maximum de 6 m et répéter l’attaque contre une créature située dans un rayon de 1,50 m de l’arme.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 2e.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"armure-du-mage","name":"Armure du mage","level":1,"school":"abjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un morceau de cuir traité"},"duration":"8 heures","concentration":false,"ritual":false,"description":"Vous touchez une créature consentante qui ne porte pas d’armure. Jusqu’à la fin du sort, sa CA de base est de 13 plus son modificateur de Dextérité. Le sort prend fin prématurément si la cible enfile une armure.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"arret-du-temps","name":"Arrêt du temps","level":9,"school":"transmutation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous mettez un bref coup d’arrêt à l’écoulement du temps, pour tout le monde sauf vous-même. Le temps s’arrête pour les autres créatures tandis que vous prenez 1d4 +1 tours d’affilée, durant lesquels vous pouvez entreprendre des actions et vous déplacer comme en temps normal.\n\nCe sort prend fin si l’une des actions que vous entreprenez durant l’intervalle, ou l’un des effets créés, affecte une créature autre que vous ou un objet porté par quelqu’un d’autre que vous. Il se termine également si vous vous déplacez en un lieu distant de plus de 300 m de l’endroit où vous l’avez lancé.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"assassin-imaginaire","name":"Assassin imaginaire","level":4,"school":"illusion","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous puisez dans les cauchemars d’une créature que vous voyez à portée pour créer une illusion de ses plus grandes craintes, visible uniquement de la créature.\n\nLa cible effectue un jet de sauvegarde de Sagesse. En cas d’échec, la cible subit 4d10 dégâts psychiques, ainsi que le Désavantage aux tests de caractéristique et aux jets d’attaque pour toute la durée. En cas de réussite, la cible subit la moitié de ces dégâts et le sort prend fin.\n\nPour toute la durée, la cible effectue un JS Sagesse à la fin de chacun de ses tours. En cas d’échec, elle subit de nouveau les dégâts psychiques. En cas de réussite, le sort prend fin.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 4e.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"augure","name":"Augure","level":2,"school":"divination","castingTime":"1 minute ou rituel","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"cartes, os ou bâtonnets gravés spécialement, ou objets divinatoires comparables, d’une valeur minimale de 25 po"},"duration":"instantanée","concentration":false,"ritual":true,"description":"Vous recevez un présage d’une entité surnaturelle vous renseignant sur l’issue d’une opération que vous comptez mener dans les 30 minutes. Le MJ choisit une option de la table Présages :\n\nPrésages Présage Pour une issue qui s’annonce… Fortune favorable Misère défavorable Fortune et misère favorable et défavorable Indifférence ni favorable ni défavorable\n\nLe sort ne tient pas compte des conjonctures qui pourraient peser dans la balance, comme l’incantation de nouveaux sorts.\n\nSi vous lancez le sort plus d’une fois avant de terminer votre prochain Repos long, vous courez dès la deuxième incantation 25 % de risques cumulatifs qu’il ne vous livre aucune réponse.","classes":["cleric","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"aura-de-vie","name":"Aura de vie","level":4,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Une aura rayonne depuis vous pour toute la durée, sous forme d’une Émanation de 9 m. Toute créature alliée comprise dans l’aura (y compris vous) bénéficie de la Résistance aux dégâts nécrotiques et rien ne peut réduire son maximum de points de vie. Si un allié à 0 point de vie commence son tour dans l’aura, il récupère 1 point de vie.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"aura-magique-de-l-arcaniste","name":"Aura magique de l’arcaniste","level":2,"school":"illusion","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un petit carré de soie"},"duration":"24 heures","concentration":false,"ritual":false,"description":"D’un contact, vous placez une illusion sur une créature consentante ou un objet qui n’est porté par personne. Une créature reçoit l’effet Masque, tandis qu’un objet reçoit l’effet Aura factice (voir plus loin). Les effets persistent pour toute la durée.\n\nSi vous lancez ce sort sur une même créature ou un même objet pendant 30 jours consécutifs, l’illusion persiste jusqu’à dissipation.\n\nMasque (créature). Choisissez un type de créature autre que celui de la cible. Les sorts et effets magiques considèrent désormais la cible comme du type retenu.\n\nAura factice (objet). Vous altérez la manière dont la cible se dévoile au gré de sorts et effets magiques qui perçoivent les auras magiques, tels que détection de la magie. Vous pouvez ainsi faire qu’un objet ordinaire paraisse magique, qu’un objet magique paraisse ordinaire, ou modifier l’aura magique d’un objet pour qu’elle soit associée à l’école de magie de votre choix.","classes":["wizard"],"source":"SRD 5.2.1"},{"canonicalId":"aura-sacree","name":"Aura sacrée","level":8,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un reliquaire d’une valeur minimale de 1 000 po"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Pour toute la durée, vous émettez une aura sous forme d’une Émanation de 9 m. Tant qu’elles sont dans l’aura, les créatures que vous choisissez ont l’Avantage aux jets de sauvegarde et les autres ont contre elle le Désavantage aux jets d’attaque.\n\nDe plus, lorsqu’un Fiélon ou un Mort-vivant touche une créature affectée avec un jet d’attaque de corps à corps, l’assaillant doit réussir un jet de sauvegarde de Constitution sous peine de subir l’état Aveuglé jusqu’à la fin de son tour suivant.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"aversion-attirance","name":"Aversion / Attirance","level":8,"school":"enchantment","castingTime":"1 heure","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un mélange de vinaigre et de miel"},"duration":"10 jours","concentration":false,"ritual":false,"description":"À l’incantation, choisissez si le sort produit de l’aversion ou de l’attirance, et ciblez une créature ou un objet de taille TG ou inférieure. Spécifiez alors une catégorie de créatures, comme les dragons rouges, les gobelins ou les vampires. Toute créature de la catégorie désignée effectue un jet de sauvegarde de Sagesse quand elle entre dans un rayon de 36 m de la cible. Ce qui arrive à une telle créature si elle rate son JS dépend de votre choix : attirance ou aversion.\n\nAttirance. La créature subit l’état Charmé. La créature Charmée doit consacrer le déplacement de ses tours à se rapprocher autant que possible de la cible par le chemin le plus sûr. Si la créature se trouve dans un rayon de 1,50 m de la cible, elle ne peut s’en éloigner volontairement. Si la cible inflige des dégâts à la créature Charmée, cette dernière peut réitérer le JS Sagesse pour mettre un terme à l’effet, comme décrit ci-après.\n\nAversion. La créature subit l’état Effrayé. La créature Effrayée doit consacrer le déplacement de ses tours à s’éloigner autant que possible de la cible par le chemin le plus sûr.\n\nMettre fin à l’effet. Une créature ainsi Charmée ou Effrayée qui termine son tour au-delà de 36 m de la cible effectue un jet de sauvegarde de Sagesse. En cas de réussite, la créature n’est plus affectée par la cible. Une créature qui réussit son JS contre cet effet est immunisée contre celui-ci pendant 1 minute, après quoi elle peut de nouveau être affectée.","classes":["bard","druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"bagou","name":"Bagou","level":8,"school":"enchantment","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":false,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Jusqu’à la fin du sort, chaque fois que vous effectuez un test de Charisme, vous pouvez substituer 15 au nombre que vous obtenez sur le dé. De plus, quoi que vous disiez, toute magie censée vérifier que vous ne mentez pas identifie vos paroles comme sincères.","classes":["bard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"baies-nourricieres","name":"Baies nourricières","level":1,"school":"conjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une branche de gui"},"duration":"24 heures","concentration":false,"ritual":false,"description":"Dix baies se matérialisent dans votre main, gorgées de magie pour toute la durée. Une créature peut manger l’une de ces baies par une action Bonus. L’ingestion d’une baie fait récupérer 1 point de vie et fournit l’équivalent d’une journée de sustentation pour une créature. Les baies non consommées disparaissent quand le sort prend fin.","classes":["druid","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"bannissement","name":"Bannissement","level":4,"school":"abjuration","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un pentacle"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Charisme sous peine d’être transportée dans un demi-plan sans danger pour toute la durée. Tant qu’elle y reste, la cible subit l’état Neutralisé.\n\nLorsque le sort prend fin, la cible réapparaît dans l’espace qu’elle avait quitté ou, si celui-ci n’est plus libre, dans l’espace inoccupé le plus proche.\n\nSi la cible est de type Aberration, Céleste, Élémentaire, Fée ou Fiélon, elle ne revient pas si le sort persiste pendant 1 minute. Au lieu de cela, elle est transportée en un lieu aléatoire d’un plan (choisi par le MJ) associé à son type de créature.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 4e.","classes":["cleric","sorcerer","wizard","warlock","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"barriere-de-lames","name":"Barrière de lames","level":6,"school":"evocation","castingTime":"action","range":"27 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez un mur de lames tourbillonnantes d’énergie magique. Le mur apparaît à portée et persiste pour toute la durée. Vous érigez ainsi un mur dont la hauteur n’excède pas 6 m et l’épaisseur 1,50 m ; pour le reste, vous avez le choix entre créer un mur droit long de 30 m au maximum ou un mur circulaire dont le diamètre ne dépasse pas 18 m.\n\nLe mur octroie un Abri supérieur et son espace constitue un Terrain difficile.\n\nToute créature prise dans l’espace du mur effectue un jet de sauvegarde de Dextérité, et subit 6d10 dégâts de force en cas d’échec, la moitié en cas de réussite. Une créature effectue aussi ce JS si elle pénètre dans l’espace du mur ou y termine son tour. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"benediction","name":"Bénédiction","level":1,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un symbole sacré d’une valeur minimale de 5 po"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Vous bénissez jusqu’à trois créatures à portée. Chaque fois qu’une de ces cibles effectue un jet d’attaque ou un jet de sauvegarde avant la fin du sort, elle ajoute 1d4 au résultat correspondant. Emplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"blessure","name":"Blessure","level":1,"school":"necromancy","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":false},"duration":"instantanée","concentration":false,"ritual":false,"description":"La créature que vous touchez physiquement effectue un jet de sauvegarde de Constitution et subit 2d10 dégâts nécrotiques en cas d’échec, la moitié en cas de réussite. Emplacement de niveau supérieur. Les dégâts augmentent de 1d10 par niveau d’emplacement au-delà du 1.","classes":["cleric"],"source":"SRD 5.2.1"},{"canonicalId":"bouche-magique","name":"Bouche magique","level":2,"school":"illusion","castingTime":"1 minute ou rituel","range":"9 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de jade d’une valeur minimale de 10 po, que le sort détruit"},"duration":"jusqu’à dissipation","concentration":false,"ritual":true,"description":"Vous chargez un objet à portée d’un message qui sera prononcé lorsqu’une condition de déclenchement se présentera. Choisissez un objet que vous voyez et qui n’est pas porté par une autre créature. Prononcez alors un message d’un maximum de 25 mots (vous disposez toutefois de 10 minutes pour le peaufiner). Enfin, déterminez les circonstances qui déclencheront la transmission du message par le sort.\n\nQuand cette condition se présente, une bouche magique apparaît sur l’objet et récite le message avec votre voix, au même volume que vous. Si l’objet choisi est lui-même doté d’une ouverture qui peut passer pour une bouche (comme sur une statue d’humanoïde), la bouche magique s’y manifeste et les mots semblent en émaner. À l’incantation du sort, vous pouvez décider que le sort prenne fin après avoir livré son message ou qu’il reste en place et répète son annonce chaque fois que le déclencheur se présente.\n\nLes circonstances de déclenchement peuvent être générales ou détaillées, à votre convenance, mais doivent correspondre à des conditions visuelles ou auditives intervenant dans un rayon de 9 m de l’objet. Vous pourriez ainsi statuer que la bouche s’exprime quand une créature s’approche à 9 m ou moins de l’objet ou quand une cloche d’argent sonne dans ce même rayon.","classes":["bard","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"bouclier","name":"Bouclier","level":1,"school":"abjuration","castingTime":"Réaction, que vous jouez lorsqu’un jet d’attaque vous touche ou que le sort projectile magique vous cible","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 round","concentration":false,"ritual":false,"description":"Une barrière imperceptible de force magique vous protège. Jusqu’au début de votre tour suivant, vous recevez un bonus de +5 à la CA, y compris contre l’attaque qui a déclenché le sort, et vous ne subissez aucun dégât de projectile magique.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"bouclier-de-feu","name":"Bouclier de feu","level":4,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un peu de phosphore ou une luciole"},"duration":"10 minutes","concentration":false,"ritual":false,"description":"Des flammes ondoyantes vous enveloppent pour toute la durée en produisant une Lumière vive dans un rayon de 3 m et une Lumière faible sur 3 m de plus. Les flammes vous procurent un écran chaud ou frais, à votre convenance. Un écran chaud vous octroie la Résistance aux dégâts de froid, un écran frais la Résistance aux dégâts de feu.\n\nDe plus, chaque fois qu’une créature située dans un rayon de 1,50 m de vous vous touche avec un jet d’attaque de corps à corps, les flammes s’attisent brusquement. L’assaillant subit 2d8 dégâts de feu si l’écran est chaud, 2d8 dégâts de froid s’il est frais.","classes":["druid","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"bouclier-de-la-foi","name":"Bouclier de la foi","level":1,"school":"abjuration","castingTime":"action Bonus","range":"18 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"un parchemin de prière"},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Un champ scintillant enveloppe une créature de votre choix à portée et lui octroie un bonus de +2 à la CA pour toute la durée.","classes":["cleric","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"boule-de-feu","name":"Boule de feu","level":3,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une boulette de guano de chauve-souris et de soufre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Une zébrure éblouissante jaillit de vous jusqu’au point que vous choisissez à portée, produisant une déflagration au grondement sourd. Chaque créature prise dans la Sphère de 6 m de rayon centrée sur ce point d’origine effectue un jet de sauvegarde de Dextérité et subit 8d6 dégâts de feu en cas d’échec, la moitié en cas de réussite.\n\nL’explosion embrase les objets inflammables de la zone qui ne sont portés par personne.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 3e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"boule-de-feu-a-retardement","name":"Boule de feu à retardement","level":7,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une boulette de guano de chauve-souris et de soufre"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Un rayon de lumière jaune jaillit de vous pour se condenser en un point que vous choisissez à portée, sous forme d’une bille luisante pour toute la durée. Lorsque le sort prend fin, la bille explose et toute créature prise dans une Sphère de 6 m de rayon centrée sur ce point effectue un jet de sauvegarde de Dextérité. Elle subit des dégâts de feu égaux aux dégâts accumulés en cas d’échec, la moitié en cas de réussite. Les dégâts de base du sort sont de 12d6 et les dégâts augmentent de 1d6 chaque fois que votre tour prend fin tandis que le sort persiste.\n\nSi une créature touche physiquement la bille avant la fin de l’intervalle, elle effectue un jet de sauvegarde de Dextérité. En cas d’échec, le sort prend fin et la bille explose. En cas de réussite, la créature peut projeter la bille d’un maximum de 12 m. Si la bille pénètre dans l’espace d’une créature ou heurte un objet solide, le sort prend fin et la bille explose.\n\nQuand la bille explose, les objets inflammables pris dans la déflagration s’embrasent s’ils ne sont portés par personne.\n\nEmplacement de niveau supérieur. Les dégâts de base augmentent de 1d6 par niveau d’emplacement au-delà du 7e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"bourrasque","name":"Bourrasque","level":2,"school":"evocation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une graine de légumineuse"},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Une Ligne de vent fort longue de 18 m et large de 3 m souffle depuis vous dans la direction de votre choix pour toute la durée.\n\nToute créature prise dans la Ligne doit réussir un jet de sauvegarde de Force sous peine d’être repoussée de 4,50 m de vous selon la direction de la Ligne. Une créature qui termine son tour dans la Ligne est soumise au même JS. Toute créature prise dans la Ligne qui se déplace vers vous doit consacrer le double du déplacement normal pour toute distance parcourue.\n\nLa bourrasque disperse les gaz et vapeurs, éteint les bougies et autres flammes exposées de la zone. Les flammes protégées, comme celles des lanternes, vacillent vigoureusement avec un risque de 50 % de s’éteindre.\n\nPar une action Bonus à vos tours suivants, vous pouvez changer la direction dans laquelle la Ligne jaillit de vous.","classes":["druid","sorcerer","wizard","ranger"],"source":"SRD 5.2.1"},{"canonicalId":"brume-mortelle","name":"Brume mortelle","level":5,"school":"conjuration","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 10 minutes","concentration":true,"ritual":false,"description":"Vous créez une Sphère de 6 m de rayon constituée de brouillard d’un jaune verdâtre, centrée sur un point à portée. La brume persiste pour toute la durée, à moins qu’un vent fort (comme celui engendré par bourrasque) la disperse et mette fin au sort. Sa zone présente une Visibilité nulle.\n\nChaque créature prise dans la Sphère effectue un jet de sauvegarde de Constitution et subit 5d8 dégâts de poison en cas d’échec, la moitié en cas de réussite. Toute créature qui voit la Sphère se déplacer dans son espace, ou qui pénètre dans la Sphère ou y termine son tour est également soumise à ce JS. Une même créature n’effectue en aucun cas ce JS plus d’une fois par tour.\n\nLa Sphère s’éloigne de vous de 3 m au début de chacun de vos tours.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d8 par niveau d’emplacement au-delà du 5e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"cage-de-force","name":"Cage de force","level":7,"school":"evocation","castingTime":"action","range":"30 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre de rubis d’une valeur minimale de 1 500 po, que le sort détruit"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Une prison cubique, immobile et Invisible de force magique se matérialise autour d’une zone que vous choisissez à portée. Il peut s’agir d’une cage ou d’une cellule aux parois pleines, à votre convenance.\n\nUne prison qui se présente comme une cage peut atteindre 6 m par côté. Elle se compose de barreaux de 1,25 cm de diamètre, espacés d’autant. Une prison aux parois pleines peut atteindre 3 m par côté. Ses parois empêchent toute matière d’y pénétrer et bloquent tout sort qui tenterait de les franchir dans un sens ou dans l’autre.\n\nÀ l’incantation du sort, toute créature entièrement comprise dans la zone de la prison s’y retrouve bloquée. Les créatures partiellement comprises dans la zone, ou trop grandes pour y loger, sont écartées du centre de la prison jusqu’à se retrouver entièrement en dehors.\n\nUne créature bloquée dans la prison ne peut en sortir par des moyens non magiques. Si un détenu tente de recourir à la téléportation ou au voyage interplanaire pour s’évader, il effectue d’abord un jet de sauvegarde de Charisme. En cas de réussite, la créature peut se servir de cette magie pour quitter la prison. En cas d’échec, elle ne sort pas de la zone et gaspille l’utilisation du sort ou de l’effet correspondant. La cage de force s’étend en outre dans le Plan Éthéré, ce qui empêche le voyage éthéré. Dissipation de la magie ne permet pas de dissiper ce sort.","classes":["bard","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"caresse-du-vampire","name":"Caresse du vampire","level":3,"school":"necromancy","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":false},"duration":"Concentration, jusqu’à 1 minute","concentration":true,"ritual":false,"description":"Le contact de votre main nimbée d’ombres siphonne l’énergie vitale d’autrui pour refermer vos plaies. Effectuez une attaque de sort au corps à corps contre une créature à portée d’allonge. Si l’attaque touche, la cible subit 3d6 dégâts nécrotiques et vous récupérez autant de points de vie que la moitié des dégâts nécrotiques infligés.\n\nJusqu’à la fin du sort, vous pouvez répéter l’attaque à chacun de vos tours, au prix de l’action Magie, en ciblant la même créature ou une autre.\n\nEmplacement de niveau supérieur. Les dégâts augmentent de 1d6 par niveau d’emplacement au-delà du 3e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"cecite-surdite","name":"Cécité / Surdité","level":2,"school":"transmutation","castingTime":"action","range":"36 m","components":{"verbal":true,"somatic":false,"material":false},"duration":"1 minute","concentration":false,"ritual":false,"description":"Une créature que vous voyez à portée doit réussir un jet de sauvegarde de Constitution, sous peine de subir l’état Assourdi ou Aveuglé (vous choisissez) pour toute la durée. La cible réitère le JS à la fin de chacun de ses tours et met un terme au sort sur elle-même en cas de réussite.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 2e.","classes":["bard","cleric","sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"cercle-de-mort","name":"Cercle de mort","level":6,"school":"necromancy","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une perle noire d’une valeur minimale de 500 po réduite en poudre"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Des ondes d’énergie négative rayonnent sous forme d’une Sphère de 18 m de rayon centrée sur un point que vous choisissez à portée. Chaque créature prise dans la zone effectue un jet de sauvegarde de Constitution et subit 8d8 dégâts nécrotiques en cas d’échec, la moitié en cas de réussite. Emplacement de niveau supérieur. Les dégâts augmentent de 2d8 par niveau d’emplacement au-delà du 6e.","classes":["sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"cercle-de-teleportation","name":"Cercle de téléportation","level":5,"school":"conjuration","castingTime":"1 minute","range":"3 m","components":{"verbal":true,"somatic":false,"material":true,"materialText":"encres rares d’une valeur minimale de 50 po, que le sort détruit"},"duration":"1 round","concentration":false,"ritual":false,"description":"À l’incantation du sort, vous tracez un cercle de 1,50 m de diamètre au sol, composé de symboles qui relient votre emplacement à un cercle de téléportation permanent de votre choix dont vous connaissez la séquence de runes et situé sur le même plan d’existence que vous. Un portail chatoyant s’ouvre au sein du cercle ainsi tracé et reste ouvert jusqu’à la fin de votre tour suivant. Toute créature qui pénètre dans le portail apparaît aussitôt dans un rayon de 1,50 m du cercle de destination ou, si cet espace n’est pas libre, dans l’espace inoccupé le plus proche.\n\nDe nombreux temples et guildes importants disposent d’un cercle de téléportation permanent dans leurs locaux. Chaque cercle comprend toujours sa propre séquence de runes, une suite de symboles à l’agencement unique.\n\nLa première fois que vous acquérez la faculté de lancer ce sort, vous apprenez la séquence de runes de deux destinations du Plan Matériel, déterminées par le MJ. Vous y ajouterez éventuellement d’autres séquences au fil de vos aventures. Graver une nouvelle séquence de runes dans votre mémoire nécessite de l’étudier pendant 1 minute.\n\nVous pouvez créer un cercle de téléportation permanent en lançant quotidiennement ce sort au même endroit pendant 365 jours.","classes":["bard","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"cercle-magique","name":"Cercle magique","level":3,"school":"abjuration","castingTime":"1 minute","range":"3 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"poudre d’argent et sel d’une valeur minimale de 100 po, que le sort détruit"},"duration":"1 heure","concentration":false,"ritual":false,"description":"Vous créez un Cylindre d’énergies magiques, de 3 m de rayon et 6 m de haut, centré sur un point du sol que vous voyez à portée. Des runes luisantes apparaissent sur toute surface comprise dans le Cylindre, y compris le sol. Choisissez un ou plusieurs types parmi les suivants : Célestes, Élémentaires, Fées, Fiélons et Morts-vivants. Le cercle affecte les créatures du ou des types retenus des façons suivantes :\n\n• La créature ne peut pénétrer dans le Cylindre de son plein gré sans recourir à des moyens magiques. Si la créature recourt à la téléportation ou au voyage interplanaire pour ce faire, elle doit d’abord réussir un jet de sauvegarde de Charisme.\n\n• La créature a le Désavantage aux jets d’attaque contre les cibles situées dans le Cylindre.\n\n• La créature ne peut pas posséder une cible comprise dans le Cylindre ni lui imposer l’état Charmé ou Effrayé.\n\nÀ chaque incantation du sort, vous pouvez inverser l’orientation de sa magie, c’est-à-dire en empêchant toute créature du ou des types retenus de quitter le Cylindre et en protégeant les cibles qui se trouvent à l’extérieur.\n\nEmplacement de niveau supérieur. La durée augmente de 1 heure par niveau d’emplacement au-delà du 3e.","classes":["cleric","wizard","warlock","paladin"],"source":"SRD 5.2.1"},{"canonicalId":"chaine-d-eclairs","name":"Chaîne d’éclairs","level":6,"school":"evocation","castingTime":"action","range":"45 m","components":{"verbal":true,"somatic":true,"material":true,"materialText":"trois broches en argent"},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous projetez un trait de foudre vers une cible que vous voyez à portée. Trois éclairs jaillissent alors de cette cible vers un maximum de trois autres cibles, que vous choisissez, distantes de 9 m ou moins de la première. Toutes ces cibles peuvent être des créatures ou des objets, et ne peuvent être ciblées par plus d’un éclair.\n\nChaque cible effectue un jet de sauvegarde de Dextérité, et subit 10d8 dégâts de foudre en cas d’échec, la moitié en cas de réussite.\n\nEmplacement de niveau supérieur. Un éclair supplémentaire jaillit de la première cible vers une autre par niveau d’emplacement au-delà du 6e.","classes":["sorcerer","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"charme-monstre","name":"Charme-monstre","level":4,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Une créature que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Ce jet s’effectue avec l’Avantage si vous ou vos alliés êtes en train de l’affronter. En cas d’échec, la cible subit l’état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts.\n\nLa créature ainsi Charmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l’avez Charmée.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 4e.","classes":["bard","druid","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"charme-personne","name":"Charme-personne","level":1,"school":"enchantment","castingTime":"action","range":"9 m","components":{"verbal":true,"somatic":true,"material":false},"duration":"1 heure","concentration":false,"ritual":false,"description":"Un Humanoïde que vous voyez à portée effectue un jet de sauvegarde de Sagesse. Ce jet s’effectue avec l’Avantage si vous ou vos alliés êtes en train de l’affronter. En cas d’échec, la cible subit l’état Charmé jusqu’à la fin du sort ou que vous ou vos alliés lui infligiez des dégâts.\n\nLa créature ainsi Charmée vous est Amicale. Lorsque le sort prend fin, la cible sait que vous l’avez Charmée.\n\nEmplacement de niveau supérieur. Vous pouvez cibler une créature supplémentaire par niveau d’emplacement au-delà du 1.","classes":["bard","druid","sorcerer","wizard","warlock"],"source":"SRD 5.2.1"},{"canonicalId":"champ-antimagie","name":"Champ antimagie","level":8,"school":"abjuration","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"limaille de fer"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Une aura d’antimagie vous entoure sous forme d’une Émanation de 3 m. Nul ne peut lancer de sorts dans la zone, ni y entreprendre l’action Magie ou y produire des effets magiques. De tels effets, quelle que soit leur source, n’ont en outre aucun effet sur les cibles dans la zone.\n\nLes propriétés magiques des objets magiques ne fonctionnent pas à l’intérieur de l’aura ni sur ce qui s’y trouve. Les zones d’effet produites par des sorts ou effets magiques n’englobent pas l’aura et nul ne peut se téléporter ou recourir au voyage planaire pour entrer dans l’aura ou en sortir. Les portails sont fermés tant qu’ils sont dans l’aura.\n\nLes sorts en cours, à l’exception de ceux qui émanent d’un artefact ou d’une divinité, sont réprimés dans l’aura. Tant qu’un effet est réprimé, il n’est pas actif, mais tout le temps qu’il passe ainsi réprimé est décompté de sa durée.\n\nDissipation de la magie reste sans effet sur l’aura, et les auras créées par plusieurs sorts champ antimagie ne s’annulent pas mutuellement.","classes":["cleric","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"changement-de-forme","name":"Changement de forme","level":9,"school":"transmutation","castingTime":"action","range":"personnelle","components":{"verbal":true,"somatic":true,"material":true,"materialText":"diadème de jade d’une valeur minimale de 1 500 po"},"duration":"Concentration, jusqu’à 1 heure","concentration":true,"ritual":false,"description":"Vous vous métamorphosez en une autre créature pour toute la durée, mais avez la possibilité d’entreprendre l’action Magie pour adopter une autre forme couverte par le sort. La nouvelle forme doit être une créature dont le facteur de puissance n’est pas supérieur à votre niveau ou FP. Vous devez avoir déjà vu une telle créature, qui ne peut être ni un Artificiel ni un Mort-vivant.\n\nEn lançant ce sort, vous recevez autant de points de vie temporaires que les points de vie de la première forme adoptée. Ces points de vie temporaires disparaissent s’il en reste à la fin du sort.\n\nVotre profil de jeu est remplacé par celui de la créature retenue, mais vous conservez certains de vos aspects : type de créature, alignement, personnalité, valeurs d’Intelligence, de Sagesse et de Charisme, points de vie, dés de vie, maîtrises et facultés de communication. Si vous disposez de l’aptitude Sorts ou Incantation, vous la conservez aussi.\n\nLors de la transformation, vous déterminez si votre équipement tombe au sol ou change de taille et de configuration pour s’adapter à votre nouvelle forme.","classes":["druid","wizard"],"source":"SRD 5.2.1"},{"canonicalId":"changement-de-plan","name":"Changement de plan","level":7,"school":"conjuration","castingTime":"action","range":"contact","components":{"verbal":true,"somatic":true,"material":true,"materialText":"une badine métallique fourchue d’une valeur minimale de 250 po, accordée avec un plan d’existence."},"duration":"instantanée","concentration":false,"ritual":false,"description":"Vous et un maximum de huit créatures consentantes avec lesquelles vous formez un cercle en vous tenant par la main êtes transportés sur un autre plan d’existence.\n\nVous pouvez spécifier une destination en des termes généraux, comme une cité donnée du Plan Élémentaire du Feu ou un palais précis sur la deuxième strate des Neuf Enfers, auquel cas vous apparaissez à destination ou à proximité (à l’appréciation du MJ).\n\nOu bien, si vous connaissez la séquence de runes d’un cercle de téléportation sur un autre plan d’existence, ce sort vous transporte directement dans le cercle. Si le cercle de téléportation est trop petit pour accueillir toutes les créatures transportées, elles apparaissent dans les espaces inoccupés les plus proches du cercle.","classes":["cleric","druid"
